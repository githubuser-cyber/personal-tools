<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2fb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="工具箱" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>个人工具箱</title>
  <style>
    :root {
      --text: #1e2533;
      --text-regular: #4a5568;
      --muted: #8790a3;
      --primary: #1677ff;
      --primary-soft: rgba(22, 119, 255, 0.1);
      --primary-border: rgba(22, 119, 255, 0.32);
      --grad: linear-gradient(135deg, #1677ff 0%, #7c5cff 100%);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #eef2fb;
      --glass: rgba(255, 255, 255, 0.62);
      --glass-strong: rgba(255, 255, 255, 0.84);
      --glass-border: rgba(255, 255, 255, 0.78);
      --line: rgba(30, 41, 59, 0.08);
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 30px rgba(30, 64, 175, 0.08);
      --shadow-pop: 0 18px 48px rgba(30, 41, 90, 0.18);
      --blur: saturate(170%) blur(18px);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --topbar-h: 56px;
      --pt-banner-top: 68px;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* 渐变光晕只画一层静态背景；工具页嵌进来时背景透明，共用这一层，不重复绘制 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(44vmax 44vmax at 6% -6%, rgba(22, 119, 255, 0.26), transparent 70%),
        radial-gradient(40vmax 40vmax at 104% 8%, rgba(139, 92, 246, 0.22), transparent 70%),
        radial-gradient(46vmax 46vmax at 62% 112%, rgba(6, 182, 212, 0.16), transparent 70%);
    }

    button { font: inherit; }

    .shell {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
    }

    /* —— 顶栏 —— */
    .topbar {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: calc(var(--topbar-h) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      background: rgba(255, 255, 255, 0.55);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 1px 0 var(--line), 0 6px 24px rgba(30, 64, 175, 0.05);
    }

    .brand {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      color: var(--text);
      background: none;
      border: 0;
      cursor: pointer;
    }

    .brand-logo {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      color: #fff;
      background: var(--grad);
      border-radius: 9px;
      box-shadow: 0 4px 12px rgba(22, 119, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .brand-logo svg {
      width: 16px;
      height: 16px;
    }

    .brand-name {
      background: linear-gradient(135deg, #1e2533 30%, #1677ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tabs {
      position: relative;
      display: flex;
      gap: 2px;
      min-width: 0;
      padding: 4px;
      overflow-x: auto;
      background: rgba(30, 41, 59, 0.06);
      border-radius: 12px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    /* 选中态是一块滑动的白色胶囊，切换时平移过去 */
    .tab-indicator {
      position: absolute;
      top: 4px;
      left: 0;
      width: 0;
      height: calc(100% - 8px);
      background: #fff;
      border-radius: 9px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 14px rgba(22, 119, 255, 0.16);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s;
      pointer-events: none;
    }

    .tab {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-regular);
      background: transparent;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s;
    }

    .tab svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
    }

    .tab:hover { color: var(--text); }

    .tab.is-active {
      font-weight: 600;
      color: var(--primary);
    }

    .tab:focus-visible,
    .brand:focus-visible,
    .pill-btn:focus-visible,
    .tool-card:focus-visible,
    .notice:focus-visible {
      outline: 2px solid var(--primary-border);
      outline-offset: 2px;
    }

    /* 剪贴板连接状态：绿=已连接，橙=连接中，红=连不上，灰=没进房间 */
    .status-dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b8bfcc;
    }

    .status-dot.is-on {
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }

    .status-dot.is-busy { background: var(--warning); }

    .status-dot.is-err { background: var(--danger); }

    .tab-badge {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      font-size: 11px;
      font-weight: 600;
      line-height: 18px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #ff6b6b, #ef4444);
      border-radius: 9px;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.35);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .pill-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-regular);
      background: var(--glass-strong);
      border: 1px solid var(--line);
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .pill-btn:hover {
      color: var(--primary);
      border-color: var(--primary-border);
      box-shadow: 0 4px 14px rgba(22, 119, 255, 0.12);
    }

    .pill-btn svg {
      width: 15px;
      height: 15px;
    }

    .pill-btn.is-install {
      font-weight: 600;
      color: #fff;
      background: var(--grad);
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(22, 119, 255, 0.3);
    }

    .pill-btn.is-install:hover {
      color: #fff;
      filter: brightness(1.06);
    }

    /* —— 工具区 —— */
    .frames {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .frames iframe {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    .frames iframe.is-active {
      display: block;
      animation: frame-in 0.22s ease-out;
    }

    @keyframes frame-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .welcome {
      position: absolute;
      inset: 0;
      display: none;
      overflow: auto;
      padding: 56px 20px 40px;
    }

    .welcome.is-active {
      display: block;
      animation: frame-in 0.22s ease-out;
    }

    .welcome-inner {
      max-width: 960px;
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 14px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      box-shadow: var(--shadow-card);
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--grad);
    }

    .welcome h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #1e2533 20%, #1677ff 60%, #7c5cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome .lead {
      max-width: 680px;
      margin: 0 0 28px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-regular);
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .tool-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 22px;
      overflow: hidden;
      text-align: left;
      color: var(--text);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s, border-color 0.2s;
    }

    /* 鼠标所在位置的柔光，跟着指针走 */
    .tool-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(22, 119, 255, 0.14), transparent 65%);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .tool-card:hover {
      border-color: rgba(22, 119, 255, 0.28);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04), 0 18px 40px rgba(30, 64, 175, 0.14);
      transform: translateY(-3px);
    }

    .tool-card:hover::before { opacity: 1; }

    .tool-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      color: #fff;
      background: var(--tool-grad, var(--grad));
      border-radius: 13px;
      box-shadow: 0 6px 16px rgba(22, 119, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .tool-icon svg {
      width: 22px;
      height: 22px;
    }

    .tool-name {
      font-size: 17px;
      font-weight: 700;
    }

    .tool-desc {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-regular);
    }

    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tool-tag {
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 999px;
    }

    .tool-open {
      margin-top: auto;
      padding-top: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }

    .tool-card:hover .tool-open { text-decoration: underline; }

    .welcome-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }

    .welcome-foot span::before {
      content: "✓ ";
      color: var(--success);
      font-weight: 700;
    }

    /* —— 右上角提醒：收到剪贴板内容、跨工具发送结果 —— */
    .notice {
      position: fixed;
      top: calc(var(--topbar-h) + env(safe-area-inset-top) + 12px);
      right: max(16px, env(safe-area-inset-right));
      z-index: 30;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: min(360px, calc(100vw - 32px));
      padding: 14px 16px;
      text-align: left;
      color: var(--text);
      background: rgba(255, 255, 255, 0.8);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: var(--shadow-pop);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(16px);
      transition: opacity 0.2s, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.2s;
    }

    .notice.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
    }

    .notice .tool-icon {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 10px;
    }

    .notice .tool-icon svg {
      width: 18px;
      height: 18px;
    }

    .notice.is-warn .tool-icon {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.3);
    }

    .notice-body {
      flex: 1;
      min-width: 0;
    }

    .notice-title,
    .notice-text,
    .notice-hint { display: block; }

    .notice-title {
      font-size: 14px;
      font-weight: 600;
    }

    .notice-text {
      margin-top: 2px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-regular);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .notice-hint {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
    }

    @media (max-width: 760px) {
      #clipChip { display: none; }
    }

    @media (max-width: 640px) {
      .topbar { gap: 10px; }

      .brand-name,
      .pill-btn.is-install span { display: none; }

      .pill-btn.is-install { padding: 0 9px; }

      .tabs { flex: 1; }

      .tab {
        flex: 1 1 0;
        padding: 0 8px;
      }

      .welcome { padding: 32px 16px; }
    }

    @media (max-width: 380px) {
      .tab svg { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tab-indicator,
      .tool-card,
      .notice { transition: none; }

      .frames iframe.is-active,
      .welcome.is-active { animation: none; }
    }
  </style>
  <script src="./assets/pwa.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button type="button" class="brand" id="brand" title="回到工具列表">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </span>
        <span class="brand-name">个人工具箱</span>
      </button>
      <nav class="tabs" id="tabs" role="tablist" aria-label="工具切换">
        <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
      </nav>
      <div class="topbar-right">
        <button type="button" class="pill-btn" id="clipChip" hidden>
          <span class="status-dot" id="clipChipDot"></span>
          <span id="clipChipText"></span>
        </button>
        <button type="button" class="pill-btn is-install" id="installBtn" hidden title="装到电脑桌面或手机主屏，像 App 一样打开，断网也能用">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
          <span>安装</span>
        </button>
      </div>
    </header>
    <main class="frames" id="frames">
      <section class="welcome is-active" id="welcome">
        <div class="welcome-inner">
          <p class="eyebrow">个人工具箱</p>
          <h1>今天想用哪个工具？</h1>
          <p class="lead">三个工具在同一个窗口里切换，互不打断：剪贴板进房后，切去写周报、拼图也一直在线；拼好的长图一键发到手机，手机传来的截图一键拿去拼。</p>
          <div class="welcome-grid" id="welcomeGrid"></div>
          <div class="welcome-foot">
            <span>周报、拼图全程在本机处理，不上传</span>
            <span>剪贴板用房间口令端到端加密</span>
            <span id="installTip">装到桌面后断网也能打开（iPhone 用 Safari「分享 → 添加到主屏幕」）</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <button type="button" class="notice" id="notice" aria-live="polite">
    <span class="tool-icon" id="noticeIcon" aria-hidden="true"></span>
    <span class="notice-body">
      <span class="notice-title" id="noticeTitle"></span>
      <span class="notice-text" id="noticeText"></span>
      <span class="notice-hint" id="noticeHint"></span>
    </span>
  </button>

  <script>
(() => {
  const LAST_KEY = "pt-shell-last-tab";
  const CLIPBOARD_ROOM_KEY = "pt-clipboard-room";
  const CLIPBOARD_JOINED_KEY = "pt-clipboard-joined";
  const CLIPBOARD_NOTIFY_KEY = "pt-clipboard-notify";
  const SHELL_SOURCE = "pt-shell";
  const TOOL_SOURCES = { "pt-weekly": "weekly", "pt-stitch": "stitch", "pt-clipboard": "clipboard" };
  const SW_OPEN_TOOL_MESSAGE = "pt-open-tool";
  const CLIPBOARD_PRELOAD_DELAY_MS = 800;
  const NOTICE_MS = 6000;
  const ICONS = {
    weekly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
    stitch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="8" rx="1.5"/><rect x="4" y="13" width="16" height="8" rx="1.5"/></svg>',
    clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'
  };
  const TOOLS = [
    {
      id: "weekly",
      name: "周报填写",
      src: "./tools/weekly-report/",
      desc: "边填边按项目、进度自动排好，写完一键复制成文；每周自动存档，往期随时翻",
      tags: ["实时整理", "往期存档", "断网可用"],
      grad: "linear-gradient(135deg, #1677ff, #06b6d4)"
    },
    {
      id: "stitch",
      name: "图片拼接",
      src: "./tools/image-stitch/",
      desc: "多张截图拼成长图、宽图或宫格，长截图自动去掉重复部分，可标注、打码、裁剪",
      tags: ["长截图去重", "宫格", "标注打码"],
      grad: "linear-gradient(135deg, #7c5cff, #c084fc)"
    },
    {
      id: "clipboard",
      name: "共享剪贴板",
      src: "./tools/clipboard/",
      desc: "手机、电脑互传文字、截图和文件；同一个口令就连上，手机扫码直接进房",
      tags: ["端到端加密", "扫码进房", "后台通知"],
      grad: "linear-gradient(135deg, #1677ff, #7c5cff)"
    }
  ];

  const els = {
    brand: document.getElementById("brand"),
    tabs: document.getElementById("tabs"),
    tabIndicator: document.getElementById("tabIndicator"),
    frames: document.getElementById("frames"),
    welcome: document.getElementById("welcome"),
    welcomeGrid: document.getElementById("welcomeGrid"),
    installTip: document.getElementById("installTip"),
    clipChip: document.getElementById("clipChip"),
    clipChipDot: document.getElementById("clipChipDot"),
    clipChipText: document.getElementById("clipChipText"),
    installBtn: document.getElementById("installBtn"),
    notice: document.getElementById("notice"),
    noticeIcon: document.getElementById("noticeIcon"),
    noticeTitle: document.getElementById("noticeTitle"),
    noticeText: document.getElementById("noticeText"),
    noticeHint: document.getElementById("noticeHint")
  };
  const frames = new Map();
  const tabParts = new Map();
  const toolReady = new Map();
  const outbox = new Map();
  const clipboardState = { loaded: false, status: "", label: "", unread: 0 };
  const noticeState = { timer: 0, hovering: false, toolId: "" };
  let activeId = "";
  let installPrompt = null;

  function readStorage(key) {
    try {
      return localStorage.getItem(key);
    } catch (err) {
      console.error("读取本地存储失败", key, err);
      return null;
    }
  }

  function writeStorage(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (err) {
      console.error("写入本地存储失败", key, err);
    }
  }

  function toolById(id) {
    return TOOLS.find((tool) => tool.id === id) || null;
  }

  function buildTabs() {
    TOOLS.forEach((tool) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tab";
      button.setAttribute("role", "tab");
      button.setAttribute("aria-selected", "false");
      button.dataset.id = tool.id;
      button.innerHTML = ICONS[tool.id] + "<span>" + tool.name + "</span>";
      const parts = { button, dot: null, badge: null };
      if (tool.id === "clipboard") {
        parts.dot = document.createElement("span");
        parts.dot.className = "status-dot";
        parts.dot.hidden = true;
        parts.badge = document.createElement("span");
        parts.badge.className = "tab-badge";
        parts.badge.hidden = true;
        button.appendChild(parts.dot);
        button.appendChild(parts.badge);
      }
      button.addEventListener("click", () => activate(tool.id, true));
      els.tabs.appendChild(button);
      tabParts.set(tool.id, parts);

      const card = document.createElement("button");
      card.type = "button";
      card.className = "tool-card";
      card.style.setProperty("--tool-grad", tool.grad);
      card.innerHTML =
        '<span class="tool-icon" aria-hidden="true">' + ICONS[tool.id] + "</span>" +
        '<span class="tool-name">' + tool.name + "</span>" +
        '<span class="tool-desc">' + tool.desc + "</span>" +
        '<span class="tool-tags">' + tool.tags.map((tag) => '<span class="tool-tag">' + tag + "</span>").join("") + "</span>" +
        '<span class="tool-open">打开 →</span>';
      card.addEventListener("click", () => activate(tool.id, true));
      els.welcomeGrid.appendChild(card);
    });
  }

  /** 滑动胶囊对齐到当前选中的 Tab；回到工具列表时隐藏 */
  function syncTabIndicator() {
    const parts = tabParts.get(activeId);
    if (!parts) {
      els.tabIndicator.style.opacity = "0";
      return;
    }
    const button = parts.button;
    els.tabIndicator.style.width = button.offsetWidth + "px";
    els.tabIndicator.style.transform = "translateX(" + button.offsetLeft + "px)";
    els.tabIndicator.style.opacity = "1";
  }

  /** iframe 只建一次、切换只改显隐，保证剪贴板在其他工具里也不断线 */
  function ensureFrame(tool) {
    if (frames.has(tool.id)) return frames.get(tool.id);
    const iframe = document.createElement("iframe");
    iframe.title = tool.name;
    iframe.setAttribute("allow", "clipboard-read; clipboard-write");
    iframe.src = tool.src;
    els.frames.appendChild(iframe);
    frames.set(tool.id, iframe);
    toolReady.set(tool.id, false);
    if (tool.id === "clipboard") {
      clipboardState.loaded = true;
      if (!clipboardState.label) clipboardState.label = "加载中…";
      renderClipboardIndicators();
    }
    return iframe;
  }

  /** 发给某个工具；工具还没加载完先排队，等它报「ready」再统一发出 */
  function postToTool(id, message) {
    const tool = toolById(id);
    if (!tool) return;
    const frame = ensureFrame(tool);
    const payload = Object.assign({ source: SHELL_SOURCE }, message);
    if (toolReady.get(id) && frame.contentWindow) {
      frame.contentWindow.postMessage(payload, "/");
      return;
    }
    const queue = outbox.get(id) || [];
    queue.push(payload);
    outbox.set(id, queue);
  }

  function markToolReady(id) {
    toolReady.set(id, true);
    const queue = outbox.get(id) || [];
    outbox.delete(id);
    const frame = frames.get(id);
    queue.forEach((payload) => frame.contentWindow.postMessage(payload, "/"));
  }

  function activate(id, updateHash) {
    const tool = toolById(id);
    if (!tool) return;
    activeId = id;
    els.welcome.classList.remove("is-active");
    ensureFrame(tool);
    TOOLS.forEach((item) => {
      const on = item.id === id;
      const parts = tabParts.get(item.id);
      parts.button.classList.toggle("is-active", on);
      parts.button.setAttribute("aria-selected", on ? "true" : "false");
      parts.button.tabIndex = on ? 0 : -1;
      const frame = frames.get(item.id);
      if (frame) frame.classList.toggle("is-active", on);
    });
    writeStorage(LAST_KEY, id);
    if (updateHash && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    if (id === "clipboard") {
      if (noticeState.toolId === "clipboard") hideNotice();
      if (!document.hidden) clipboardState.unread = 0;
    }
    renderClipboardIndicators();
    syncTabIndicator();
  }

  function showWelcome() {
    activeId = "";
    els.welcome.classList.add("is-active");
    TOOLS.forEach((item) => {
      const parts = tabParts.get(item.id);
      parts.button.classList.remove("is-active");
      parts.button.setAttribute("aria-selected", "false");
      parts.button.tabIndex = 0;
      const frame = frames.get(item.id);
      if (frame) frame.classList.remove("is-active");
    });
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    renderClipboardIndicators();
    syncTabIndicator();
  }

  function updateTitle() {
    const tool = toolById(activeId);
    const base = tool ? tool.name + " · 个人工具箱" : "个人工具箱";
    document.title = clipboardState.unread ? "(" + clipboardState.unread + ") " + base : base;
  }

  function renderClipboardIndicators() {
    const parts = tabParts.get("clipboard");
    const dotClass = "status-dot" + (clipboardState.status ? " is-" + clipboardState.status : "");
    parts.dot.hidden = !clipboardState.loaded;
    parts.dot.className = dotClass;
    parts.badge.hidden = !clipboardState.unread;
    parts.badge.textContent = clipboardState.unread > 99 ? "99+" : String(clipboardState.unread);
    parts.button.title = clipboardState.loaded ? "共享剪贴板：" + clipboardState.label : "共享剪贴板";
    els.clipChip.hidden = !clipboardState.loaded || activeId === "clipboard";
    els.clipChipDot.className = dotClass;
    els.clipChipText.textContent = "剪贴板 · " + clipboardState.label;
    els.clipChip.title = "切换到共享剪贴板";
    updateTitle();
  }

  /**
   * 右上角提醒。toolId 有值时点击跳到该工具；warn 用橙色图标。
   * 鼠标悬停时不自动消失，方便看完。
   */
  function showNotice(options) {
    noticeState.toolId = options.toolId || "";
    els.noticeIcon.innerHTML = options.warn || !options.toolId ? ICONS.check : ICONS[options.toolId];
    els.noticeIcon.style.background = options.warn ? "" : (toolById(options.toolId) || TOOLS[2]).grad;
    els.notice.classList.toggle("is-warn", Boolean(options.warn));
    els.noticeTitle.textContent = options.title;
    els.noticeText.textContent = options.text || "";
    els.noticeText.hidden = !options.text;
    els.noticeHint.textContent = options.hint || (noticeState.toolId ? "点击查看" : "");
    els.noticeHint.hidden = !els.noticeHint.textContent;
    els.notice.classList.add("show");
    noticeState.hovering = false;
    scheduleNoticeHide();
  }

  function scheduleNoticeHide() {
    clearTimeout(noticeState.timer);
    noticeState.timer = setTimeout(() => {
      if (!noticeState.hovering) hideNotice();
    }, NOTICE_MS);
  }

  function hideNotice() {
    clearTimeout(noticeState.timer);
    els.notice.classList.remove("show");
  }

  /** 工具箱不在前台时，收到剪贴板内容弹系统通知（需在剪贴板里打开「后台通知」并授权） */
  function notifySystem(title, body) {
    if (readStorage(CLIPBOARD_NOTIFY_KEY) !== "1") return;
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (!document.hidden && document.hasFocus()) return;
    const options = { body: body, tag: "pt-clipboard", renotify: true, icon: "./icons/icon-192.png", data: { tool: "clipboard" } };
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready
        .then((registration) => registration.showNotification(title, options))
        .catch((err) => console.error("系统通知发送失败", err));
      return;
    }
    try {
      const notification = new Notification(title, options);
      notification.onclick = () => {
        window.focus();
        activate("clipboard", true);
        notification.close();
      };
    } catch (err) {
      console.error("系统通知发送失败", err);
    }
  }

  function handleClipboardMessage(data) {
    if (data.type === "status") {
      clipboardState.status = String(data.status || "");
      clipboardState.label = String(data.label || "未进入房间");
      renderClipboardIndicators();
      return;
    }
    if (data.type === "received") {
      const title = "共享剪贴板 · 来自「" + String(data.from || "对端") + "」";
      const summary = String(data.summary || "收到新内容");
      notifySystem(title, summary);
      if (activeId === "clipboard" && !document.hidden) return;
      clipboardState.unread += 1;
      renderClipboardIndicators();
      if (activeId !== "clipboard") showNotice({ toolId: "clipboard", title: title, text: summary });
      return;
    }
    if (data.type === "send-result") {
      postToTool("stitch", {
        type: "share-result",
        requestId: data.requestId,
        ok: Boolean(data.ok),
        warn: Boolean(data.warn),
        message: String(data.message || "")
      });
      if (!data.ok && data.needRoom) {
        showNotice({ toolId: "clipboard", warn: true, title: "共享剪贴板还没进房间", text: "填好口令进房后，再回来点「发到剪贴板」", hint: "点击去进房" });
      }
      return;
    }
    if (data.type === "open-in-stitch" && Array.isArray(data.files) && data.files.length) {
      activate("stitch", true);
      postToTool("stitch", { type: "add-images", files: data.files, from: "共享剪贴板" });
    }
  }

  function handleStitchMessage(data) {
    if (data.type === "share-to-clipboard" && Array.isArray(data.files) && data.files.length) {
      postToTool("clipboard", { type: "send-files", requestId: data.requestId, files: data.files, from: "图片拼接" });
    }
  }

  /** 只认自己建的 iframe，且 source 标识要和 iframe 对得上，其余消息一律忽略 */
  function onFrameMessage(event) {
    let fromId = "";
    frames.forEach((frame, id) => {
      if (frame.contentWindow === event.source) fromId = id;
    });
    const data = event.data;
    if (!fromId || !data || TOOL_SOURCES[data.source] !== fromId) return;
    if (data.type === "ready") {
      markToolReady(fromId);
      return;
    }
    if (fromId === "clipboard") handleClipboardMessage(data);
    else if (fromId === "stitch") handleStitchMessage(data);
  }

  function resolveInitial() {
    const hash = (location.hash || "").replace(/^#/, "");
    if (toolById(hash)) return hash;
    const last = readStorage(LAST_KEY);
    return toolById(last) ? last : "";
  }

  /** 上次在剪贴板里没点「离开」：后台提前加载，打开工具箱就自动连上 */
  function shouldPreloadClipboard() {
    return Boolean((readStorage(CLIPBOARD_ROOM_KEY) || "").trim()) && readStorage(CLIPBOARD_JOINED_KEY) !== "0";
  }

  function onTabsKeydown(event) {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    const index = TOOLS.findIndex((tool) => tool.id === activeId);
    const step = event.key === "ArrowRight" ? 1 : -1;
    const next = TOOLS[(Math.max(index, 0) + step + TOOLS.length) % TOOLS.length];
    event.preventDefault();
    activate(next.id, true);
    tabParts.get(next.id).button.focus();
  }

  function bindInstall() {
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      els.installBtn.hidden = false;
    });
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      els.installBtn.hidden = true;
      showNotice({ title: "已安装到桌面", text: "以后从桌面或开始菜单打开「工具箱」，断网也能用" });
    });
    els.installBtn.addEventListener("click", () => {
      if (!installPrompt) return;
      const prompt = installPrompt;
      installPrompt = null;
      els.installBtn.hidden = true;
      prompt.prompt();
      prompt.userChoice.catch((err) => console.error("安装弹窗异常", err));
    });
    if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) {
      els.installTip.textContent = "已作为 App 安装，断网也能打开";
    }
  }

  function bindEvents() {
    els.brand.addEventListener("click", showWelcome);
    els.tabs.addEventListener("keydown", onTabsKeydown);
    els.clipChip.addEventListener("click", () => activate("clipboard", true));
    els.notice.addEventListener("click", () => {
      const target = noticeState.toolId;
      hideNotice();
      if (target) activate(target, true);
    });
    els.notice.addEventListener("mouseenter", () => {
      noticeState.hovering = true;
      clearTimeout(noticeState.timer);
    });
    els.notice.addEventListener("mouseleave", () => {
      noticeState.hovering = false;
      scheduleNoticeHide();
    });
    els.welcomeGrid.addEventListener("pointermove", (event) => {
      const card = event.target.closest(".tool-card");
      if (!card) return;
      const rect = card.getBoundingClientRect();
      card.style.setProperty("--mx", (event.clientX - rect.left) + "px");
      card.style.setProperty("--my", (event.clientY - rect.top) + "px");
    });
    window.addEventListener("message", onFrameMessage);
    window.addEventListener("hashchange", () => {
      const hash = (location.hash || "").replace(/^#/, "");
      if (toolById(hash)) activate(hash, false);
    });
    window.addEventListener("resize", syncTabIndicator);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || activeId !== "clipboard" || !clipboardState.unread) return;
      clipboardState.unread = 0;
      renderClipboardIndicators();
    });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.type === SW_OPEN_TOOL_MESSAGE && toolById(data.tool)) activate(data.tool, true);
      });
    }
    bindInstall();
  }

  buildTabs();
  bindEvents();
  const initial = resolveInitial();
  if (initial) activate(initial, true);
  else renderClipboardIndicators();
  if (initial !== "clipboard" && shouldPreloadClipboard()) {
    setTimeout(() => ensureFrame(toolById("clipboard")), CLIPBOARD_PRELOAD_DELAY_MS);
  }
})();
  </script>
</body>
</html>
