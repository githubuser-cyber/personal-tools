<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="工具箱" />
  <title>个人工具箱</title>
  <style>
    :root {
      --text: #303133;
      --muted: #909399;
      --accent: #1677FF;
      --accent-2: #0958D9;
      --border: #e4e7ed;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --radius: 8px;
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 56px;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding: 20px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 4px;
      background: #ecf5ff;
      border: 1px solid #d9ecff;
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .badge i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 3.5vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .hero p {
      margin: 0;
      max-width: 36em;
      color: var(--muted);
      font-size: 14px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 4px 10px;
      border-radius: 4px;
      background: #fff;
      border: 1px solid var(--border);
      color: #606266;
      font-size: 12px;
      font-weight: 500;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .tool-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 188px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .tool-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 3px;
      height: 100%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .tool-card:hover,
    .tool-card:focus-visible {
      border-color: #c6e2ff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      outline: none;
    }

    .tool-card:hover::before,
    .tool-card:focus-visible::before {
      opacity: 1;
    }

    .tool-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      background: #ecf5ff;
      color: var(--accent);
    }

    .tool-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-card h2 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 600;
    }

    .tool-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      flex: 1;
    }

    .tool-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 12px;
      font-weight: 500;
      color: #909399;
      background: #f5f7fa;
      border-radius: 4px;
      padding: 2px 8px;
    }

    .go {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      white-space: nowrap;
    }

    footer {
      margin-top: 36px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <div class="badge"><i></i> 纯本地 · 可离线</div>
        <h1>个人工具箱</h1>
        <p>常用小工具合集，数据留在本机浏览器，不上传服务器。</p>
      </div>
      <div class="hero-meta">
        <span class="chip">GitHub Pages</span>
        <span class="chip">无账号</span>
      </div>
    </header>

    <div class="tools" id="toolList"></div>

    <footer>跨设备：在工具内「复制 / 导入」成稿文字即可同步内容</footer>
  </div>

  <script>
(function () {
  var tools = [
    {
      name: "周报填写助手",
      desc: "本周 / 下周事项填写、预览、按项目整理，一键复制与导入成稿。",
      href: "./tools/weekly-report/",
      tags: ["办公", "草稿"],
      icon: '<svg viewBox="0 0 24 24"><path d="M8 4h8v3H8z"/><path d="M6 7h12v14H6z"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>'
    },
    {
      name: "图片拼接助手",
      desc: "批量上传、拖拽或粘贴，横纵拼接，标注后复制 / 下载，全程离线。",
      href: "./tools/image-stitch/",
      tags: ["图片", "离线"],
      icon: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>'
    },
    {
      name: "共享剪贴板",
      desc: "同一口令跨设备同步文字/文件。走 MQTT 通道，少限流。",
      href: "./tools/clipboard/",
      tags: ["同步", "需联网"],
      icon: '<svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="4" rx="1"/><rect x="5" y="7" width="14" height="14" rx="2"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>'
    }
  ];

  var list = document.getElementById("toolList");
  list.innerHTML = tools.map(function (tool) {
    var tags = tool.tags.map(function (t) {
      return '<span class="tag">' + t + "</span>";
    }).join("");
    return (
      '<a class="tool-card" href="' + tool.href + '">' +
        '<div class="tool-icon">' + tool.icon + "</div>" +
        "<h2>" + tool.name + "</h2>" +
        "<p>" + tool.desc + "</p>" +
        '<div class="tool-foot"><div class="tags">' + tags + '</div><span class="go">打开 →</span></div>' +
      "</a>"
    );
  }).join("");
})();
  </script>
</body>
</html>
