<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="工具箱" />
  <title>个人工具箱</title>
  <style>
    :root {
      --bg0: #eef2f7;
      --bg1: #f7f9fc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(148, 163, 184, 0.35);
      --accent: #0ea5e9;
      --accent-2: #0284c7;
      --radius: 20px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.06);
      --shadow-hover: 0 8px 28px rgba(14, 165, 233, 0.14), 0 2px 8px rgba(15, 23, 42, 0.06);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      font-size: 16px;
      line-height: 1.55;
      -webkit-text-size-adjust: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(14, 165, 233, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(45, 212, 191, 0.12), transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 56px;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .badge i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.75rem, 4vw, 2.15rem);
      font-weight: 780;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .hero p {
      margin: 0;
      max-width: 36em;
      color: var(--muted);
      font-size: 1rem;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border);
      color: #475569;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .tool-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 198px;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .tool-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--card-a, #0ea5e9), var(--card-b, #2dd4bf));
      opacity: 0.9;
    }

    .tool-card:hover,
    .tool-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(14, 165, 233, 0.35);
      outline: none;
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      background: linear-gradient(145deg, var(--card-soft, #e0f2fe), #fff);
      color: var(--card-a, #0284c7);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
    }

    .tool-icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-card h2 {
      margin: 0 0 8px;
      font-size: 1.18rem;
      font-weight: 720;
      letter-spacing: -0.02em;
    }

    .tool-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.93rem;
      flex: 1;
    }

    .tool-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #475569;
      background: #f1f5f9;
      border-radius: 999px;
      padding: 3px 8px;
    }

    .go {
      font-size: 0.88rem;
      font-weight: 750;
      color: var(--accent-2);
      white-space: nowrap;
    }

    footer {
      margin-top: 36px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <div class="badge"><i></i> 纯本地 · 可离线</div>
        <h1>个人工具箱</h1>
        <p>常用小工具合集，数据留在本机浏览器，不上传服务器。</p>
      </div>
      <div class="hero-meta">
        <span class="chip">GitHub Pages</span>
        <span class="chip">无账号</span>
      </div>
    </header>

    <div class="tools" id="toolList"></div>

    <footer>跨设备：在工具内「复制 / 导入」成稿文字即可同步内容</footer>
  </div>

  <script>
(function () {
  var tools = [
    {
      name: "周报填写助手",
      desc: "本周 / 下周事项填写、预览、按项目整理，一键复制与导入成稿。",
      href: "./tools/weekly-report/",
      tags: ["办公", "草稿"],
      a: "#0ea5e9",
      b: "#38bdf8",
      soft: "#e0f2fe",
      icon: '<svg viewBox="0 0 24 24"><path d="M8 4h8v3H8z"/><path d="M6 7h12v14H6z"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>'
    },
    {
      name: "图片拼接助手",
      desc: "批量上传、拖拽或粘贴，横纵拼接，标注后复制 / 下载，全程离线。",
      href: "./tools/image-stitch/",
      tags: ["图片", "离线"],
      a: "#0d9488",
      b: "#2dd4bf",
      soft: "#ccfbf1",
      icon: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>'
    }
  ];

  var list = document.getElementById("toolList");
  list.innerHTML = tools.map(function (tool) {
    var tags = tool.tags.map(function (t) {
      return '<span class="tag">' + t + "</span>";
    }).join("");
    return (
      '<a class="tool-card" href="' + tool.href + '" style="--card-a:' + tool.a + ';--card-b:' + tool.b + ';--card-soft:' + tool.soft + '">' +
        '<div class="tool-icon">' + tool.icon + "</div>" +
        "<h2>" + tool.name + "</h2>" +
        "<p>" + tool.desc + "</p>" +
        '<div class="tool-foot"><div class="tags">' + tags + '</div><span class="go">打开 →</span></div>' +
      "</a>"
    );
  }).join("");
})();
  </script>
</body>
</html>
