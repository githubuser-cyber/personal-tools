<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2fb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="共享剪贴板" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png" />
  <title>共享剪贴板</title>
  <style>
    :root {
      --bg: #eef2fb;
      --surface: #ffffff;
      --glass: rgba(255, 255, 255, 0.7);
      --fill: rgba(241, 245, 252, 0.75);
      --text: #1e2533;
      --text-regular: #4a5568;
      --muted: #8790a3;
      --placeholder: #a9b0c0;
      --border: rgba(30, 41, 59, 0.14);
      --border-light: rgba(30, 41, 59, 0.1);
      --glass-border: rgba(255, 255, 255, 0.8);
      --primary: #1677ff;
      --primary-soft: rgba(22, 119, 255, 0.09);
      --primary-border: rgba(22, 119, 255, 0.35);
      --grad: linear-gradient(135deg, #1677ff 0%, #7c5cff 100%);
      --grad-hover: linear-gradient(135deg, #3d8bff 0%, #8f74ff 100%);
      --success: #22a35a;
      --success-text: #15803d;
      --warning: #f59e0b;
      --warning-text: #b45309;
      --danger: #ef4444;
      --danger-text: #c0392b;
      --danger-soft: rgba(239, 68, 68, 0.08);
      --danger-border: rgba(239, 68, 68, 0.28);
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 30px rgba(30, 64, 175, 0.07);
      --shadow-pop: 0 18px 48px rgba(30, 41, 90, 0.2);
      --blur: saturate(170%) blur(18px);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* 静态渐变光晕；在工具箱里时由外层统一绘制，这里透明 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(44vmax 44vmax at 6% -6%, rgba(22, 119, 255, 0.26), transparent 70%),
        radial-gradient(40vmax 40vmax at 104% 8%, rgba(139, 92, 246, 0.22), transparent 70%),
        radial-gradient(46vmax 46vmax at 62% 112%, rgba(6, 182, 212, 0.16), transparent 70%);
    }

    html.in-shell { background: transparent; }
    html.in-shell body::before { display: none; }

    button,
    input,
    textarea {
      font: inherit;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 20px calc(48px + env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    html.in-shell .app { padding-top: 16px; }
    html.in-shell .home-link { display: none !important; }

    /* —— 页头 —— */
    .page-head { margin-bottom: 14px; }

    .home-link {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
    }

    .home-link:hover { text-decoration: underline; }

    .page-head h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .page-head .sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* —— 面板 —— */
    .panel {
      margin-bottom: 14px;
      padding: 16px;
      background: var(--glass);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* —— 按钮（Element 风格，与其他工具一致） —— */
    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      color: var(--text-regular);
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      transition: color 0.15s, background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    }

    .btn:hover {
      color: var(--primary);
      background: #fff;
      border-color: var(--primary-border);
      box-shadow: 0 4px 12px rgba(22, 119, 255, 0.12);
    }

    .btn:active { transform: translateY(1px); }

    .btn:focus-visible {
      outline: 2px solid var(--primary-border);
      outline-offset: 2px;
    }

    .btn:disabled {
      color: var(--placeholder);
      background: rgba(255, 255, 255, 0.6);
      border-color: var(--border-light);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-sm {
      height: 30px;
      padding: 0 11px;
      font-size: 13px;
    }

    .btn-primary {
      color: #fff;
      background: var(--grad);
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(22, 119, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .btn-primary:hover {
      color: #fff;
      background: var(--grad-hover);
      border-color: transparent;
      box-shadow: 0 8px 22px rgba(22, 119, 255, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .btn-danger:hover {
      color: var(--danger-text);
      border-color: var(--danger-border);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.12);
    }

    /* —— 房间：进房表单 —— */
    .join-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .join-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .text-field {
      flex: 1 1 200px;
      min-width: 0;
      height: 36px;
      padding: 0 12px;
      font-size: 15px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .text-field::placeholder,
    .composer-input::placeholder { color: var(--placeholder); }

    .text-field:focus,
    .composer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .join-hint,
    .join-error {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .join-error { color: var(--danger-text); }

    /* —— 房间：已进房 —— */
    .room-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }

    .room-status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .status-dot {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }

    .room-status.is-on .status-dot {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(34, 163, 90, 0.16);
    }

    .room-status.is-busy .status-dot {
      background: var(--warning);
      animation: status-pulse 1.1s ease-in-out infinite;
    }

    .room-status.is-err .status-dot {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.14);
    }

    .room-status.is-busy { color: var(--warning-text); }
    .room-status.is-err { color: var(--danger-text); }

    @keyframes status-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .room-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }

    .room-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-regular);
    }

    .room-code {
      padding: 2px 8px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 6px;
      word-break: break-all;
    }

    .peer-list {
      display: contents;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .peer-chip {
      padding: 2px 9px;
      font-size: 12px;
      color: var(--text-regular);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-light);
      border-radius: 999px;
    }

    .peer-chip.is-self {
      color: var(--primary);
      border-color: var(--primary-border);
    }

    .room-note {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* —— 发送 —— */
    .composer.is-dragover {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft), var(--shadow);
    }

    .composer-input {
      display: block;
      width: 100%;
      min-height: 76px;
      max-height: 240px;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .composer-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .composer-tip {
      flex: 1 1 160px;
      font-size: 12px;
      color: var(--muted);
    }

    /* —— 历史 —— */
    .history-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 2px 10px;
    }

    .history-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .history-count {
      font-size: 13px;
      color: var(--muted);
    }

    .history-head .btn { margin-left: auto; }

    .history-notice {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--warning-text);
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-sm);
    }

    .history-notice span { flex: 1 1 200px; }

    .history-empty {
      margin: 0;
      padding: 28px 16px;
      font-size: 14px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.45);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .item {
      position: relative;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }

    .item.is-mine { border-left: 3px solid var(--primary); }

    .item-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .item-from {
      font-weight: 600;
      color: var(--text-regular);
    }

    .item-body { margin: 8px 0; }

    .item-text {
      margin: 0;
      max-height: 240px;
      overflow: auto;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .item-image {
      display: block;
      max-width: 100%;
      padding: 0;
      background: var(--fill);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      cursor: zoom-in;
      overflow: hidden;
    }

    .item-image img {
      display: block;
      max-width: 100%;
      max-height: 280px;
    }

    .item-caption {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }

    .item-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--fill);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
    }

    .item-file-icon {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .item-file-name {
      min-width: 0;
      font-size: 14px;
      font-weight: 500;
      word-break: break-all;
    }

    .item-file-size {
      flex: 0 0 auto;
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }

    .item-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .item-state {
      flex: 1 1 180px;
      min-width: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .item-state.is-ok { color: var(--success-text); }
    .item-state.is-busy { color: var(--primary); }
    .item-state.is-wait { color: var(--warning-text); }
    .item-state.is-err { color: var(--danger-text); }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .item-progress {
      height: 4px;
      margin-top: 10px;
      background: var(--primary-soft);
      border-radius: 999px;
      overflow: hidden;
    }

    .item-progress span {
      display: block;
      height: 100%;
      min-width: 4px;
      background: var(--grad);
      border-radius: inherit;
      transition: width 0.2s ease-out;
    }

    /* —— 图片预览 —— */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 20, 32, 0.86);
      cursor: zoom-out;
    }

    .lightbox img {
      max-width: 100%;
      max-height: calc(100vh - 48px);
      max-height: calc(100dvh - 48px);
      border-radius: 6px;
      box-shadow: var(--shadow-pop);
    }

    .lightbox-close {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      right: 12px;
      width: 40px;
      height: 40px;
      font-size: 24px;
      line-height: 1;
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .lightbox-close:hover { background: rgba(255, 255, 255, 0.24); }

    /* —— 提示 —— */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      z-index: 90;
      max-width: min(92vw, 560px);
      padding: 11px 16px;
      font-size: 14px;
      line-height: 1.45;
      color: #fff;
      background: rgba(23, 30, 45, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      box-shadow: var(--shadow-pop);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 0.2s, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.is-warn { background: rgba(146, 64, 14, 0.94); }

    @media (max-width: 560px) {
      .app {
        padding-top: 16px;
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      .panel { padding: 12px; }

      .btn { height: 40px; }
      .btn-sm { height: 34px; }

      .room-actions {
        width: 100%;
        margin-left: 0;
      }

      .room-actions .btn { flex: 1 1 0; }

      .composer-tip { flex-basis: 100%; }

      .composer-actions .btn { flex: 1 1 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn,
      .toast,
      .item-progress span { transition: none; }

      .room-status.is-busy .status-dot { animation: none; }
    }
  </style>
  <script>
    if (window.self !== window.top) document.documentElement.classList.add("in-shell");
  </script>
  <script src="../../assets/pwa.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="page-head">
      <a class="home-link" href="../../">← 工具箱</a>
      <h1>共享剪贴板</h1>
      <p class="sub">进同一个房间的设备互传文字、图片和文件 · 内容用房间码加密，中转服务器看不到</p>
    </header>

    <section class="panel" id="joinPanel" aria-label="进入房间">
      <form id="joinForm" autocomplete="off">
        <label class="join-label" for="roomInput">房间码</label>
        <div class="join-row">
          <input class="text-field" id="roomInput" type="text" maxlength="64" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="每台设备填同一个房间码" />
          <button type="button" class="btn" id="btnRandomRoom" title="生成一个不容易被猜到的房间码">随机生成</button>
          <button type="submit" class="btn btn-primary" id="btnJoin">进入房间</button>
        </div>
        <p class="join-error" id="joinError" role="alert" hidden></p>
        <p class="join-hint">几台设备都可以进同一个房间，发出的内容每台都会收到。知道房间码的人都能看到内容，别用太好猜的。</p>
      </form>
    </section>

    <section class="panel" id="roomPanel" aria-label="房间" hidden>
      <div class="room-bar">
        <div class="room-status" id="roomStatus" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="roomStatusText"></span>
        </div>
        <div class="room-actions">
          <button type="button" class="btn btn-sm btn-primary" id="btnReconnect" hidden>立即重连</button>
          <button type="button" class="btn btn-sm" id="btnCopyLink" title="复制带房间码的链接，在另一台设备上打开就直接进房">复制进房链接</button>
          <button type="button" class="btn btn-sm btn-danger" id="btnLeave" title="离开后不再收发，本机历史保留">离开房间</button>
        </div>
      </div>
      <div class="room-meta">
        <span>房间</span>
        <span class="room-code" id="roomCode"></span>
        <ul class="peer-list" id="peerList" aria-label="在线设备"></ul>
      </div>
      <p class="room-note" id="roomNote" hidden></p>
    </section>

    <section class="panel composer" id="composer" aria-label="发送" hidden>
      <textarea class="composer-input" id="textInput" aria-label="要发送的文字"></textarea>
      <div class="composer-actions">
        <span class="composer-tip" id="composerTip"></span>
        <button type="button" class="btn" id="btnPickFile">选择图片或文件</button>
        <button type="button" class="btn btn-primary" id="btnSend">发送</button>
        <input type="file" id="fileInput" multiple hidden />
      </div>
    </section>

    <section id="historySection" aria-label="历史" hidden>
      <div class="history-head">
        <h2>历史</h2>
        <span class="history-count" id="historyCount"></span>
        <button type="button" class="btn btn-sm btn-danger" id="btnClear" title="只清空这台设备上的记录，其他设备不受影响">清空本机历史</button>
      </div>
      <div class="history-notice" id="storageNotice" hidden>
        <span>这个浏览器不让保存数据（可能是隐私模式）：收发照常，但刷新后本机历史会清空。</span>
      </div>
      <div class="history-notice" id="legacyNotice" hidden>
        <span>旧版共享剪贴板的本机历史还占着这台设备的存储空间，新版不再读取它。</span>
        <button type="button" class="btn btn-sm" id="btnDropLegacy">清除旧数据</button>
      </div>
      <p class="history-empty" id="historyEmpty">还没有内容。发一段文字，或粘贴、拖入图片和文件，房间里的其他设备马上收到。</p>
      <ol class="item-list" id="itemList"></ol>
    </section>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭预览">×</button>
    <img id="lightboxImage" alt="" />
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
(() => {
  "use strict";

  function randomId(byteCount) {

  function formatBytes(byteCount) {
    if (byteCount < KB) return byteCount + " B";
    if (byteCount < MB) return (byteCount / KB).toFixed(byteCount < 10 * KB ? 1 : 0) + " KB";

  function formatTime(timestamp) {
    const date = new Date(timestamp);
    const pad = (value) => String(value).padStart(2, "0");
    const clock = pad(date.getHours()) + ":" + pad(date.getMinutes());
    const sameDay = new Date().toDateString() === date.toDateString();
    return sameDay ? clock : pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " + clock;

  function toBytes(source) {

  function concatBytes(parts) {
    let total = 0;
    parts.forEach((part) => { total += part.length; });
    const joined = new Uint8Array(total);
    let offset = 0;
    parts.forEach((part) => {

    });

  }

  /* —— 加密：房间码派生出密钥和频道名，消息统一封成「头 + 正文」再加密 —— */

  function normalizeRoomCode(raw) {
    return String(raw || "").normalize("NFKC").trim().toLowerCase();
  }

  async function deriveRoom(code) {
    const material = await crypto.subtle.importKey("raw", textEncoder.encode(code), "PBKDF2", false, ["deriveBits"]);
    const derived = new Uint8Array(await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: textEncoder.encode(KDF_SALT), iterations: KDF_ITERATIONS },
      material,
      512
    ));
    // 前 32 字节做密钥，后一半取 16 字节做频道名：两段互相推不出来，服务器拿到频道名也解不开内容
    const key = await crypto.subtle.importKey("raw", derived.slice(0, 32), "AES-GCM", false, ["encrypt", "decrypt"]);
    const roomId = Array.from(derived.slice(32, 48), (byte) => byte.toString(16).padStart(2, "0")).join("");
    return { code, roomId, key };
  }

  /** 明文帧：2 字节头长度 + JSON 头 + 二进制正文。中继加密后发，直连本身已加密就直接发 */
  function encodeFrame(header, body) {
    const headerBytes = textEncoder.encode(JSON.stringify(header));
    const bodyBytes = body ? toBytes(body) : EMPTY_BYTES;
    const frame = new Uint8Array(2 + headerBytes.length + bodyBytes.length);
    frame[0] = headerBytes.length >> 8;
    frame[1] = headerBytes.length & 255;
    frame.set(headerBytes, 2);
    frame.set(bodyBytes, 2 + headerBytes.length);
    return frame;
  }

  function decodeFrame(frame) {
    if (frame.length < 2) return null;
    const headerLength = (frame[0] << 8) | frame[1];
    if (frame.length < 2 + headerLength) return null;
    try {
      const header = JSON.parse(textDecoder.decode(frame.subarray(2, 2 + headerLength)));
      if (!header || typeof header !== "object") return null;
      return { header, body: frame.subarray(2 + headerLength) };
    } catch (err) {
      console.warn("收到一条格式不对的消息，已忽略", err);
      return null;
    }
  }

  async function sealEnvelope(header, body) {
    const iv = crypto.getRandomValues(new Uint8Array(IV_BYTES));
    const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, room.key, encodeFrame(header, body)));
    return concatBytes([iv, cipher]);
  }

  /** 解不开的多半是别的房间或旧版本发来的，忽略即可；IV 顺带当作消息编号用来去重 */
  async function openEnvelope(bytes, key) {
    if (bytes.length <= IV_BYTES) return null;
    const iv = bytes.subarray(0, IV_BYTES);
    try {
      const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, bytes.subarray(IV_BYTES)));
      const frame = decodeFrame(plain);
      return frame ? { header: frame.header, body: frame.body, envelopeId: String.fromCharCode.apply(null, iv) } : null;
    } catch (err) {
      undecryptableCount += 1;
      if (undecryptableCount <= 3) console.warn("收到一条解不开的消息，已忽略", err);
      return null;
    }
  }

  /* —— 本机历史（IndexedDB）；打不开时退回只存内存，并在页面上说明 —— */

  const store = (() => {
    let opening = null;
    let unavailable = false;

    function requestDone(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function open() {
      if (!opening) {

          const request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = () => {
            const itemStore = request.result.createObjectStore(DB_STORE, { keyPath: "id" });
            itemStore.createIndex("room", "room");

          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);

          console.error("打不开本机数据库，历史只保存在内存里", err);
          unavailable = true;
          els.storageNotice.hidden = false;
          return null;
        });
      }
      return opening;
    }

    async function run(mode, work) {
      const db = await open();
      if (!db) return undefined;
      return requestDone(work(db.transaction(DB_STORE, mode).objectStore(DB_STORE)));
    }

      isUnavailable: () => unavailable,
      loadRoom: async (roomId) => (await run("readonly", (itemStore) => itemStore.index("room").getAll(roomId))) || [],

      remove: (id) => run("readwrite", (itemStore) => itemStore.delete(id))
