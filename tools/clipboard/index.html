  /* —— 极简 MQTT 3.1.1 客户端：只实现用到的连接、遗嘱、订阅、QoS 0/1 发布、心跳和自动重连 —— */

  function lengthPrefixed(bytes) {
    const field = new Uint8Array(2 + bytes.length);
    field[0] = bytes.length >> 8;
    field[1] = bytes.length & 255;
    field.set(bytes, 2);
    return field;
  }

  function buildMqttPacket(firstByte, parts) {
    let bodyLength = 0;
    parts.forEach((part) => { bodyLength += part.length; });
    const lengthBytes = [];
    let rest = bodyLength;
    do {
      let digit = rest % 128;
      rest = Math.floor(rest / 128);
      if (rest > 0) digit |= 128;
      lengthBytes.push(digit);
    } while (rest > 0);
    const packet = new Uint8Array(1 + lengthBytes.length + bodyLength);
    packet[0] = firstByte;
    packet.set(lengthBytes, 1);
    let offset = 1 + lengthBytes.length;
    parts.forEach((part) => {
      packet.set(part, offset);
      offset += part.length;
    });
    return packet;
  }

  function createMqttLink(url, events) {
    let socket = null;
    let ready = false;
    let wanted = false;
    let failures = 0;
    let openSerial = 0;
    let retryTimer = 0;
    let pingTimer = 0;
    let pongTimer = 0;
    let connectTimer = 0;
    let inbox = EMPTY_BYTES;
    let lastPacketId = 0;
    let makeSession = null;
    const pendingAcks = new Map();

    function nextPacketId() {
      lastPacketId = lastPacketId >= 65535 ? 1 : lastPacketId + 1;
      return lastPacketId;
    }

    function packetIdBytes(id) {
      return new Uint8Array([id >> 8, id & 255]);
    }

    function start(sessionFactory) {
      makeSession = sessionFactory;
      wanted = true;
      failures = 0;
      open();
    }

    function stop() {
      wanted = false;
      clearTimeout(retryTimer);
      retryTimer = 0;
      dropSocket();
    }

    function retryNow() {
      if (!wanted || ready) return;
      clearTimeout(retryTimer);
      retryTimer = 0;
      failures = 0;
      dropSocket();
      open();
    }

    function dropSocket() {
      const closing = socket;
      socket = null;
      ready = false;
      inbox = EMPTY_BYTES;
      clearTimeout(connectTimer);
      clearInterval(pingTimer);
      clearTimeout(pongTimer);
      pendingAcks.forEach((pending) => {
        clearTimeout(pending.timer);
        pending.resolve(false);
      });
      pendingAcks.clear();
      if (!closing) return;
      closing.onopen = null;
      closing.onmessage = null;
      closing.onclose = null;
      closing.onerror = null;
      try {
        closing.close();
      } catch (err) {
        console.warn("关闭中继连接时出错", url, err);
      }
    }

    function scheduleRetry() {
      if (!wanted || retryTimer) return;
      const step = Math.min(Math.max(failures, 1), RECONNECT_DELAYS_MS.length) - 1;
      const delay = RECONNECT_DELAYS_MS[step] * (0.8 + Math.random() * 0.4);
      retryTimer = setTimeout(() => {
        retryTimer = 0;
        open();
      }, delay);
    }

    function onSocketLost(lost) {
      if (socket !== lost) return;
      const wasReady = ready;
      dropSocket();
      failures += 1;
      if (wasReady) events.onDown();
      events.onChange();
      scheduleRetry();
    }

    async function open() {
      if (!wanted || socket) return;
      openSerial += 1;
      const serial = openSerial;
      let session = null;
      try {
        session = await makeSession();
      } catch (err) {
        console.error("准备中继连接失败", url, err);
        failures += 1;
        scheduleRetry();
        return;
      }
      if (!wanted || socket || serial !== openSerial) return;
      let opened = null;
      try {
        opened = new WebSocket(url, ["mqtt"]);
      } catch (err) {
        console.error("打不开中继连接", url, err);
        failures += 1;
        events.onChange();
        scheduleRetry();
        return;
      }
      opened.binaryType = "arraybuffer";
      socket = opened;
      connectTimer = setTimeout(() => onSocketLost(opened), MQTT_CONNECT_TIMEOUT_MS);
      opened.onopen = () => {
        if (socket === opened) opened.send(buildConnect(session));
      };
      opened.onmessage = (event) => {
        if (socket === opened) onBytes(new Uint8Array(event.data), session);
      };
      opened.onclose = () => onSocketLost(opened);
      opened.onerror = () => console.warn("中继连接出错，稍后自动重连", url);
      events.onChange();
    }

    function buildConnect(session) {
      const cleanSessionWithWill = 0x06;
      return buildMqttPacket(MQTT_CONNECT << 4, [
        lengthPrefixed(textEncoder.encode("MQTT")),
        new Uint8Array([4, cleanSessionWithWill, MQTT_KEEPALIVE_SEC >> 8, MQTT_KEEPALIVE_SEC & 255]),
        lengthPrefixed(textEncoder.encode(session.clientId)),
        lengthPrefixed(textEncoder.encode(session.willTopic)),
        lengthPrefixed(session.willPayload)
      ]);
    }

    function buildSubscribe(topics) {
      const parts = [packetIdBytes(nextPacketId())];
      topics.forEach((topic) => {
        parts.push(lengthPrefixed(textEncoder.encode(topic)), new Uint8Array([0]));
      });
      return buildMqttPacket(0x82, parts);
    }

    /** 一个 WebSocket 帧里可能有半个或多个 MQTT 包，攒够一个完整的再处理 */
    function onBytes(chunk, session) {
      clearTimeout(pongTimer);
      inbox = inbox.length ? concatBytes([inbox, chunk]) : chunk;
      let offset = 0;
      while (inbox.length - offset >= 2) {
        let bodyLength = 0;
        let multiplier = 1;
        let cursor = offset + 1;
        let lengthComplete = false;
        while (cursor < inbox.length && cursor <= offset + MQTT_MAX_LENGTH_BYTES) {
          const digit = inbox[cursor];
          cursor += 1;
          bodyLength += (digit & 127) * multiplier;
          multiplier *= 128;
          if (!(digit & 128)) {
            lengthComplete = true;
            break;
          }
        }
        if (!lengthComplete) {
          if (cursor > offset + MQTT_MAX_LENGTH_BYTES) {
            console.error("中继发来的数据格式不对，重新连接", url);
            onSocketLost(socket);
            return;
          }
          break;
        }
        if (inbox.length - cursor < bodyLength) break;
        const active = socket;
        handlePacket(inbox[offset] >> 4, inbox[offset] & 15, inbox.subarray(cursor, cursor + bodyLength), session);
        if (socket !== active) return;
        offset = cursor + bodyLength;
      }
      inbox = offset >= inbox.length ? EMPTY_BYTES : inbox.slice(offset);
    }

    function handlePacket(type, flags, body, session) {
      if (type === MQTT_CONNACK) {
        if (body[1] !== 0) {
          console.error("中继拒绝连接", url, body[1]);
          onSocketLost(socket);
          return;
        }
        socket.send(buildSubscribe(session.topics));
        return;
      }
      if (type === MQTT_SUBACK) {
        const refused = Array.from(body.subarray(2)).some((code) => code === 0x80);
        if (refused) {
          console.error("中继拒绝订阅", url);
          onSocketLost(socket);
          return;
        }
        clearTimeout(connectTimer);
        ready = true;
        failures = 0;
        pingTimer = setInterval(ping, MQTT_PING_MS);
        events.onUp();
        events.onChange();
        return;
      }
      if (type === MQTT_PUBLISH) {
        const qos = (flags >> 1) & 3;
        const topicLength = (body[0] << 8) | body[1];
        let cursor = 2 + topicLength;
        if (qos > 0) {
          socket.send(buildMqttPacket(MQTT_PUBACK << 4, [body.subarray(cursor, cursor + 2)]));
          cursor += 2;
        }
        events.onMessage(body.subarray(cursor));
        return;
      }
      if (type === MQTT_PUBACK) {
        const id = (body[0] << 8) | body[1];
        const pending = pendingAcks.get(id);
        if (!pending) return;
        pendingAcks.delete(id);
        clearTimeout(pending.timer);
        pending.resolve(true);
      }
    }

    /** 发一个心跳，限时内服务器毫无动静就当连接已死，断开重连 */
    function ping() {
      if (!ready) return;
      const probed = socket;
      try {
        probed.send(MQTT_PINGREQ_BYTES);
      } catch (err) {
        console.warn("心跳发不出去，重新连接", url, err);
        onSocketLost(probed);
        return;
      }
      clearTimeout(pongTimer);
      pongTimer = setTimeout(() => onSocketLost(probed), MQTT_PONG_TIMEOUT_MS);
    }

    /** qos 1 等服务器确认，超时算失败并顺手探一次连接死活；qos 0 发出即算成功 */
    function publish(topic, payload, qos) {
      if (!ready) return Promise.resolve(false);
      const topicField = lengthPrefixed(textEncoder.encode(topic));
      try {
        if (qos === 0) {
          socket.send(buildMqttPacket(MQTT_PUBLISH << 4, [topicField, payload]));
          return Promise.resolve(true);
        }
        const id = nextPacketId();
        socket.send(buildMqttPacket((MQTT_PUBLISH << 4) | 2, [topicField, packetIdBytes(id), payload]));
        return new Promise((resolve) => {
          const timer = setTimeout(() => {
            pendingAcks.delete(id);
            resolve(false);
            ping();
          }, MQTT_ACK_TIMEOUT_MS);
          pendingAcks.set(id, { resolve, timer });
        });
      } catch (err) {
        console.warn("消息发不出去", url, err);
        return Promise.resolve(false);
      }
    }

    return {
      start,
      stop,
      retryNow,
      ping,
      publish,
      isReady: () => ready,
      failureCount: () => failures
    };
  }

  /* —— 中继：两条 MQTT 连接。广播走所有连接，点对点走对方最近出现的那条；每条连接限速排队 —— */

  const links = BROKER_URLS.map((url, index) => {
    const link = { index, serial: 0, control: [], bulk: [], bulkKeys: new Set(), bulkBusy: false, pumping: false, lastSendAt: 0, timer: 0, mqtt: null };
    link.mqtt = createMqttLink(url, {
      onUp: () => onLinkUp(link),
      onDown: () => onLinkDown(link),
      onChange: () => renderRoom(),
      onMessage: (payload) => onLinkMessage(link, payload)
    });
    return link;
  });

  function roomTopic() {
    return TOPIC_PREFIX + room.roomId + "/all";
  }

  function peerTopic(peerId) {
    return TOPIC_PREFIX + room.roomId + "/" + peerId;
  }

  function readyLinks() {
    return links.filter((link) => link.mqtt.isReady());
  }

  function relayUp() {
    return links.some((link) => link.mqtt.isReady());
  }

  async function buildSession(link) {
    link.serial += 1;
    return {
      clientId: "ptc" + randomId(8),
      topics: [roomTopic(), peerTopic(me.peerId)],
      willTopic: roomTopic(),
      // 遗嘱：这条连接意外断开时，服务器替本机告诉房间里的其他设备
      willPayload: await sealEnvelope({ t: "bye", f: me.peerId, l: link.index, c: link.serial }, null)
    };
  }

  function flushLink(link) {
    clearTimeout(link.timer);
    link.timer = 0;
    link.bulkBusy = false;
    link.bulk.length = 0;
    link.bulkKeys.clear();
    link.control.splice(0).forEach((job) => job.resolve(false));
  }

  /** 每条连接一次只发一条、两条之间至少隔 PUBLISH_GAP_MS；分片要等上一片被服务器确认才发下一片 */
  function pumpLink(link) {
    if (link.pumping || !link.mqtt.isReady()) return;
    const useBulk = !link.control.length && !link.bulkBusy && link.bulk.length > 0;
    if (!link.control.length && !useBulk) return;
    const wait = link.lastSendAt + PUBLISH_GAP_MS - Date.now();
    if (wait > 0) {
      if (!link.timer) {
        link.timer = setTimeout(() => {
          link.timer = 0;
          pumpLink(link);
        }, wait);
      }
      return;
    }
    const job = useBulk ? link.bulk.shift() : link.control.shift();
    if (job.bulkKey) link.bulkKeys.delete(job.bulkKey);
    link.pumping = true;
    job.produce()
      .catch((err) => {
        console.error("准备要发送的内容失败", err);
        return null;
      })
      .then((bytes) => {
        link.pumping = false;
        if (!bytes) {
          job.resolve(false);
          pumpLink(link);
          return;
        }
        link.lastSendAt = Date.now();
        const acked = link.mqtt.publish(job.topic, bytes, job.qos);
        if (useBulk) {
          link.bulkBusy = true;
          acked.then(() => {
            link.bulkBusy = false;
            pumpLink(link);
          });
        }
        acked.then(job.resolve);
        pumpLink(link);
      });
  }

  function enqueueControl(link, topic, bytes, qos) {
    return new Promise((resolve) => {
      link.control.push({ topic, qos, produce: () => Promise.resolve(bytes), resolve });
      pumpLink(link);
    });
  }

  /** 多条连接同时发，只要有一条成功就算成功，不等慢的那条 */
  function anySucceeded(attempts) {
    if (!attempts.length) return Promise.resolve(false);
    return new Promise((resolve) => {
      let remaining = attempts.length;
      attempts.forEach((attempt) => {
        attempt.then((ok) => {
          remaining -= 1;
          if (ok) resolve(true);
          else if (!remaining) resolve(false);
        });
      });
    });
  }

  async function broadcast(header, body, qos, onlyLink) {
    if (!room) return false;
    const targets = onlyLink ? [onlyLink].filter((link) => link.mqtt.isReady()) : readyLinks();
    if (!targets.length) return false;
    const epoch = roomEpoch;
    const bytes = await sealEnvelope(Object.assign({ f: me.peerId }, header), body);
    if (epoch !== roomEpoch) return false;
    return anySucceeded(targets.map((link) => enqueueControl(link, roomTopic(), bytes, qos)));
  }

  /** 对方最近在哪条连接上出现过就走哪条；不清楚就所有连接都发一份（对方会按消息编号去重） */
  function linksForPeer(peerId) {
    const peer = peers.get(peerId);
    const ready = readyLinks();
    if (!peer) return ready;
    const now = Date.now();
    let best = null;
    ready.forEach((link) => {
      const seenAt = peer.seen[link.index];
      if (now - seenAt > PEER_LINK_FRESH_MS) return;
      if (!best || seenAt > peer.seen[best.index]) best = link;
    });
    return best ? [best] : ready;
  }

  async function sendToPeer(peerId, header, body) {
    if (!room) return false;
    const epoch = roomEpoch;
    const bytes = await sealEnvelope(Object.assign({ f: me.peerId }, header), body);
    if (epoch !== roomEpoch) return false;
    const targets = linksForPeer(peerId);
    return anySucceeded(targets.map((link) => enqueueControl(link, peerTopic(peerId), bytes, 0)));
  }

  function queueRelayPiece(peerId, item, index) {
    const link = linksForPeer(peerId)[0];
    if (!link) return;
    const bulkKey = peerId + "|" + item.id + "|" + index;
    if (link.bulkKeys.has(bulkKey)) return;
    link.bulkKeys.add(bulkKey);
    const epoch = roomEpoch;
    link.bulk.push({
      bulkKey,
      topic: peerTopic(peerId),
      qos: 1,
      resolve: () => {},
      produce: async () => {
        if (epoch !== roomEpoch || !items.has(item.id)) return null;
        const piece = await readPiece(item, index);
        return sealEnvelope({ t: "piece", f: me.peerId, id: item.id, i: index }, piece);
      }
    });
    pumpLink(link);
  }

  function onLinkMessage(link, payload) {
    if (!room) return;
    const epoch = roomEpoch;
    openEnvelope(payload, room.key).then((envelope) => {
      if (!envelope || epoch !== roomEpoch) return;
      const header = envelope.header;
      if (typeof header.f !== "string" || !PEER_ID_PATTERN.test(header.f) || header.f === me.peerId) return;
      const duplicate = seenEnvelopes.has(envelope.envelopeId);
      if (!duplicate) rememberEnvelope(envelope.envelopeId);
      // 同一条广播会从两条连接各到一次：第二次只用来记下「对方在这条连接上也在线」
      if (duplicate) {
        const peer = peers.get(header.f);
        if (peer && header.t !== "bye") peer.seen[link.index] = Date.now();
        return;
      }
      handleMessage(header, envelope.body, link.index);
    });
  }

  function rememberEnvelope(envelopeId) {
    seenEnvelopes.add(envelopeId);
    if (seenEnvelopes.size <= SEEN_ENVELOPE_LIMIT) return;
    const overflow = seenEnvelopes.size - SEEN_ENVELOPE_LIMIT / 2;
    let dropped = 0;
    for (const oldId of seenEnvelopes) {
      if (dropped >= overflow) break;
      seenEnvelopes.delete(oldId);
      dropped += 1;
    }
  }

  function onLinkUp(link) {
    everConnected = true;
    relayWaiters.forEach((wake) => wake(true));
    relayWaiters.clear();
    broadcast(helloHeader(true), null, 0, link);
    scheduleHello(HELLO_QUICK_MS);
    resendFailedItems();
    resumeFetches();
    refreshAllStates();
  }

  function onLinkDown(link) {
    flushLink(link);
    refreshAllStates();
  }

  function waitForRelay(timeoutMs) {
    if (relayUp()) return Promise.resolve(true);
    return new Promise((resolve) => {
      const wake = (ok) => {
        clearTimeout(timer);
        relayWaiters.delete(wake);
        resolve(ok);
      };
      const timer = setTimeout(() => wake(false), timeoutMs);
      relayWaiters.add(wake);
    });
  }

  function reconnectNow() {
    links.forEach((link) => link.mqtt.retryNow());
    renderRoom();
  }

  /* —— 直连（WebRTC 数据通道）：按需建立，信令走中继；连不上或中途断了，接收方自动改走中继 —— */

  const direct = (() => {
    const supported = typeof RTCPeerConnection === "function";
    const conns = new Map();

    function track(peerId) {
      const conn = { peerId, pc: null, channel: null, state: "connecting", retryAt: 0, timer: 0, waiters: [], outbox: [], outKeys: new Set(), draining: false };
      conn.timer = setTimeout(() => fail(conn, DIRECT_RETRY_COOLDOWN_MS), DIRECT_CONNECT_TIMEOUT_MS);
      conns.set(peerId, conn);
      return conn;
    }

    function settle(conn, opened) {
      clearTimeout(conn.timer);
      conn.waiters.splice(0).forEach((wake) => wake(opened));
    }

    function closeQuietly(conn) {
      conn.outbox.length = 0;
      conn.outKeys.clear();
      if (conn.channel) {
        conn.channel.onopen = null;
        conn.channel.onclose = null;
        conn.channel.onerror = null;
        conn.channel.onmessage = null;
      }
      if (!conn.pc) return;
      conn.pc.onconnectionstatechange = null;
      conn.pc.ondatachannel = null;
      try {
        conn.pc.close();
      } catch (err) {
        console.warn("关闭直连时出错", err);
      }
    }

    /** 记为失败并进入冷却，冷却期内不再重试，免得每个分片都卡在等直连上 */
    function fail(conn, cooldownMs) {
      if (conns.get(conn.peerId) !== conn || conn.state === "failed") return;
      conn.state = "failed";
      conn.retryAt = Date.now() + cooldownMs;
      settle(conn, false);
      closeQuietly(conn);
      refreshAllStates();
    }

    function discard(peerId) {
      const conn = conns.get(peerId);
      if (!conn) return;
      conns.delete(peerId);
      settle(conn, false);
      closeQuietly(conn);
    }

    function wireChannel(conn, channel) {
      conn.channel = channel;
      channel.binaryType = "arraybuffer";
      channel.bufferedAmountLowThreshold = DIRECT_BUFFER_LOW_BYTES;
      const markOpen = () => {
        conn.state = "open";
        settle(conn, true);
      };
      channel.onopen = markOpen;
      if (channel.readyState === "open") markOpen();
      channel.onclose = () => fail(conn, DIRECT_RETRY_COOLDOWN_MS);
      channel.onerror = (event) => {
        console.warn("直连通道出错，改走中继", event.error || event);
        fail(conn, DIRECT_RETRY_COOLDOWN_MS);
      };
      channel.onmessage = (event) => {
        const frame = decodeFrame(new Uint8Array(event.data));
        if (frame) handleDirectMessage(conn.peerId, frame.header, frame.body);
      };
    }

    function createPeerConnection(conn) {
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      conn.pc = pc;
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed" || pc.connectionState === "closed") fail(conn, DIRECT_RETRY_COOLDOWN_MS);
      };
      return pc;
    }

    /** 不逐条发候选地址：等收集完（或超时）把整份描述一次发出，信令只有一来一回两条消息 */
    function gatheringDone(pc) {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const finish = () => {
          clearTimeout(timer);
          pc.removeEventListener("icegatheringstatechange", onChange);
          resolve();
        };
        const onChange = () => {
          if (pc.iceGatheringState === "complete") finish();
        };
        const timer = setTimeout(finish, ICE_GATHER_MS);
        pc.addEventListener("icegatheringstatechange", onChange);
      });
    }

    async function startOffer(peerId) {
      const conn = track(peerId);
      try {
        const pc = createPeerConnection(conn);
        wireChannel(conn, pc.createDataChannel("pt-clipboard"));
        await pc.setLocalDescription(await pc.createOffer());
        await gatheringDone(pc);
        if (conns.get(peerId) !== conn || conn.state !== "connecting") return;
        await sendToPeer(peerId, { t: "sig", k: "offer", sdp: pc.localDescription.sdp });
      } catch (err) {
        console.warn("发起直连失败，改走中继", err);
        fail(conn, DIRECT_RETRY_COOLDOWN_MS);
      }
    }

    async function acceptOffer(peerId, sdp) {
      discard(peerId);
      const conn = track(peerId);
      try {
        const pc = createPeerConnection(conn);
        pc.ondatachannel = (event) => wireChannel(conn, event.channel);
        await pc.setRemoteDescription({ type: "offer", sdp });
        await pc.setLocalDescription(await pc.createAnswer());
        await gatheringDone(pc);
        if (conns.get(peerId) !== conn || conn.state !== "connecting") return;
        await sendToPeer(peerId, { t: "sig", k: "answer", sdp: pc.localDescription.sdp });
      } catch (err) {
        console.warn("应答直连失败，改走中继", err);
        fail(conn, DIRECT_RETRY_COOLDOWN_MS);
      }
    }

    /** 两边可能同时想连对方：统一由 peerId 小的一方发起，另一方只发「请连我」 */
    function ensure(peerId) {
      if (!supported || !room) return;
      const existing = conns.get(peerId);
      if (existing) {
        if (existing.state !== "failed" || Date.now() < existing.retryAt) return;
        discard(peerId);
      }
      if (me.peerId < peerId) {
        startOffer(peerId);
        return;
      }
      track(peerId);
      sendToPeer(peerId, { t: "sig", k: "want" });
    }

    function onSignal(peerId, header) {
      if (!supported) return;
      const conn = conns.get(peerId);
      if (header.k === "want") {
        if (me.peerId > peerId || (conn && conn.state === "connecting")) return;
        discard(peerId);
        startOffer(peerId);
        return;
      }
      if (header.k === "offer" && typeof header.sdp === "string") {
        acceptOffer(peerId, header.sdp);
        return;
      }
      if (header.k === "answer" && typeof header.sdp === "string" && conn && conn.pc && conn.pc.signalingState === "have-local-offer") {
        conn.pc.setRemoteDescription({ type: "answer", sdp: header.sdp }).catch((err) => {
          console.warn("直连握手失败，改走中继", err);
          fail(conn, DIRECT_RETRY_COOLDOWN_MS);
        });
      }
    }

    function isOpen(peerId) {
      const conn = conns.get(peerId);
      return Boolean(conn && conn.state === "open" && conn.channel.readyState === "open");
    }

    function waitOpen(peerId, timeoutMs) {
      const conn = conns.get(peerId);
      if (!conn || conn.state === "failed") return Promise.resolve(false);
      if (conn.state === "open") return Promise.resolve(true);
      return new Promise((resolve) => {
        const wake = (opened) => {
          clearTimeout(timer);
          resolve(opened);
        };
        const timer = setTimeout(() => {
          const position = conn.waiters.indexOf(wake);
          if (position >= 0) conn.waiters.splice(position, 1);
          resolve(false);
        }, timeoutMs);
        conn.waiters.push(wake);
      });
    }

    function send(peerId, header, body) {
      if (!isOpen(peerId)) return false;
      try {
        conns.get(peerId).channel.send(encodeFrame(header, body));
        return true;
      } catch (err) {
        console.warn("直连发送失败，改走中继", err);
        markBroken(peerId);
        return false;
      }
    }

    function markBroken(peerId) {
      const conn = conns.get(peerId);
      if (conn) fail(conn, DIRECT_RETRY_COOLDOWN_MS);
    }

    function bufferDrained(channel) {
      if (channel.bufferedAmount <= DIRECT_BUFFER_HIGH_BYTES) return Promise.resolve();
      return new Promise((resolve) => {
        const finish = () => {
          channel.removeEventListener("bufferedamountlow", finish);
          channel.removeEventListener("close", finish);
          resolve();
        };
        channel.addEventListener("bufferedamountlow", finish);
        channel.addEventListener("close", finish);
      });
    }

    /** 一个分片拆成若干帧发出；通道缓冲满了就等它排空，不会把内存撑爆 */
    async function drainOutbox(conn) {
      if (conn.draining) return;
      conn.draining = true;
      try {
        while (conn.outbox.length && conn.state === "open" && conn.channel.readyState === "open") {
          const job = conn.outbox.shift();
          conn.outKeys.delete(job.key);
          if (!items.has(job.item.id)) continue;
          const piece = new Uint8Array(await readPiece(job.item, job.index));
          for (let offset = 0; offset < piece.length; offset += DIRECT_FRAME_BYTES) {
            await bufferDrained(conn.channel);
            if (conn.channel.readyState !== "open") return;
            const header = { t: "part", id: job.item.id, i: job.index, o: offset, n: piece.length };
            conn.channel.send(encodeFrame(header, piece.subarray(offset, offset + DIRECT_FRAME_BYTES)));
          }
        }
      } catch (err) {
        console.warn("直连发送分片失败，对方会改走中继", err);
        fail(conn, DIRECT_RETRY_COOLDOWN_MS);
      } finally {
        conn.draining = false;
      }
    }

    function queuePieces(peerId, item, indexes) {
      const conn = conns.get(peerId);
      if (!conn || conn.state !== "open") return;
      indexes.forEach((index) => {
        const key = item.id + "|" + index;
        if (conn.outKeys.has(key)) return;
        conn.outKeys.add(key);
        conn.outbox.push({ key, item, index });
      });
      drainOutbox(conn);
    }

    return {
      supported,
      ensure,
      onSignal,
      isOpen,
      waitOpen,
      send,
      markBroken,
      queuePieces,
      discard,
      // 用户手动重试时不再等冷却，直连重新试一次
      forgetFailures: () => {
        Array.from(conns.values()).filter((conn) => conn.state === "failed").forEach((conn) => discard(conn.peerId));
      },
      discardAll: () => Array.from(conns.keys()).forEach(discard)
    };
  })();

  /* —— 在线设备 —— */

  function recentDigest() {
    return sortedItems().slice(0, SYNC_ITEM_COUNT).map((item) => [item.id, item.at, item.done ? 1 : 0]);
  }

  function helloHeader(ask) {
    return { t: "hi", name: me.name, dev: me.deviceId, ask: ask ? 1 : 0, c: links.map((link) => link.serial), items: recentDigest() };
  }

  function sendHello() {
    if (!room) return;
    broadcast(helloHeader(false), null, 0);
    const keepQuick = quickHelloRounds > 0 && hasUndeliveredItems();
    if (keepQuick) quickHelloRounds -= 1;
    else quickHelloRounds = 0;
    scheduleHello(keepQuick ? HELLO_QUICK_MS : HELLO_INTERVAL_MS);
  }

  function scheduleHello(delayMs) {
    clearTimeout(helloTimer);
    helloTimer = setTimeout(sendHello, delayMs);
  }

  /** 刚发出内容后多报几次清单：万一哪台设备漏收了那条广播，看到清单就会主动来取 */
  function hurryHello() {
    quickHelloRounds = HELLO_QUICK_ROUNDS;
    scheduleHello(HELLO_QUICK_MS);
  }

  function hasUndeliveredItems() {
    if (!peers.size) return false;
    return sortedItems().slice(0, SYNC_ITEM_COUNT).some((item) => {
      if (!item.done) return false;
      const holderSet = holders.get(item.id) || EMPTY_SET;
      return Array.from(peers.keys()).some((peerId) => !holderSet.has(peerId));
    });
  }

  function askHello(peerId) {
    const now = Date.now();
    if (now - (helloAskedAt.get(peerId) || 0) < HELLO_ASK_GAP_MS) return;
    helloAskedAt.set(peerId, now);
    sendToPeer(peerId, helloHeader(true), null);
  }

  function onHello(header, linkIndex) {
    let peer = peers.get(header.f);
    const isNew = !peer;
    if (!peer) {
      peer = { name: "", dev: "", seen: links.map(() => 0), serials: links.map(() => 0) };
      peers.set(header.f, peer);
    }
    peer.name = cleanText(header.name, 40) || "未知设备";
    peer.dev = cleanText(header.dev, 40);
    if (Array.isArray(header.c)) peer.serials = links.map((link) => Number(header.c[link.index]) || 0);
    peer.seen[linkIndex] = Date.now();
    mergeDigest(header.f, header.items);
    if (isNew) onPeersChanged();
    if (header.ask || isNew) {
      const epoch = roomEpoch;
      setTimeout(() => {
        if (epoch === roomEpoch) sendToPeer(header.f, helloHeader(false), null);
      }, Math.random() * HELLO_REPLY_JITTER_MS);
    }
  }

  /**
   * 遗嘱只说明对方的某一条连接断了；另一条连接上最近还见过它，就先不当它离线。
   * 遗嘱可能迟到（对方早已重连）：带的连接序号比已知的旧，就是过期的，忽略
   */
  function onBye(header, linkIndex) {
    const peer = peers.get(header.f);
    if (!peer) return;
    if (header.all) {
      removePeer(header.f);
      return;
    }
    const lostLink = Number.isInteger(header.l) && header.l >= 0 && header.l < links.length ? header.l : linkIndex;
    if (Number(header.c) < peer.serials[lostLink]) return;
    peer.seen[lostLink] = 0;
    if (Date.now() - Math.max.apply(null, peer.seen) > PEER_LINK_FRESH_MS) removePeer(header.f);
  }

  function removePeer(peerId) {
    if (!peers.delete(peerId)) return;
    holders.forEach((holderSet) => holderSet.delete(peerId));
    servedPieces.forEach((byPeer) => byPeer.delete(peerId));
    helloAskedAt.delete(peerId);
    direct.discard(peerId);
    onPeersChanged();
  }

  function sweepPeers() {
    const now = Date.now();
    Array.from(peers.entries()).forEach(([peerId, peer]) => {
      if (now - Math.max.apply(null, peer.seen) > PEER_TIMEOUT_MS) removePeer(peerId);
    });
  }

  function onPeersChanged() {
    renderRoom();
    refreshAllStates();
  }

  function addHolder(itemId, peerId) {
    let holderSet = holders.get(itemId);
    if (!holderSet) {
      holderSet = new Set();
      holders.set(itemId, holderSet);
    }
    if (holderSet.has(peerId)) return;
    holderSet.add(peerId);
    const item = items.get(itemId);
    if (!item) return;
    if (item.done) markDirty(item);
    else if (item.status === "waiting") requestBody(item);
  }

  /* —— 同步：每台设备定期报出自己最近的条目清单，缺的由接收方主动来要 —— */

  /** 本机历史已满时，比最旧一条还早的内容不再同步进来，免得进来就被挤掉、反复拉取 */
  function historyFloor() {
    if (items.size < HISTORY_LIMIT) return 0;
    let oldest = Infinity;
    items.forEach((item) => { oldest = Math.min(oldest, item.seq); });
    return oldest;
  }

  function mergeDigest(peerId, entries) {
    if (!Array.isArray(entries)) return;
    const now = Date.now();
    const floor = historyFloor();
    const unknownIds = [];
    entries.slice(0, SYNC_ITEM_COUNT).forEach((entry) => {
      if (!Array.isArray(entry)) return;
      const id = String(entry[0] || "");
      if (!ITEM_ID_PATTERN.test(id)) return;
      if (entry[2]) addHolder(id, peerId);
      if (items.has(id) || tombstones.has(id)) return;
      if (Number(entry[1]) < floor) return;
      if (now - (metaAskedAt.get(id) || 0) < META_RETRY_MS) return;
      metaAskedAt.set(id, now);
      unknownIds.push(id);
    });
    if (unknownIds.length) sendToPeer(peerId, { t: "get", ids: unknownIds }, null);
  }

  function metaOf(item) {
    return { id: item.id, kind: item.kind, name: item.name, mime: item.mime, size: item.size, at: item.at, dev: item.dev, from: item.from };
  }

  function parseMeta(raw) {
    if (!raw || typeof raw !== "object") return null;
    const id = String(raw.id || "");
    const size = Number(raw.size);
    if (!ITEM_ID_PATTERN.test(id) || !ITEM_KINDS.includes(raw.kind)) return null;
    if (!Number.isInteger(size) || size < 0 || size > MAX_ITEM_BYTES) return null;
    return {
      id,
      kind: raw.kind,
      size,
      name: cleanFileName(raw.name),
      mime: cleanText(raw.mime, 100),
      at: Number(raw.at) || Date.now(),
      dev: cleanText(raw.dev, 40),
      from: cleanText(raw.from, 40) || "未知设备"
    };
  }

  async function sendItemTo(peerId, item) {
    const inline = item.done && item.size <= PIECE_BYTES;
    try {
      const body = inline ? await readWhole(item) : null;
      await sendToPeer(peerId, { t: "item", meta: metaOf(item), live: 0, has: item.done ? 1 : 0, inline: inline ? 1 : 0 }, body);
    } catch (err) {
      console.error("读取本机内容失败，没能同步给对方", item.id, err);
    }
  }

  function onGet(header, peerId) {
    if (!Array.isArray(header.ids)) return;
    header.ids.slice(0, SYNC_ITEM_COUNT).forEach((id) => {
      const item = items.get(String(id));
      if (item) sendItemTo(peerId, item);
    });
  }

  function onItem(header, body, peerId) {
    const meta = parseMeta(header.meta);
    if (!meta || tombstones.has(meta.id)) return;
    if (header.has) addHolder(meta.id, peerId);
    let item = items.get(meta.id);
    if (!item) {
      const now = Date.now();
      const live = Boolean(header.live);
      item = Object.assign(meta, {
        room: room.roomId,
        // 实时收到的按本机到达时间排在最前（不受对方时钟影响）；补同步的历史按原时间插回去
        seq: live ? now : Math.min(meta.at, now),
        done: false,
        auto: live || meta.size <= AUTO_FETCH_HISTORY_BYTES,
        live,
        status: ""
      });
      insertItem(item);
      if (!items.has(item.id)) return;
      saveItem(item);
    }
    if (item.done) return;
    if (header.inline && body.length === item.size) {
      completeItem(item, new Blob([body], { type: item.mime }));
      return;
    }
    requestBody(item);
  }

  function onGot(header, peerId) {
    const id = String(header.id || "");
    if (ITEM_ID_PATTERN.test(id)) addHolder(id, peerId);
  }

  /* —— 条目正文的读取 —— */

  function bodyBlob(item) {
    if (item.kind !== "text") return item.blob;
    if (!item.textBlob) item.textBlob = new Blob([item.text]);
    return item.textBlob;
  }

  function readWhole(item) {
    return bodyBlob(item).arrayBuffer();
  }

  function readPiece(item, index) {
    const start = index * PIECE_BYTES;
    return bodyBlob(item).slice(start, start + PIECE_BYTES).arrayBuffer();
  }

  function pieceCount(size) {
    return Math.ceil(size / PIECE_BYTES);
  }

  function pieceLength(size, index) {
    return Math.min(PIECE_BYTES, size - index * PIECE_BYTES);
  }

  /* —— 发送：先存进本机历史，再广播；送没送到以对方的回执为准 —— */

  function addOwnItem(fields) {
    const now = Date.now();
    const item = Object.assign({
      id: randomId(10),
      room: room.roomId,
      at: now,
      seq: now,
      dev: me.deviceId,
      from: me.name,
      done: true,
      auto: true,
      sendState: "sending"
    }, fields);
    insertItem(item);
    saveItem(item);
    return announce(item);
  }

  async function announce(item) {
    const epoch = roomEpoch;
    item.sendState = "sending";
    markDirty(item);
    const inline = item.size <= PIECE_BYTES;
    let delivered = false;
    try {
      const body = inline ? await readWhole(item) : null;
      delivered = await broadcast({ t: "item", meta: metaOf(item), live: 1, has: 1, inline: inline ? 1 : 0 }, body, 1);
    } catch (err) {
      console.error("读取要发送的内容失败", item.id, err);
    }
    if (epoch !== roomEpoch || !items.has(item.id)) return delivered;
    item.sendState = delivered ? "sent" : "failed";
    markDirty(item);
    if (delivered) hurryHello();
    return delivered;
  }

  function resendFailedItems() {
    items.forEach((item) => {
      if (item.sendState === "failed") announce(item);
    });
  }

  async function retrySend(item) {
    item.sendState = "sending";
    markDirty(item);
    reconnectNow();
    await waitForRelay(RETRY_WAIT_MS);
    if (!items.has(item.id) || item.sendState === "sent") return;
    const delivered = await announce(item);
    if (!delivered) toast("还是没连上服务器，检查一下网络；连上后会自动发出", true);
  }

  async function sendText(rawText) {
    const text = rawText.replace(/\r\n/g, "\n");
    if (!text.trim()) {
      toast("先输入要发送的文字", true);
      return false;
    }
    const size = textEncoder.encode(text).length;
    if (size > MAX_TEXT_BYTES) {
      toast("文字超过 " + formatBytes(MAX_TEXT_BYTES) + "，请存成文件再发", true);
      return false;
    }
    await addOwnItem({ kind: "text", name: "", mime: "text/plain", size, text });
    return true;
  }

  /** 逐个发送；单个失败不影响其余，最后汇总提示 */
  async function sendFiles(fileList) {
    const outcome = { sent: 0, queued: 0, rejected: [] };
    for (const file of fileList) {
      const name = cleanFileName(file.name) || "未命名";
      if (file.size > MAX_ITEM_BYTES) {
        outcome.rejected.push(name + "（" + formatBytes(file.size) + "，超过 " + formatBytes(MAX_ITEM_BYTES) + "）");
        continue;
      }
      try {
        // 拖进来的文件夹读不出内容：先读一个字节探一下，读不了就跳过
        await file.slice(0, 1).arrayBuffer();
      } catch (err) {
        console.error("读取文件失败", name, err);
        outcome.rejected.push(name + "（读不出内容，可能是文件夹）");
        continue;
      }
      const mime = cleanText(file.type, 100) || "application/octet-stream";
      const kind = mime.startsWith("image/") ? "image" : "file";
      const delivered = await addOwnItem({ kind, name, mime, size: file.size, blob: file });
      if (delivered) outcome.sent += 1;
      else outcome.queued += 1;
    }
    if (outcome.rejected.length) toast("没有发送：" + outcome.rejected.join("、"), true);
    return outcome;
  }

  /* —— 接收：接收方按分片向持有者要，缺哪片要哪片，直连不通自动走中继 —— */

  function requestBody(item, manual) {
    if (item.done) return;
    if (!item.auto && !manual) {
      setStatus(item, "offered");
      return;
    }
    if (manual) item.auto = true;
    let job = fetchJobs.get(item.id);
    if (!job) {
      job = { pieces: new Array(pieceCount(item.size)), have: 0, bytes: 0, parts: new Map(), running: false, cancelled: false, onActivity: null, idleBySource: new Map(), via: "" };
      fetchJobs.set(item.id, job);
    }
    if (job.running || fetchQueue.includes(item.id)) return;
    setStatus(item, "queued");
    fetchQueue.push(item.id);
    pumpFetches();
  }

  function pumpFetches() {
    while (runningFetches < MAX_PARALLEL_FETCHES && fetchQueue.length) {
      const item = items.get(fetchQueue.shift());
      const job = item ? fetchJobs.get(item.id) : null;
      if (!item || !job || item.done || job.running) continue;
      runningFetches += 1;
      job.running = true;
      runFetch(item, job)
        .catch((err) => {
          console.error("接收出错", item.id, err);
          setStatus(item, "failed", "接收出错");
        })
        .then(() => {
          job.running = false;
          runningFetches -= 1;
          pumpFetches();
        });
    }
  }

  function onlineHolders(itemId) {
    const holderSet = holders.get(itemId) || EMPTY_SET;
    return Array.from(holderSet).filter((peerId) => peers.has(peerId));
  }

  /** 优先已经直连上的设备，其次是这次接收里失败次数少的 */
  function pickSource(itemId, job) {
    const candidates = onlineHolders(itemId).filter((peerId) => (job.idleBySource.get(peerId) || 0) < IDLE_ROUNDS_PER_SOURCE);
    candidates.sort((left, right) => {
      const directGap = Number(direct.isOpen(right)) - Number(direct.isOpen(left));
      if (directGap) return directGap;
      return (job.idleBySource.get(left) || 0) - (job.idleBySource.get(right) || 0);
    });
    return candidates[0] || "";
  }

  /**
   * 这一轮走直连还是中继：true 直连，false 中继，null 两条路都不行。
   * 中继能承受的大小以内：先走中继马上开始，直连通了下一轮自动切过去；
   * 太大的只能等直连。
   */
  async function chooseDirect(item, source) {
    const relayAllowed = item.size <= RELAY_MAX_ITEM_BYTES;
    if (!direct.supported) return relayAllowed ? false : null;
    if (item.size < DIRECT_MIN_BYTES) return false;
    if (direct.isOpen(source)) return true;
    direct.ensure(source);
    if (relayAllowed) return false;
    return (await direct.waitOpen(source, DIRECT_CONNECT_TIMEOUT_MS)) ? true : null;
  }

  function nextMissing(job, limit) {
    const missing = [];
    for (let index = 0; index < job.pieces.length && missing.length < limit; index += 1) {
      if (!job.pieces[index]) missing.push(index);
    }
    return missing;
  }

  /** 等这一轮要的分片到齐；期间只要还有数据到就一直等，停顿超过 stallMs 才算卡住 */
  function waitRound(job, wanted, stallMs) {
    return new Promise((resolve) => {
      let timer = 0;
      const finish = (outcome) => {
        clearTimeout(timer);
        job.onActivity = null;
        resolve(outcome);
      };
      const check = (refused) => {
        if (job.cancelled) finish("cancelled");
        else if (refused) finish("refused");
        else if (wanted.every((index) => job.pieces[index])) finish("ok");
        else arm();
      };
      const arm = () => {
        clearTimeout(timer);
        timer = setTimeout(() => finish("stall"), stallMs);
      };
      job.onActivity = check;
      check(false);
    });
  }

  async function runFetch(item, job) {
    let idleRounds = 0;
    job.cancelled = false;
    job.idleBySource.clear();
    while (job.have < job.pieces.length) {
      if (job.cancelled || item.done || !items.has(item.id)) return;
      if (!relayUp()) {
        setStatus(item, "failed", "连接断开了，连上后自动继续");
        return;
      }
      const source = pickSource(item.id, job);
      if (!source) {
        if (onlineHolders(item.id).length) setStatus(item, "failed", "对方一直没有回应");
        else setStatus(item, "waiting");
        return;
      }
      const viaDirect = await chooseDirect(item, source);
      if (job.cancelled || item.done || !items.has(item.id)) return;
      if (viaDirect === null) {
        setStatus(item, "failed", "这个文件有 " + formatBytes(item.size) + "，超过 " + formatBytes(RELAY_MAX_ITEM_BYTES) + " 只能设备直连，当前网络没连上");
        return;
      }
      job.via = viaDirect ? "direct" : "relay";
      setStatus(item, "receiving");
      const wanted = nextMissing(job, viaDirect ? DIRECT_WINDOW : RELAY_WINDOW);
      const request = { t: "req", id: item.id, list: wanted };
      const haveBefore = job.have;
      const requested = viaDirect ? direct.send(source, request, null) : await sendToPeer(source, request, null);
      const outcome = requested ? await waitRound(job, wanted, viaDirect ? DIRECT_STALL_MS : RELAY_STALL_MS) : "stall";
      if (outcome === "cancelled") return;
      if (outcome === "refused") {
        const holderSet = holders.get(item.id);
        if (holderSet) holderSet.delete(source);
        continue;
      }
      if (job.have > haveBefore) {
        idleRounds = 0;
        job.idleBySource.delete(source);
        continue;
      }
      // 这一轮一片都没收到：直连先判它坏了改走中继，中继也不通就换一台设备要
      if (viaDirect) {
        direct.markBroken(source);
        continue;
      }
      idleRounds += 1;
      job.idleBySource.set(source, (job.idleBySource.get(source) || 0) + 1);
      if (idleRounds >= MAX_IDLE_ROUNDS) {
        setStatus(item, "failed", "对方一直没有回应");
        return;
      }
    }
    if (job.cancelled || item.done) return;
    await completeItem(item, new Blob(job.pieces, { type: item.mime }));
  }

  function acceptPiece(itemId, index, bytes) {
    const job = fetchJobs.get(itemId);
    const item = items.get(itemId);
    if (!job || !item || !Number.isInteger(index) || index < 0 || index >= job.pieces.length) return;
    if (job.pieces[index]) return;
    if (bytes.length !== pieceLength(item.size, index)) {
      console.warn("收到的分片长度不对，已丢弃，会重新要", itemId, index);
      return;
    }
    job.pieces[index] = bytes;
    job.parts.delete(index);
    job.have += 1;
    job.bytes += bytes.length;
    markDirty(item);
    if (job.onActivity) job.onActivity(false);
  }

  /** 直连把一个分片拆成几帧按顺序发来；顺序对不上就丢掉这片，等下一轮重新要 */
  function acceptPart(header, bytes) {
    const job = fetchJobs.get(String(header.id || ""));
    const index = header.i;
    if (!job || !Number.isInteger(index) || job.pieces[index]) return;
    let partial = job.parts.get(index);
    if (!partial || header.o === 0) {
      partial = { chunks: [], bytes: 0 };
      job.parts.set(index, partial);
    }
    if (header.o !== partial.bytes) {
      job.parts.delete(index);
      return;
    }
    partial.chunks.push(bytes);
    partial.bytes += bytes.length;
    if (partial.bytes > PIECE_BYTES) {
      job.parts.delete(index);
      return;
    }
    if (partial.bytes >= header.n) {
      acceptPiece(header.id, index, concatBytes(partial.chunks));
      return;
    }
    if (job.onActivity) job.onActivity(false);
  }

  function onRefused(header) {
    const job = fetchJobs.get(String(header.id || ""));
    if (job && job.onActivity) job.onActivity(true);
  }

  /** 正文到齐：先显示出来，再存盘、告诉大家「我也有了」。存盘失败也不影响显示 */
  async function completeItem(item, blob) {
    if (item.done) return;
    if (blob.size !== item.size) {
      console.error("收到的内容大小对不上", item.id, blob.size, item.size);
      stopFetch(item.id);
      setStatus(item, "failed", "收到的内容不完整");
      return;
    }
    if (item.kind === "text") item.text = await blob.text();
    else item.blob = blob;
    item.done = true;
    item.status = "";
    stopFetch(item.id);
    refreshItem(item);
    broadcast({ t: "got", id: item.id }, null, 0);
    if (item.live && !isMine(item)) notifyShellReceived(item);
    await saveItem(item);
  }

  function stopFetch(itemId) {
    const job = fetchJobs.get(itemId);
    if (!job) return;
    job.cancelled = true;
    fetchJobs.delete(itemId);
    if (job.onActivity) job.onActivity(false);
  }

  function setStatus(item, status, reason) {
    item.status = status;
    item.reason = reason || "";
    markDirty(item);
  }

  /** 连上或有新设备上线时：把还没收完、又没在收的内容重新排上 */
  function resumeFetches() {
    items.forEach((item) => {
      if (item.done) return;
      const job = fetchJobs.get(item.id);
      if (job && job.running) return;
      if (item.status === "offered" || (!item.auto && !job)) {
        setStatus(item, "offered");
        return;
      }
      requestBody(item);
    });
  }

  /* —— 给别的设备供货 —— */

  function requestedIndexes(header, item) {
    if (!Array.isArray(header.list)) return [];
    const total = pieceCount(item.size);
    return header.list.filter((index) => Number.isInteger(index) && index >= 0 && index < total).slice(0, DIRECT_WINDOW);
  }

  /** 对方要到第几片，说明前面的它都收到了：发送方据此显示每台设备的进度 */
  function noteServed(item, peerId, indexes) {
    let byPeer = servedPieces.get(item.id);
    if (!byPeer) {
      byPeer = new Map();
      servedPieces.set(item.id, byPeer);
    }
    byPeer.set(peerId, Math.max(byPeer.get(peerId) || 0, Math.min.apply(null, indexes)));
    markDirty(item);
  }

  function onRequest(header, peerId, viaDirect) {
    const item = items.get(String(header.id || ""));
    if (!item || !item.done) {
      const refusal = { t: "nak", id: header.id };
      if (viaDirect) direct.send(peerId, refusal, null);
      else sendToPeer(peerId, refusal, null);
      return;
    }
    const indexes = requestedIndexes(header, item);
    if (!indexes.length) return;
    noteServed(item, peerId, indexes);
    if (viaDirect) direct.queuePieces(peerId, item, indexes);
    else indexes.forEach((index) => queueRelayPiece(peerId, item, index));
  }

  /* —— 消息分发 —— */

  function handleMessage(header, body, linkIndex) {
    const peerId = header.f;
    if (header.t === "hi") {
      onHello(header, linkIndex);
      return;
    }
    if (header.t === "bye") {
      onBye(header, linkIndex);
      return;
    }
    const peer = peers.get(peerId);
    if (peer) peer.seen[linkIndex] = Date.now();
    else askHello(peerId);
    if (header.t === "item") onItem(header, body, peerId);
    else if (header.t === "get") onGet(header, peerId);
    else if (header.t === "got") onGot(header, peerId);
    else if (header.t === "req") onRequest(header, peerId, false);
    else if (header.t === "piece") acceptPiece(String(header.id || ""), header.i, body);
    else if (header.t === "nak") onRefused(header);
    else if (header.t === "sig") direct.onSignal(peerId, header);
  }

  function handleDirectMessage(peerId, header, body) {
    if (header.t === "req") onRequest(header, peerId, true);
    else if (header.t === "part") acceptPart(header, body);
    else if (header.t === "nak") onRefused(header);
  }

  /* —— 房间 —— */

  async function joinRoom(rawCode) {
    if (joining) return;
    const code = normalizeRoomCode(rawCode);
    els.joinError.hidden = true;
    if (Array.from(code).length < ROOM_CODE_MIN_LENGTH) {
      showJoinError("房间码至少 " + ROOM_CODE_MIN_LENGTH + " 个字符");
      return;
    }
    if (!window.crypto || !crypto.subtle) {
      showJoinError("这个页面不是通过 https 打开的，浏览器不提供加密功能：请用 https 地址，或在本机用 localhost 打开。");
      return;
    }
    joining = true;
    els.btnJoin.disabled = true;
    els.btnJoin.textContent = "正在进入…";
    try {
      if (room) await leaveRoom();
      const nextRoom = await deriveRoom(code);
      const records = await store.loadRoom(nextRoom.roomId);
      room = nextRoom;
      roomEpoch += 1;
      everConnected = false;
      restoreHistory(records);
      writeStorage(ROOM_KEY, code);
      writeStorage(JOINED_KEY, "1");
      links.forEach((link) => link.mqtt.start(() => buildSession(link)));
      sweepTimer = setInterval(sweepPeers, PEER_SWEEP_MS);
      renderRoom();
      els.textInput.focus({ preventScroll: true });
    } catch (err) {
      console.error("进入房间失败", err);
      showJoinError("进入房间失败：" + (err && err.message ? err.message : "浏览器不支持所需的加密功能"));
    } finally {
      joining = false;
      els.btnJoin.disabled = false;
      els.btnJoin.textContent = "进入房间";
    }
  }

  function showJoinError(message) {
    els.joinError.textContent = message;
    els.joinError.hidden = false;
  }

  /** 把本机存的历史放回列表；删除记录（墓碑）单独记着，别的设备再同步过来也不会复活 */
  function restoreHistory(records) {
    const alive = [];
    const deleted = [];
    records.forEach((record) => (record.deleted ? deleted : alive).push(record));
    deleted.sort((left, right) => right.seq - left.seq);
    deleted.slice(0, TOMBSTONE_LIMIT).forEach((record) => tombstones.add(record.id));
    deleted.slice(TOMBSTONE_LIMIT).forEach((record) => {
      store.remove(record.id).catch((err) => console.error("清理过期删除记录失败", err));
    });
    alive.sort((left, right) => left.seq - right.seq).forEach((record) => {
      const item = Object.assign({}, record, { status: "", sendState: record.dev === me.deviceId ? "sent" : "" });
      insertItem(item);
    });
    updateHistoryChrome();
  }

  async function leaveRoom() {
    if (!room) return;
    await Promise.race([
      broadcast({ t: "bye", all: 1 }, null, 0),
      new Promise((resolve) => setTimeout(resolve, LEAVE_FLUSH_MS))
    ]);
    roomEpoch += 1;
    links.forEach((link) => {
      link.mqtt.stop();
      flushLink(link);
    });
    direct.discardAll();
    clearTimeout(helloTimer);
    clearInterval(sweepTimer);
    fetchJobs.forEach((job) => {
      job.cancelled = true;
      if (job.onActivity) job.onActivity(false);
    });
    fetchJobs.clear();
    fetchQueue.length = 0;
    relayWaiters.forEach((wake) => wake(false));
    relayWaiters.clear();
    objectUrls.forEach((url) => URL.revokeObjectURL(url));
    objectUrls.clear();
    [items, itemNodes, tombstones, peers, holders, servedPieces, metaAskedAt, helloAskedAt, seenEnvelopes, dirtyItems].forEach((collection) => collection.clear());
    els.itemList.textContent = "";
    room = null;
    writeStorage(JOINED_KEY, "0");
    renderRoom();
  }

  /* —— 历史列表的增删 —— */

  function sortedItems() {
    return Array.from(items.values()).sort((left, right) => right.seq - left.seq || (left.id < right.id ? 1 : -1));
  }

  function insertItem(item) {
    items.set(item.id, item);
    if (items.size > HISTORY_LIMIT) {
      const oldest = sortedItems()[items.size - 1];
      forgetItem(oldest);
      store.remove(oldest.id).catch((err) => console.error("清理最旧的历史失败", err));
      if (oldest === item) return;
    }
    const view = buildItemView(item);
    itemNodes.set(item.id, view);
    const ordered = sortedItems();
    const older = ordered[ordered.indexOf(item) + 1];
    const olderView = older ? itemNodes.get(older.id) : null;
    els.itemList.insertBefore(view.node, olderView ? olderView.node : null);
    refreshItem(item);
    updateHistoryChrome();
  }

  /** 从内存和页面上拿掉一条，并让正在进行的接收停下来 */
  function forgetItem(item) {
    items.delete(item.id);
    stopFetch(item.id);
    const url = objectUrls.get(item.id);
    if (url) {
      URL.revokeObjectURL(url);
      objectUrls.delete(item.id);
    }
    const view = itemNodes.get(item.id);
    if (view) view.node.remove();
    itemNodes.delete(item.id);
    holders.delete(item.id);
    servedPieces.delete(item.id);
  }

  /** 只删本机这一份，并留一条删除记录，免得别的设备下次同步又把它带回来 */
  function deleteItem(item) {
    forgetItem(item);
    tombstones.add(item.id);
    store.put({ id: item.id, room: item.room, deleted: true, seq: Date.now() }).catch((err) => {
      console.error("保存删除记录失败", item.id, err);
    });
    updateHistoryChrome();
  }

  function clearHistory() {
    if (!items.size) return;
    if (!window.confirm("清空这台设备上的 " + items.size + " 条历史？其他设备上的不受影响。")) return;
    Array.from(items.values()).forEach(deleteItem);
    toast("已清空本机历史");
  }

  /* —— 界面：房间 —— */

  function connectionState() {
    if (!room) return "idle";
    if (relayUp()) return "up";
    if (navigator.onLine === false) return "offline";
    const struggling = links.every((link) => link.mqtt.failureCount() >= FAILURES_BEFORE_DOWN);
    return everConnected || struggling ? "down" : "connecting";
  }

  function renderRoom() {
    const joined = Boolean(room);
    els.joinPanel.hidden = joined;
    els.roomPanel.hidden = !joined;
    els.composer.hidden = !joined;
    els.historySection.hidden = !joined;
    const state = connectionState();
    const deviceCount = peers.size + 1;
    const view = {
      idle: { tone: "", text: "未进入房间", shell: "", label: "未进入房间" },
      connecting: { tone: "is-busy", text: "正在连接…", shell: "busy", label: "连接中…" },
      up: { tone: "is-on", text: "已连接 · " + deviceCount + " 台设备在线", shell: "on", label: "已连接 · " + deviceCount + " 台在线" },
      down: { tone: "is-err", text: everConnected ? "连接断开了，正在自动重连…" : "连不上服务器，正在重试…", shell: "err", label: "连接断开，重连中" },
      offline: { tone: "is-err", text: "没有网络，联网后自动重连", shell: "err", label: "没有网络" }
    }[state];
    postToShell({ type: "status", status: view.shell, label: view.label });
    if (!joined) return;
    els.roomStatus.className = "room-status " + view.tone;
    els.roomStatusText.textContent = view.text;
    els.btnReconnect.hidden = state !== "down" && state !== "offline";
    els.roomCode.textContent = room.code;
    renderPeers();
    const alone = state === "up" && !peers.size;
    els.roomNote.hidden = !alone;
    if (alone) els.roomNote.textContent = "现在只有这台设备。在其他设备上打开本页、输入同一个房间码，或用「复制进房链接」发过去。";
  }

  function renderPeers() {
    els.peerList.textContent = "";
    const addChip = (label, isSelf) => {
      const chip = document.createElement("li");
      chip.className = "peer-chip" + (isSelf ? " is-self" : "");
      chip.textContent = label;
      els.peerList.appendChild(chip);
    };
    addChip("本机 · " + me.name, true);
    Array.from(peers.values())
      .map((peer) => peer.name)
      .sort((left, right) => left.localeCompare(right, "zh-CN"))
      .forEach((name) => addChip(name, false));
  }

  /* —— 界面：历史条目 —— */

  function isMine(item) {
    return item.dev === me.deviceId;
  }

  function summarize(item) {
    if (item.kind === "text") return (item.text || "").replace(/\s+/g, " ").slice(0, 60) || "一段文字";
    return (item.kind === "image" ? "图片 " : "文件 ") + (item.name || "") + "（" + formatBytes(item.size) + "）";
  }

  /** 自己发的条目：按在线设备的回执算出「送达几台」和整体进度 */
  function deliveryOf(item) {
    const holderSet = holders.get(item.id) || EMPTY_SET;
    const byPeer = servedPieces.get(item.id);
    const total = pieceCount(item.size) || 1;
    let delivered = 0;
    let progress = 0;
    peers.forEach((peer, peerId) => {
      if (holderSet.has(peerId)) {
        delivered += 1;
        progress += 1;
        return;
      }
      progress += byPeer ? (byPeer.get(peerId) || 0) / total : 0;
    });
    return { online: peers.size, delivered, progress: peers.size ? progress / peers.size : 0 };
  }

  /** 一条内容当前的状态：文字、颜色、进度条、能点的按钮，全部从这里出 */
  function describeItem(item) {
    const baseActions = [];
    if (item.done && item.kind !== "file") baseActions.push("copy");
    if (item.done && item.kind !== "text") baseActions.push("download");
    if (item.done && item.kind === "image" && IN_SHELL) baseActions.push("stitch");
    baseActions.push("delete");

    if (isMine(item) && item.done) {
      if (item.sendState === "failed") {
        return { tone: "is-err", text: "发送失败：没连上服务器，连上后会自动重发", progress: null, actions: ["retry"].concat(baseActions) };
      }
      if (item.sendState === "sending") return { tone: "is-busy", text: "发送中…", progress: null, actions: baseActions };
      // 断线时不对「送达几台」下结论，房间状态那一行已经说明在重连
      if (!relayUp()) return { tone: "", text: "", progress: null, actions: baseActions };
      const delivery = deliveryOf(item);
      if (!delivery.online) {
        return { tone: "", text: "已保存 · 暂时没有其他设备在线，有设备进来会自动同步", progress: null, actions: baseActions };
      }
      if (delivery.delivered >= delivery.online) {
        return { tone: "is-ok", text: "已送达 " + delivery.online + " 台设备", progress: null, actions: baseActions };
      }
      return {
        tone: "is-busy",
        text: "发送中 " + Math.round(delivery.progress * 100) + "% · 已送达 " + delivery.delivered + "/" + delivery.online + " 台",
        progress: delivery.progress,
        actions: baseActions
      };
    }

    if (item.done) return { tone: "", text: "", progress: null, actions: baseActions };

    const job = fetchJobs.get(item.id);
    const progress = job && item.size ? job.bytes / item.size : 0;
    if (item.status === "receiving") {
      const route = job && job.via === "direct" ? "设备直连" : "服务器中继";
      return { tone: "is-busy", text: "接收中 " + Math.round(progress * 100) + "% · " + route, progress, actions: baseActions };
    }
    if (item.status === "failed") {
      return { tone: "is-err", text: "接收失败：" + (item.reason || "传输中断"), progress: job ? progress : null, actions: ["retry"].concat(baseActions) };
    }
    if (item.status === "offered") {
      return { tone: "is-wait", text: "较大的历史内容（" + formatBytes(item.size) + "），需要时点「接收」", progress: null, actions: ["fetch"].concat(baseActions) };
    }
    if (item.status === "waiting") {
      return { tone: "is-wait", text: "有这条内容的设备都不在线，等它上线后自动接收", progress: job ? progress : null, actions: baseActions };
    }
    return { tone: "is-busy", text: relayUp() ? "等待接收…" : "等待连接…", progress: null, actions: baseActions };
  }

  const ACTION_LABELS = { copy: "复制", download: "下载", stitch: "拼接", delete: "删除", retry: "重试", fetch: "接收" };
  const ACTION_TITLES = {
    stitch: "把这张图加到「图片拼接」",
    delete: "只从这台设备删除，其他设备不受影响"
  };

  function buildItemView(item) {
    const node = document.createElement("li");
    node.className = "item" + (isMine(item) ? " is-mine" : "");
    node.dataset.id = item.id;

    const head = document.createElement("div");
    head.className = "item-head";
    const from = document.createElement("span");
    from.className = "item-from";
    from.textContent = isMine(item) ? "本机" : item.from;
    const time = document.createElement("span");
    time.textContent = formatTime(item.seq);
    head.append(from, time);

    const body = document.createElement("div");
    body.className = "item-body";

    const foot = document.createElement("div");
    foot.className = "item-foot";
    const state = document.createElement("span");
    state.className = "item-state";
    const actions = document.createElement("span");
    actions.className = "item-actions";
    foot.append(state, actions);

    const progress = document.createElement("div");
    progress.className = "item-progress";
    progress.hidden = true;
    progress.appendChild(document.createElement("span"));

    node.append(head, body, foot, progress);
    return { node, body, state, actions, progress, bodyKey: "", actionsKey: "" };
  }

  function objectUrlOf(item) {
    let url = objectUrls.get(item.id);
    if (!url) {
      url = URL.createObjectURL(item.blob);
      objectUrls.set(item.id, url);
    }
    return url;
  }

  function buildFileRow(item) {
    const row = document.createElement("div");
    row.className = "item-file";
    row.innerHTML = '<svg class="item-file-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
    const name = document.createElement("span");
    name.className = "item-file-name";
    name.textContent = item.kind === "text" ? "一段文字" : item.name || (item.kind === "image" ? "图片" : "文件");
    const size = document.createElement("span");
    size.className = "item-file-size";
    size.textContent = formatBytes(item.size);
    row.append(name, size);
    return row;
  }

  function buildBody(item, container) {
    container.textContent = "";
    if (item.done && item.kind === "text") {
      const text = document.createElement("pre");
      text.className = "item-text";
      text.textContent = item.text;
      container.appendChild(text);
      return;
    }
    if (item.done && item.kind === "image" && !item.previewBroken) {
      const opener = document.createElement("button");
      opener.type = "button";
      opener.className = "item-image";
      opener.dataset.action = "preview";
      opener.title = "点击放大";
      const image = document.createElement("img");
      image.alt = item.name || "图片";
      image.loading = "lazy";
      // 浏览器解不了这种图片格式时，退回成文件样式，照样能下载
      image.addEventListener("error", () => {
        item.previewBroken = true;
        refreshItem(item);
      });
      image.src = objectUrlOf(item);
      opener.appendChild(image);
      const caption = document.createElement("div");
      caption.className = "item-caption";
      caption.textContent = (item.name || "图片") + " · " + formatBytes(item.size);
      container.append(opener, caption);
      return;
    }
    container.appendChild(buildFileRow(item));
  }

  function refreshItem(item) {
    const parts = itemNodes.get(item.id);
    if (!parts) return;
    const bodyKey = (item.done ? "done" : "pending") + (item.previewBroken ? "-broken" : "");
    if (parts.bodyKey !== bodyKey) {
      parts.bodyKey = bodyKey;
      buildBody(item, parts.body);
    }
    const status = describeItem(item);
    parts.state.className = "item-state " + status.tone;
    parts.state.textContent = status.text;
    parts.progress.hidden = status.progress === null;
    if (status.progress !== null) parts.progress.firstChild.style.width = Math.round(Math.min(status.progress, 1) * 100) + "%";
    const actionsKey = status.actions.join(",");
    if (parts.actionsKey === actionsKey) return;
    parts.actionsKey = actionsKey;
    parts.actions.textContent = "";
    status.actions.forEach((action) => {
      const button = document.createElement("button");
      button.type = "button";
      const emphasized = action === "retry" || action === "fetch";
      button.className = "btn btn-sm" + (emphasized ? " btn-primary" : "") + (action === "delete" ? " btn-danger" : "");
      button.dataset.action = action;
      button.textContent = ACTION_LABELS[action];
      if (ACTION_TITLES[action]) button.title = ACTION_TITLES[action];
      parts.actions.appendChild(button);
    });
  }

  /** 进度变化很密，攒一下再画；用定时器而不是动画帧，页面在后台或嵌在隐藏的标签里也照常更新 */
  function markDirty(item) {
    dirtyItems.add(item.id);
    if (renderTimer) return;
    renderTimer = setTimeout(() => {
      renderTimer = 0;
      const ids = Array.from(dirtyItems);
      dirtyItems.clear();
      ids.forEach((id) => {
        const dirty = items.get(id);
        if (dirty) refreshItem(dirty);
      });
    }, RENDER_THROTTLE_MS);
  }

  function refreshAllStates() {
    items.forEach(markDirty);
  }

  function updateHistoryChrome() {
    els.historyEmpty.hidden = items.size > 0;
    els.historyCount.textContent = items.size ? items.size + " 条" : "";
    els.btnClear.hidden = !items.size;
  }

  /* —— 条目上的操作 —— */

  function copyTextLegacy(text) {
    const holder = document.createElement("textarea");
    holder.value = text;
    holder.setAttribute("readonly", "");
    holder.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(holder);
    holder.select();
    let copied = false;
    try {
      copied = document.execCommand("copy");
    } catch (err) {
      console.error("兼容复制失败", err);
    }
    holder.remove();
    return copied;
  }

  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText && document.hasFocus()) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) {
        console.warn("剪贴板接口不可用，改用兼容复制", err);
      }
    }
    return copyTextLegacy(text);
  }

  /** 浏览器只认 PNG：别的格式先画到画布上转一下 */
  async function toPngBlob(blob) {
    if (blob.type === "image/png") return blob;
    const bitmap = await createImageBitmap(blob);
    const canvas = document.createElement("canvas");
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    canvas.getContext("2d").drawImage(bitmap, 0, 0);
    bitmap.close();
    return new Promise((resolve, reject) => {
      canvas.toBlob((png) => (png ? resolve(png) : reject(new Error("转成 PNG 失败"))), "image/png");
    });
  }

  async function copyItem(item) {
    if (item.kind === "text") {
      const copied = await copyText(item.text);
      toast(copied ? "已复制" : "复制失败：浏览器没允许写入剪贴板，请手动选中文字复制", !copied);
      return;
    }
    if (!navigator.clipboard || !window.ClipboardItem) {
      toast("这个浏览器不支持复制图片，请用「下载」", true);
      return;
    }
    try {
      // 把「转 PNG」的过程直接交给剪贴板：Safari 要求写入动作紧跟在点击之后
      await navigator.clipboard.write([new ClipboardItem({ "image/png": toPngBlob(item.blob) })]);
      toast("图片已复制");
    } catch (err) {
      console.error("复制图片失败", err);
      toast("复制失败：浏览器没允许写入剪贴板，请用「下载」", true);
    }
  }

  function downloadItem(item) {
    const fallbackName = item.kind === "image" ? "图片.png" : "文件";
    const link = document.createElement("a");
    link.href = objectUrlOf(item);
    link.download = item.name || fallbackName;
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function sendToStitch(item) {
    const file = new File([item.blob], item.name || "图片.png", { type: item.blob.type || item.mime || "image/png" });
    postToShell({ type: "open-in-stitch", files: [file] });
    toast("已把这张图加到「图片拼接」");
  }

  function onItemAction(event) {
    const button = event.target.closest("[data-action]");
    if (!button) return;
    const node = button.closest(".item");
    const item = node ? items.get(node.dataset.id) : null;
    if (!item) return;
    const action = button.dataset.action;
    if (action === "copy") copyItem(item);
    else if (action === "download") downloadItem(item);
    else if (action === "stitch") sendToStitch(item);
    else if (action === "preview") openLightbox(item);
    else if (action === "delete") deleteItem(item);
    else if (action === "fetch") requestBody(item, true);
    else if (action === "retry") {
      if (item.done) retrySend(item);
      else retryFetch(item);
    }
  }

  function retryFetch(item) {
    if (!relayUp()) reconnectNow();
    direct.forgetFailures();
    requestBody(item, true);
  }

  function openLightbox(item) {
    els.lightboxImage.src = objectUrlOf(item);
    els.lightboxImage.alt = item.name || "图片";
    els.lightbox.hidden = false;
    els.lightboxClose.focus();
  }

  function closeLightbox() {
    els.lightbox.hidden = true;
    els.lightboxImage.removeAttribute("src");
  }

  /* —— 发送区 —— */

  async function submitText() {
    if (!room) return;
    const sent = await sendText(els.textInput.value);
    if (sent) els.textInput.value = "";
    els.textInput.focus({ preventScroll: true });
  }

  function filesFromTransfer(transfer) {
    if (!transfer) return [];
    const fromItems = Array.from(transfer.items || [])
      .filter((entry) => entry.kind === "file")
      .map((entry) => entry.getAsFile())
      .filter(Boolean);
    return fromItems.length ? fromItems : Array.from(transfer.files || []);
  }

  /** 粘贴：有文字就进输入框（由用户点发送），只有图片或文件才直接发出 */
  function onPaste(event) {
    if (!room || !event.clipboardData) return;
    const text = event.clipboardData.getData("text/plain");
    if (text) {
      if (document.activeElement === els.textInput) return;
      event.preventDefault();
      els.textInput.focus({ preventScroll: true });
      els.textInput.setRangeText(text, els.textInput.selectionStart, els.textInput.selectionEnd, "end");
      return;
    }
    const files = filesFromTransfer(event.clipboardData);
    if (!files.length) return;
    event.preventDefault();
    sendFiles(files);
  }

  function bindComposer() {
    const coarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    els.textInput.placeholder = coarsePointer ? "输入或粘贴要发送的文字" : "输入文字，Enter 发送，Shift + Enter 换行";
    els.composerTip.textContent = coarsePointer ? "选图片或文件后会直接发出" : "粘贴或拖入图片、文件会直接发出";
    els.btnSend.addEventListener("click", submitText);
    els.textInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey || event.isComposing || coarsePointer) return;
      event.preventDefault();
      submitText();
    });
    els.btnPickFile.addEventListener("click", () => els.fileInput.click());
    els.fileInput.addEventListener("change", () => {
      const files = Array.from(els.fileInput.files || []);
      els.fileInput.value = "";
      if (files.length) sendFiles(files);
    });
    document.addEventListener("paste", onPaste);
    const hasFiles = (event) => Boolean(event.dataTransfer) && Array.from(event.dataTransfer.types || []).includes("Files");
    document.addEventListener("dragover", (event) => {
      if (!room || !hasFiles(event)) return;
      event.preventDefault();
      els.composer.classList.add("is-dragover");
    });
    document.addEventListener("dragleave", (event) => {
      if (!event.relatedTarget) els.composer.classList.remove("is-dragover");
    });
    document.addEventListener("drop", (event) => {
      els.composer.classList.remove("is-dragover");
      if (!room || !hasFiles(event)) return;
      event.preventDefault();
      sendFiles(filesFromTransfer(event.dataTransfer));
    });
  }

  /* —— 工具箱外壳：上报连接状态和新内容，接收「图片拼接」发来的图 —— */

  function postToShell(message) {
    if (!IN_SHELL) return;
    try {
      window.parent.postMessage(Object.assign({ source: TOOL_SOURCE }, message), "/");
    } catch (err) {
      console.error("通知工具箱外壳失败", err);
    }
  }

  function notifyShellReceived(item) {
    postToShell({ type: "received", from: item.from, summary: summarize(item) });
  }

  async function onShellSendFiles(data) {
    const reply = (ok, message, extra) => {
      postToShell(Object.assign({ type: "send-result", requestId: data.requestId, ok, message }, extra));
    };
    const files = (Array.isArray(data.files) ? data.files : []).filter((file) => file && typeof file.size === "number" && typeof file.slice === "function");
    if (!files.length) {
      reply(false, "没有收到要发送的图片");
      return;
    }
    if (!room) {
      reply(false, "共享剪贴板还没进房间：先到「共享剪贴板」填房间码进房", { needRoom: true });
      return;
    }
    const outcome = await sendFiles(files);
    if (outcome.rejected.length) {
      reply(false, "没有发出：" + outcome.rejected.join("、"));
      return;
    }
    if (outcome.queued) {
      reply(false, "共享剪贴板没连上服务器：图片已存进它的历史，连上后会自动发出", { warn: true });
      return;
    }
    const audience = peers.size ? "，" + peers.size + " 台设备会收到" : "；现在没有其他设备在线，有设备进房后自动同步";
    reply(true, "已发到共享剪贴板房间「" + room.code + "」" + audience);
  }

  function onShellMessage(event) {
    if (!IN_SHELL || event.source !== window.parent) return;
    const data = event.data;
    if (!data || data.source !== SHELL_SOURCE) return;
    if (data.type === "send-files") onShellSendFiles(data);
  }

  /* —— 旧版留下的本机数据：不自动删，告诉用户并给一个清除按钮 —— */

  async function checkLegacyData() {
    if (!window.indexedDB || typeof indexedDB.databases !== "function") return;
    try {
      const databases = await indexedDB.databases();
      els.legacyNotice.hidden = !databases.some((database) => database.name === LEGACY_DB_NAME);
    } catch (err) {
      console.warn("检查旧版数据失败", err);
    }
  }

  function dropLegacyData() {
    if (!window.confirm("清除旧版共享剪贴板留在这台设备上的历史？清除后无法恢复。")) return;
    const request = indexedDB.deleteDatabase(LEGACY_DB_NAME);
    request.onsuccess = () => {
      LEGACY_STORAGE_KEYS.forEach((key) => {
        try {
          localStorage.removeItem(key);
        } catch (err) {
          console.error("清除旧版设置失败", key, err);
        }
      });
      els.legacyNotice.hidden = true;
      toast("旧数据已清除");
    };
    request.onerror = () => {
      console.error("清除旧版数据失败", request.error);
      toast("清除失败，稍后再试", true);
    };
    request.onblocked = () => toast("旧版页面还开着，关掉它再清除", true);
  }

  /* —— 启动 —— */

  function randomRoomCode() {
    const picks = crypto.getRandomValues(new Uint8Array(RANDOM_ROOM_LENGTH));
    return Array.from(picks, (pick) => RANDOM_ROOM_ALPHABET[pick % RANDOM_ROOM_ALPHABET.length]).join("");
  }

  /** 进房链接把房间码放在 # 后面：不会发给服务器，读完立刻从地址栏抹掉 */
  function takeRoomFromHash() {
    const matched = /(?:^#|&)join=([^&]*)/.exec(location.hash || "");
    if (!matched) return "";
    history.replaceState(null, "", location.pathname + location.search);
    try {
      return decodeURIComponent(matched[1]);
    } catch (err) {
      console.warn("进房链接里的房间码格式不对", err);
      return "";
    }
  }

  async function copyRoomLink() {
    const link = location.href.split("#")[0] + "#join=" + encodeURIComponent(room.code);
    const copied = await copyText(link);
    toast(copied ? "进房链接已复制，发到另一台设备上打开即可" : "复制失败，请手动把房间码告诉另一台设备", !copied);
  }

  function bindEvents() {
    els.joinForm.addEventListener("submit", (event) => {
      event.preventDefault();
      joinRoom(els.roomInput.value);
    });
    els.btnRandomRoom.addEventListener("click", () => {
      els.roomInput.value = randomRoomCode();
      els.roomInput.focus();
    });
    els.btnLeave.addEventListener("click", () => {
      leaveRoom().then(() => els.roomInput.focus());
    });
    els.btnReconnect.addEventListener("click", reconnectNow);
    els.btnCopyLink.addEventListener("click", copyRoomLink);
    els.btnClear.addEventListener("click", clearHistory);
    els.btnDropLegacy.addEventListener("click", dropLegacyData);
    els.itemList.addEventListener("click", onItemAction);
    els.lightbox.addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !els.lightbox.hidden) closeLightbox();
    });
    window.addEventListener("message", onShellMessage);
    window.addEventListener("online", reconnectNow);
    window.addEventListener("offline", renderRoom);
    // 手机切回前台时连接多半已经被系统掐掉：没连上的立刻重连，连着的探一下死活，再报一次清单补同步
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !room) return;
      links.forEach((link) => {
        if (link.mqtt.isReady()) link.mqtt.ping();
        else link.mqtt.retryNow();
      });
      broadcast(helloHeader(true), null, 0);
    });
    bindComposer();
  }

  function init() {
    loadIdentity();
    bindEvents();
    const linkedRoom = takeRoomFromHash();
    const savedRoom = readStorage(ROOM_KEY) || "";
    els.roomInput.value = linkedRoom || savedRoom;
    renderRoom();
    updateHistoryChrome();
    checkLegacyData();
    postToShell({ type: "ready" });
    if (linkedRoom) joinRoom(linkedRoom);
    else if (savedRoom && readStorage(JOINED_KEY) !== "0") joinRoom(savedRoom);
  }

  init();
})();
  </script>
</body>
