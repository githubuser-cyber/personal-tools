<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="共享剪贴板" />
  <title>共享剪贴板</title>
  <style>
    :root {
      --bg0: #f5f7fa;
      --bg1: #f5f7fa;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e4e7ed;
      --accent: #1677FF;
      --accent-hover: #0958D9;
      --accent-soft: rgba(22, 119, 255, 0.12);
      --danger: #b91c1c;
      --ok: #1677FF;
      --radius: 8px;
      --shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --glass: #ffffff;
      --glass-strong: #ffffff;
      --glass-border: #e4e7ed;
      --glass-blur: none;
      --glass-inset: none;
      --glass-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font);
      color: var(--text);
      background: #f5f7fa;
      
      
    }

    [hidden] { display: none !important; }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      height: 100%;
      margin: 0 auto;
      padding: 16px 18px 18px;
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .home-link {
      display: inline-block;
      margin-bottom: 6px;
      color: var(--accent);
      font-weight: 650;
      text-decoration: none;
      flex-shrink: 0;
    }

    .home-link:hover { text-decoration: underline; }

    .page-head {
      flex-shrink: 0;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 380px) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .panel-left,
    .panel-right {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 左侧随内容增高，不单独出滚动条；右侧占满高度，列表内部滚 */
    .panel-left {
      overflow: visible;
      align-self: start;
    }

    .panel-right {
      height: 100%;
      max-height: 100%;
      align-self: stretch;
    }

    .panel-right .card {
      background: #fff;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      padding: 14px 16px;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
      padding: 14px 16px;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .clip-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      font-size: 0.9rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.18);
    }

    .dot.is-on { background: #4096FF; box-shadow: 0 0 0 3px rgba(64, 150, 255, 0.28), 0 1px 2px rgba(15, 23, 42, 0.12); }
    .dot.is-busy { background: #f59e0b; }
    .dot.is-err { background: #ef4444; }

    .peers { color: var(--muted); font-size: 0.86rem; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 8px 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
      box-shadow: none;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #1677FF;
      box-shadow: 0 0 0 1px #1677FF inset;
    }

    textarea { min-height: 88px; resize: vertical; }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      border-radius: 4px;
      border: 1px solid #dcdfe6;
      background: #fff;
      color: #606266;
      cursor: pointer;
      box-shadow: none;
      transform: none;
      text-shadow: none;
      transition: color 0.1s, background-color 0.1s, border-color 0.1s;
    }

    .btn:hover:not(:disabled) {
      color: #1677FF;
      border-color: #c6e2ff;
      background: #ecf5ff;
      transform: none;
      filter: none;
      box-shadow: none;
    }

    .btn:active:not(:disabled) {
      color: #0958D9;
      border-color: #1677FF;
      background: #ecf5ff;
      transform: none;
      box-shadow: none;
      filter: none;
    }

    .btn:disabled {
      color: #c0c4cc;
      background: #fff;
      border-color: #ebeef5;
      cursor: not-allowed;
      opacity: 1;
    }

    .btn-primary {
      color: #fff;
      background: #1677FF;
      border-color: #1677FF;
    }

    .btn-primary:hover:not(:disabled) {
      color: #fff;
      background: #4096FF;
      border-color: #4096FF;
    }

    .btn-primary:active:not(:disabled) {
      color: #fff;
      background: #0958D9;
      border-color: #0958D9;
    }

    .btn-primary:disabled {
      color: #fff;
      background: #a0cfff;
      border-color: #a0cfff;
    }

    .btn-danger {
      color: #f56c6c;
      background: #fff;
      border-color: #fbc4c4;
    }

    .btn-danger:hover:not(:disabled) {
      color: #fff;
      background: #f56c6c;
      border-color: #f56c6c;
    }

    .btn-ghost {
      color: #606266;
      background: #fff;
      border-color: #dcdfe6;
    }

    .btn-ghost:hover:not(:disabled) {
      color: #1677FF;
      border-color: #c6e2ff;
      background: #ecf5ff;
    }

    .btn-sm {
      height: 28px;
      padding: 0 12px;
      font-size: 12px;
    }

    .hint {
      margin: 10px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .dropzone {
      border: 1px dashed #c0c4cc;
      border-radius: 8px;
      padding: 22px 14px;
      text-align: center;
      color: #909399;
      background: #fafafa;
      cursor: pointer;
      box-shadow: none;
    }

    .dropzone.is-drag {
      border-color: var(--accent);
      border-style: solid;
      background: var(--accent-soft);
      color: var(--text);
      box-shadow: none;
    }

    .clip {
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      flex-shrink: 0;
      box-shadow: none;
    }

    .clip-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .clip-body {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
      max-height: 180px;
      overflow: auto;
    }

    .clip-file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .clip-progress-wrap {
      margin-top: 8px;
      width: 100%;
    }

    .clip-progress-text {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .clip-progress-text.is-err { color: var(--danger); }
    .clip-progress-text.is-ok { color: var(--ok); }

    .clip-progress {
      height: 6px;
      background: rgba(226, 232, 240, 0.72);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55) inset;
    }

    .clip-progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1677FF, #69B1FF);
      border-radius: 999px;
      transition: width 0.12s linear;
    }

    .clip-progress.is-err > span { background: var(--danger); }
    .clip-progress.is-pending > span { background: #94a3b8; }

    .clip-thumb {
      max-width: 100%;
      max-height: 160px;
      border-radius: 8px;
      display: block;
      margin-top: 8px;
      cursor: zoom-in;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(15, 23, 42, 0.42);
    }

    .lightbox[hidden] { display: none !important; }

    .lightbox-panel {
      width: min(96vw, 1100px);
      height: min(92vh, 900px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lightbox-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #0f172a;
      font-size: 0.9rem;
      flex-shrink: 0;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--glass-strong);
      box-shadow: var(--glass-shadow);
    }

    .lightbox-bar .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: min(42vw, 420px);
      font-weight: 650;
    }

    .lightbox-bar .bar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .lightbox-bar .zoom-val {
      min-width: 3.2em;
      text-align: right;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .lightbox-bar .btn {
      min-height: 36px;
      padding: 6px 10px;
    }

    .lightbox-body {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(15, 23, 42, 0.38);
      box-shadow: none;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .lightbox-body.is-dragging { cursor: grabbing; }

    .lightbox-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0);
      transform-origin: center center;
      will-change: transform;
    }

    .lightbox-stage img {
      display: block;
      max-width: none;
      pointer-events: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      background: #0f172a;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: none;
      font-size: 0.92rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 20;
      max-width: min(90vw, 360px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 860px) {
      html, body { height: auto; min-height: 100%; }
      .app {
        height: auto;
        min-height: 100vh;
        padding-bottom: 28px;
      }
      .layout {
        grid-template-columns: 1fr;
        flex: none;
      }
      .panel-left {
        overflow: visible;
      }
      .panel-right {
        order: -1;
      }
      .panel-right .card {
        flex: none;
        max-height: min(42vh, 420px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <a class="home-link" href="../../">← 返回工具箱</a>
    <div class="page-head">
      <h1>共享剪贴板</h1>
      <p class="lead">同一口令即可跨设备同步文字 / 图片 / 文件。走 MQTT 公共通道（非 ntfy），一般不易被限流。口令请自管，勿发敏感内容。</p>
    </div>

    <div class="layout">
      <div class="panel-left">
        <div class="card">
          <div class="status-row">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">未连接</span>
            <span class="peers" id="peerText"></span>
          </div>
        </div>

        <div class="card" id="joinCard">
          <label for="roomInput">房间口令</label>
          <input id="roomInput" type="text" maxlength="64" placeholder="例如：家里办公室" autocomplete="off" />
          <label for="nameInput" style="margin-top:12px">本机显示名</label>
          <input id="nameInput" type="text" maxlength="24" placeholder="例如：手机 / 公司电脑" autocomplete="off" />
          <div class="row-actions">
            <button type="button" class="btn btn-primary" id="joinBtn">进入房间</button>
            <button type="button" class="btn" id="leaveBtn" hidden>离开房间</button>
          </div>
          <p class="hint">口令完全一致才在同一房间。若连不上可刷新页面；仍失败多半是公司网拦了 MQTT。勿传机密。</p>
        </div>

        <div class="card" id="shareCard" hidden>
          <label for="textInput">粘贴或输入文字（Ctrl / ⌘ + V 也可）</label>
          <textarea id="textInput" placeholder="粘贴后点发送，或直接 Ctrl+V 到本页任意处"></textarea>
          <div class="row-actions">
            <button type="button" class="btn btn-primary" id="sendTextBtn">发送文字</button>
            <button type="button" class="btn" id="pickFileBtn">选择文件</button>
            <input id="fileInput" type="file" hidden multiple />
          </div>
          <div class="dropzone" id="dropzone" style="margin-top:12px">拖拽文件到这里，或点「选择文件」</div>
          <p class="hint">单文件建议 ≤8MB。卡住可点「重新接收」补齐；发送方可点「重发」。</p>
        </div>
      </div>

      <div class="panel-right">
        <div class="card">
          <div class="history-head">
            <strong>最近同步</strong>
            <button type="button" class="btn btn-danger" id="clearBtn">清空本机列表</button>
          </div>
          <div class="clip-list" id="clipList">
            <div class="empty" id="emptyHint">还没有内容。进入房间后粘贴即可。</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
      <div class="lightbox-bar">
        <span class="title" id="lightboxTitle">预览</span>
        <div class="bar-actions">
          <span class="zoom-val" id="lightboxZoomVal">100%</span>
          <button type="button" class="btn" id="lightboxZoomOut" title="缩小">−</button>
          <button type="button" class="btn" id="lightboxZoomIn" title="放大">+</button>
          <button type="button" class="btn" id="lightboxZoomReset" title="适应窗口">适应</button>
          <button type="button" class="btn" id="lightboxClose">关闭</button>
        </div>
      </div>
      <div class="lightbox-body" id="lightboxBody">
        <div class="lightbox-stage" id="lightboxStage">
          <img id="lightboxImg" alt="预览图" />
        </div>
      </div>
    </div>
  </div>

  <script src="./vendor/mqtt.min.js"></script>
  <script>
    (function () {
      var ROOM_KEY = "pt-clipboard-room";
      var NAME_KEY = "pt-clipboard-name";
      var DEVICE_KEY = "pt-clipboard-device";
      var JOINED_KEY = "pt-clipboard-joined";
      var MQTT_URLS = [
        "wss://broker.emqx.io:8084/mqtt",
        "wss://broker.hivemq.com:8884/mqtt"
      ];
      var MAX_HISTORY = 40;
      var MAX_FILE_BYTES = 8 * 1024 * 1024;
      var MAX_INLINE_CHARS = 120000;
      var FILE_CHUNK_BYTES = 96 * 1024;
      var UPLOAD_CONCURRENCY = 2;
      var CHUNK_INFLIGHT = 3;
      var RECEIVE_STALL_MS = 5000;
      var PEER_TTL_MS = 8 * 60 * 1000;
      var SEEN_TTL_MS = 10 * 60 * 1000;

      var statusDot = document.getElementById("statusDot");
      var statusText = document.getElementById("statusText");
      var peerText = document.getElementById("peerText");
      var roomInput = document.getElementById("roomInput");
      var nameInput = document.getElementById("nameInput");
      var joinBtn = document.getElementById("joinBtn");
      var leaveBtn = document.getElementById("leaveBtn");
      var shareCard = document.getElementById("shareCard");
      var textInput = document.getElementById("textInput");
      var sendTextBtn = document.getElementById("sendTextBtn");
      var pickFileBtn = document.getElementById("pickFileBtn");
      var fileInput = document.getElementById("fileInput");
      var dropzone = document.getElementById("dropzone");
      var clipList = document.getElementById("clipList");
      var emptyHint = document.getElementById("emptyHint");
      var clearBtn = document.getElementById("clearBtn");
      var toastEl = document.getElementById("toast");
      var lightbox = document.getElementById("lightbox");
      var lightboxTitle = document.getElementById("lightboxTitle");
      var lightboxBody = document.getElementById("lightboxBody");
      var lightboxStage = document.getElementById("lightboxStage");
      var lightboxImg = document.getElementById("lightboxImg");
      var lightboxClose = document.getElementById("lightboxClose");
      var lightboxZoomVal = document.getElementById("lightboxZoomVal");
      var lightboxZoomIn = document.getElementById("lightboxZoomIn");
      var lightboxZoomOut = document.getElementById("lightboxZoomOut");
      var lightboxZoomReset = document.getElementById("lightboxZoomReset");

      var deviceId = loadOrCreateDeviceId();
      var room = "";
      var topic = "";
      var displayName = "";
      var connected = false;
      var mqttClient = null;
      var mqttUrlIndex = 0;
      var pruneTimer = null;
      var history = [];
      var peers = Object.create(null);
      var seenIds = Object.create(null);
      var pendingFiles = Object.create(null);
      var toastTimer = null;
      var lastPasteAt = 0;
      var uidSeq = 0;
      var progressRenderTimer = null;
      var lightboxView = {
        scale: 1,
        x: 0,
        y: 0,
        min: 0.08,
        max: 12,
        dragging: false,
        pinching: false,
        lastX: 0,
        lastY: 0,
        moved: false,
        tapOnMask: false,
        pinchStartDist: 0,
        pinchStartScale: 1,
        pinchWorldX: 0,
        pinchWorldY: 0,
        rafId: 0,
        zoomDirty: false
      };

      roomInput.value = localStorage.getItem(ROOM_KEY) || "";
      nameInput.value = localStorage.getItem(NAME_KEY) || guessDeviceName();

      function guessDeviceName() {
        var ua = navigator.userAgent || "";
        if (/iPhone|iPad|Android/i.test(ua)) return "手机";
        if (/Macintosh/i.test(ua)) return "Mac";
        return "电脑";
      }

      function loadOrCreateDeviceId() {
        var id = localStorage.getItem(DEVICE_KEY);
        if (id) return id;
        id = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem(DEVICE_KEY, id);
        return id;
      }

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("show");
        }, 2200);
      }

      function lightboxTouchDistance(touches) {
        var dx = touches[0].clientX - touches[1].clientX;
        var dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function lightboxTouchCenter(touches) {
        var rect = lightboxBody.getBoundingClientRect();
        var midX = (touches[0].clientX + touches[1].clientX) / 2;
        var midY = (touches[0].clientY + touches[1].clientY) / 2;
        return {
          x: midX - rect.left - rect.width / 2,
          y: midY - rect.top - rect.height / 2
        };
      }

      function beginLightboxPinch(touches) {
        lightboxView.dragging = false;
        lightboxView.pinching = true;
        lightboxView.moved = true;
        lightboxView.tapOnMask = false;
        lightboxView.pinchStartDist = lightboxTouchDistance(touches);
        lightboxView.pinchStartScale = lightboxView.scale;
        var center = lightboxTouchCenter(touches);
        lightboxView.pinchWorldX = (center.x - lightboxView.x) / lightboxView.scale;
        lightboxView.pinchWorldY = (center.y - lightboxView.y) / lightboxView.scale;
      }

      function flushLightboxTransform() {
        lightboxView.rafId = 0;
        lightboxStage.style.transform =
          "translate3d(-50%, -50%, 0) translate3d(" + lightboxView.x + "px," + lightboxView.y + "px,0) scale(" + lightboxView.scale + ")";
        if (lightboxView.zoomDirty) {
          lightboxZoomVal.textContent = Math.round(lightboxView.scale * 100) + "%";
          lightboxView.zoomDirty = false;
        }
      }

      function applyLightboxTransform(updateZoom) {
        if (updateZoom) lightboxView.zoomDirty = true;
        if (lightboxView.rafId) return;
        lightboxView.rafId = requestAnimationFrame(flushLightboxTransform);
      }

      function fitLightboxToView() {
        var w = lightboxImg.naturalWidth;
        var h = lightboxImg.naturalHeight;
        var bw = lightboxBody.clientWidth;
        var bh = lightboxBody.clientHeight;
        if (!w || !h || !bw || !bh) {
          applyLightboxTransform(true);
          return;
        }
        var fit = Math.min(bw / w, bh / h) * 0.98;
        lightboxView.scale = Math.max(lightboxView.min, Math.min(lightboxView.max, fit));
        lightboxView.x = 0;
        lightboxView.y = 0;
        applyLightboxTransform(true);
      }

      function resetLightboxView(fit) {
        lightboxView.scale = 1;
        lightboxView.x = 0;
        lightboxView.y = 0;
        lightboxView.dragging = false;
        lightboxView.pinching = false;
        lightboxView.moved = false;
        lightboxView.tapOnMask = false;
        lightboxBody.classList.remove("is-dragging");
        applyLightboxTransform(true);
        if (fit) {
          requestAnimationFrame(function () {
            fitLightboxToView();
          });
        }
      }

      function zoomLightboxBy(factor, clientX, clientY) {
        var rect = lightboxBody.getBoundingClientRect();
        var cx = (clientX != null ? clientX : rect.left + rect.width / 2) - rect.left - rect.width / 2;
        var cy = (clientY != null ? clientY : rect.top + rect.height / 2) - rect.top - rect.height / 2;
        var next = Math.min(lightboxView.max, Math.max(lightboxView.min, lightboxView.scale * factor));
        if (next === lightboxView.scale) return;
        var worldX = (cx - lightboxView.x) / lightboxView.scale;
        var worldY = (cy - lightboxView.y) / lightboxView.scale;
        lightboxView.scale = next;
        lightboxView.x = cx - worldX * lightboxView.scale;
        lightboxView.y = cy - worldY * lightboxView.scale;
        applyLightboxTransform(true);
      }

      function openLightbox(url, title) {
        if (!url) return;
        lightboxTitle.textContent = title || "预览";
        lightboxImg.alt = title || "预览图";
        lightbox.hidden = false;
        document.body.style.overflow = "hidden";
        resetLightboxView(false);
        lightboxImg.onload = function () {
          fitLightboxToView();
        };
        lightboxImg.src = url;
        if (lightboxImg.complete && lightboxImg.naturalWidth) {
          fitLightboxToView();
        }
      }

      function closeLightbox() {
        lightbox.hidden = true;
        lightboxImg.onload = null;
        lightboxImg.removeAttribute("src");
        lightboxBody.classList.remove("is-dragging");
        lightboxView.dragging = false;
        lightboxView.pinching = false;
        document.body.style.overflow = "";
      }

      function onLightboxWheel(event) {
        if (lightbox.hidden) return;
        event.preventDefault();
        zoomLightboxBy(event.deltaY < 0 ? 1.12 : 1 / 1.12, event.clientX, event.clientY);
      }

      function onLightboxPointerDown(event) {
        if (lightbox.hidden) return;
        if (event.target.closest && event.target.closest(".lightbox-bar")) return;

        if (event.touches && event.touches.length >= 2) {
          event.preventDefault();
          beginLightboxPinch(event.touches);
          return;
        }

        if (event.button != null && event.button !== 0 && !(event.touches && event.touches.length)) return;
        event.preventDefault();
        lightboxView.pinching = false;
        lightboxView.dragging = true;
        lightboxView.moved = false;
        lightboxView.tapOnMask = !(event.target.closest && event.target.closest(".lightbox-stage"));
        lightboxView.lastX = event.clientX;
        lightboxView.lastY = event.clientY;
        if (event.touches && event.touches[0]) {
          lightboxView.lastX = event.touches[0].clientX;
          lightboxView.lastY = event.touches[0].clientY;
        }
        lightboxBody.classList.add("is-dragging");
      }

      function onLightboxPointerMove(event) {
        if (lightbox.hidden) return;

        if (event.touches && event.touches.length >= 2) {
          event.preventDefault();
          if (!lightboxView.pinching) beginLightboxPinch(event.touches);
          if (lightboxView.pinchStartDist < 1) return;
          var nextScale = lightboxView.pinchStartScale * (lightboxTouchDistance(event.touches) / lightboxView.pinchStartDist);
          nextScale = Math.min(lightboxView.max, Math.max(lightboxView.min, nextScale));
          var center = lightboxTouchCenter(event.touches);
          lightboxView.scale = nextScale;
          lightboxView.x = center.x - lightboxView.pinchWorldX * nextScale;
          lightboxView.y = center.y - lightboxView.pinchWorldY * nextScale;
          applyLightboxTransform(true);
          return;
        }

        if (!lightboxView.dragging) return;
        event.preventDefault();
        var clientX = event.clientX;
        var clientY = event.clientY;
        if (event.touches && event.touches[0]) {
          clientX = event.touches[0].clientX;
          clientY = event.touches[0].clientY;
        }
        var dx = clientX - lightboxView.lastX;
        var dy = clientY - lightboxView.lastY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) lightboxView.moved = true;
        lightboxView.x += dx;
        lightboxView.y += dy;
        lightboxView.lastX = clientX;
        lightboxView.lastY = clientY;
        applyLightboxTransform(false);
      }

      function onLightboxPointerUp(event) {
        if (lightbox.hidden) return;

        if (event.touches && event.touches.length === 1 && lightboxView.pinching) {
          lightboxView.pinching = false;
          lightboxView.dragging = true;
          lightboxView.lastX = event.touches[0].clientX;
          lightboxView.lastY = event.touches[0].clientY;
          lightboxBody.classList.add("is-dragging");
          return;
        }

        if (event.touches && event.touches.length > 0) return;

        var moved = lightboxView.moved;
        var tapOnMask = lightboxView.tapOnMask;
        lightboxView.dragging = false;
        lightboxView.pinching = false;
        lightboxView.tapOnMask = false;
        lightboxBody.classList.remove("is-dragging");

        if (!moved && tapOnMask) {
          closeLightbox();
        }
      }

      function setStatus(kind, text) {
        statusDot.className = "dot" + (kind ? " is-" + kind : "");
        statusText.textContent = text;
      }

      function formatBytes(n) {
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      function formatTime(ts) {
        var d = new Date(ts);
        var hh = String(d.getHours()).padStart(2, "0");
        var mm = String(d.getMinutes()).padStart(2, "0");
        var ss = String(d.getSeconds()).padStart(2, "0");
        return hh + ":" + mm + ":" + ss;
      }

      function roomToTopic(roomName) {
        var hash = 5381;
        var i;
        for (i = 0; i < roomName.length; i++) {
          hash = ((hash << 5) + hash) + roomName.charCodeAt(i);
          hash = hash | 0;
        }
        var hex = (hash >>> 0).toString(36);
        var safe = String(roomName).replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 28);
        return ("ptclip/" + hex + (safe || "r")).slice(0, 64);
      }

      function uid() {
        uidSeq += 1;
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + uidSeq.toString(36);
      }

      function pruneSeen() {
        var now = Date.now();
        Object.keys(seenIds).forEach(function (id) {
          if (now - seenIds[id] > SEEN_TTL_MS) delete seenIds[id];
        });
      }

      function markSeen(id) {
        if (!id) return false;
        if (seenIds[id]) return true;
        seenIds[id] = Date.now();
        pruneSeen();
        return false;
      }

      function updatePeerUi() {
        var now = Date.now();
        var names = [];
        Object.keys(peers).forEach(function (id) {
          if (id === deviceId) return;
          if (now - peers[id].at > PEER_TTL_MS) {
            delete peers[id];
            return;
          }
          names.push(peers[id].name || "设备");
        });
        if (!connected) {
          peerText.textContent = "";
          return;
        }
        if (!names.length) {
          peerText.textContent = "在线 1 台 · 仅本机";
          return;
        }
        peerText.textContent = "在线 " + (names.length + 1) + " 台 · " + names.join("、");
      }

      function notePeer(msg) {
        if (!msg || !msg.deviceId || msg.deviceId === deviceId) return;
        peers[msg.deviceId] = {
          name: msg.from || "设备",
          at: Date.now()
        };
        updatePeerUi();
      }

      function renderHistory(scrollToTop) {
        var keepScroll = clipList.scrollTop;
        clipList.querySelectorAll(".clip").forEach(function (node) {
          node.remove();
        });
        emptyHint.hidden = history.length > 0;
        history.forEach(function (item) {
          var el = document.createElement("div");
          el.className = "clip";
          if (item.id) el.setAttribute("data-id", item.id);
          var meta = document.createElement("div");
          meta.className = "clip-meta";
          meta.innerHTML = "<span>" + escapeHtml(item.from || "未知") + (item.self ? "（本机）" : "") + "</span><span>" + formatTime(item.at) + "</span>";
          el.appendChild(meta);

          if (item.kind === "text") {
            var body = document.createElement("div");
            body.className = "clip-body";
            body.textContent = item.text || "";
            el.appendChild(body);
            var actions = document.createElement("div");
            actions.className = "row-actions";
            var copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "btn";
            copyBtn.textContent = "复制";
            copyBtn.addEventListener("click", function () {
              copyText(item.text || "");
            });
            actions.appendChild(copyBtn);
            var resendTextBtn = document.createElement("button");
            resendTextBtn.type = "button";
            resendTextBtn.className = "btn";
            resendTextBtn.textContent = "重发";
            resendTextBtn.addEventListener("click", function () {
              resendItem(item);
            });
            actions.appendChild(resendTextBtn);
            el.appendChild(actions);
          } else {
            var fileRow = document.createElement("div");
            fileRow.className = "clip-file";
            var info = document.createElement("div");
            info.textContent = (item.fileName || "文件") + " · " + formatBytes(item.size || 0);
            fileRow.appendChild(info);
            var fileActions = document.createElement("div");
            fileActions.className = "row-actions";
            var transferring = item.upload && (
              item.upload.status === "uploading" ||
              item.upload.status === "pending" ||
              item.upload.status === "receiving"
            );
            var canRereceive = !item.self && !item.url && item.upload && (
              item.upload.status === "receiving" ||
              item.upload.status === "stalled" ||
              item.upload.status === "error"
            );
            if (item.url && !transferring) {
              var openBtn = document.createElement("a");
              openBtn.className = "btn";
              openBtn.href = item.url;
              openBtn.rel = "noopener";
              openBtn.download = item.fileName || "file";
              openBtn.textContent = "下载";
              fileActions.appendChild(openBtn);
            }
            var isImage = item.mime && item.mime.indexOf("image/") === 0 && item.url && !transferring;
            if (isImage) {
              var copyImgBtn = document.createElement("button");
              copyImgBtn.type = "button";
              copyImgBtn.className = "btn";
              copyImgBtn.textContent = "复制";
              copyImgBtn.addEventListener("click", function () {
                copyImage(item.url, item.mime);
              });
              fileActions.appendChild(copyImgBtn);
            }
            if (canRereceive) {
              var rereceiveBtn = document.createElement("button");
              rereceiveBtn.type = "button";
              rereceiveBtn.className = "btn btn-primary";
              rereceiveBtn.textContent = "重新接收";
              rereceiveBtn.addEventListener("click", function () {
                requestRereceive(item);
              });
              fileActions.appendChild(rereceiveBtn);
            }
            if (!transferring && !canRereceive) {
              var resendFileBtn = document.createElement("button");
              resendFileBtn.type = "button";
              resendFileBtn.className = "btn";
              resendFileBtn.textContent = "重发";
              resendFileBtn.addEventListener("click", function () {
                resendItem(item);
              });
              fileActions.appendChild(resendFileBtn);
            }
            fileRow.appendChild(fileActions);
            el.appendChild(fileRow);

            if (item.upload && item.upload.status !== "done") {
              el.appendChild(buildUploadProgress(item.upload));
            }

            if (isImage) {
              var img = document.createElement("img");
              img.className = "clip-thumb";
              img.alt = item.fileName || "图片";
              img.src = item.url;
              img.title = "点击预览";
              img.addEventListener("click", function () {
                openLightbox(item.url, item.fileName || "图片");
              });
              el.appendChild(img);
            }
          }
          clipList.appendChild(el);
        });
        clipList.scrollTop = scrollToTop ? 0 : keepScroll;
      }

      function buildUploadProgress(upload) {
        var wrap = document.createElement("div");
        wrap.className = "clip-progress-wrap";
        var total = Math.max(1, upload.total || 1);
        var done = Math.max(0, upload.done || 0);
        var pct = Math.min(100, Math.round((done / total) * 100));
        var label = document.createElement("div");
        label.className = "clip-progress-text";
        if (upload.status === "pending") {
          label.textContent = "排队中…";
          label.classList.add("is-pending");
        } else if (upload.status === "error") {
          label.textContent = "失败" + (upload.error ? "：" + upload.error : "");
          label.classList.add("is-err");
        } else if (upload.status === "stalled") {
          label.textContent = "接收中断 " + done + "/" + total + "（可点重新接收）";
          label.classList.add("is-err");
        } else if (upload.status === "receiving") {
          label.textContent = "接收中 " + done + "/" + total + "（" + pct + "%）";
        } else {
          label.textContent = "上传中 " + done + "/" + total + "（" + pct + "%）";
        }
        var bar = document.createElement("div");
        bar.className = "clip-progress";
        if (upload.status === "error" || upload.status === "stalled") bar.classList.add("is-err");
        if (upload.status === "pending") bar.classList.add("is-pending");
        var fill = document.createElement("span");
        fill.style.width = (upload.status === "pending" ? 8 : pct) + "%";
        bar.appendChild(fill);
        wrap.appendChild(label);
        wrap.appendChild(bar);
        return wrap;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function pushLocal(item) {
        history.unshift(item);
        if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
        renderHistory(true);
      }

      function patchLocal(id, patch, immediate) {
        var idx = -1;
        var i;
        for (i = 0; i < history.length; i++) {
          if (history[i].id === id) {
            idx = i;
            break;
          }
        }
        if (idx < 0) return;
        history[idx] = Object.assign({}, history[idx], patch);
        if (immediate) {
          if (progressRenderTimer) {
            clearTimeout(progressRenderTimer);
            progressRenderTimer = null;
          }
          renderHistory(false);
          return;
        }
        if (progressRenderTimer) return;
        progressRenderTimer = setTimeout(function () {
          progressRenderTimer = null;
          renderHistory(false);
        }, 80);
      }

      async function runPool(items, limit, worker) {
        var cursor = 0;
        async function runOne() {
          while (cursor < items.length) {
            var index = cursor;
            cursor += 1;
            await worker(items[index], index);
          }
        }
        var n = Math.min(limit || 1, items.length || 1);
        var tasks = [];
        var t;
        for (t = 0; t < n; t++) tasks.push(runOne());
        await Promise.all(tasks);
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            toast("已复制");
          }).catch(function () {
            fallbackCopy(text);
          });
          return;
        }
        fallbackCopy(text);
      }

      function blobToPng(blob) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(blob);
          var img = new Image();
          img.onload = function () {
            try {
              var canvas = document.createElement("canvas");
              canvas.width = img.naturalWidth;
              canvas.height = img.naturalHeight;
              canvas.getContext("2d").drawImage(img, 0, 0);
              canvas.toBlob(function (png) {
                URL.revokeObjectURL(url);
                if (png) resolve(png);
                else reject(new Error("toBlob failed"));
              }, "image/png");
            } catch (err) {
              URL.revokeObjectURL(url);
              reject(err);
            }
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("image load failed"));
          };
          img.src = url;
        });
      }

      // 复制图片到系统剪贴板；跨域附件先 fetch，失败再提示
      async function copyImage(url, mime) {
        if (!url) {
          toast("无可复制图片");
          return;
        }
        if (!navigator.clipboard || !window.ClipboardItem) {
          toast("当前浏览器不支持复制图片");
          return;
        }
        try {
          var resp = await fetch(url);
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          var blob = await resp.blob();
          var type = blob.type || mime || "image/png";
          var payload = blob;
          if (type !== "image/png") {
            payload = await blobToPng(blob);
            type = "image/png";
          }
          var data = {};
          data[type] = payload;
          await navigator.clipboard.write([new ClipboardItem(data)]);
          toast("已复制图片");
        } catch (err) {
          console.error("复制图片失败", err);
          toast("复制图片失败，可点打开后另存");
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          toast("已复制");
        } catch (err) {
          toast("复制失败");
        }
        document.body.removeChild(ta);
      }

      function stopChannel() {
        connected = false;
        closeMqttQuiet();
        if (pruneTimer) {
          clearInterval(pruneTimer);
          pruneTimer = null;
        }
        Object.keys(pendingFiles).forEach(function (fileId) {
          clearReceiveWatch(pendingFiles[fileId]);
        });
        peers = Object.create(null);
        pendingFiles = Object.create(null);
        updatePeerUi();
      }

      function closeMqttQuiet() {
        if (!mqttClient) return;
        try {
          mqttClient.removeAllListeners();
          mqttClient.end(true);
        } catch (e) {}
        mqttClient = null;
      }

      function uint8ToBase64(bytes) {
        var bin = "";
        var i;
        for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }

      function base64ToUint8(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        var i;
        for (i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      function leaveRoom() {
        // 先宣告离开，再拆连接，让对端立刻减台数
        publishBye();
        stopChannel();
        room = "";
        topic = "";
        shareCard.hidden = true;
        leaveBtn.hidden = true;
        joinBtn.disabled = false;
        roomInput.disabled = false;
        nameInput.disabled = false;
        localStorage.setItem(JOINED_KEY, "0");
        setStatus("", "未连接");
        toast("已离开房间");
      }

      async function joinRoom() {
        var nextRoom = (roomInput.value || "").trim();
        var nextName = (nameInput.value || "").trim() || guessDeviceName();
        if (!nextRoom) {
          toast("请填写房间口令");
          roomInput.focus();
          return;
        }
        if (typeof mqtt === "undefined" || !mqtt.connect) {
          setStatus("err", "MQTT 库加载失败");
          toast("MQTT 库未加载，请刷新");
          return;
        }
        stopChannel();
        room = nextRoom;
        displayName = nextName;
        topic = roomToTopic(room);
        localStorage.setItem(ROOM_KEY, room);
        localStorage.setItem(NAME_KEY, displayName);
        localStorage.setItem(JOINED_KEY, "1");
        roomInput.disabled = true;
        nameInput.disabled = true;
        joinBtn.disabled = true;
        leaveBtn.hidden = false;
        shareCard.hidden = false;
        mqttUrlIndex = 0;
        setStatus("busy", "正在连接通道…");
        openMqtt();
      }

      function openMqtt() {
        if (!topic) return;
        closeMqttQuiet();
        var url = MQTT_URLS[mqttUrlIndex % MQTT_URLS.length];
        setStatus("busy", "正在连接 " + (mqttUrlIndex % MQTT_URLS.length + 1) + "/" + MQTT_URLS.length + "…");
        try {
          mqttClient = mqtt.connect(url, {
            clientId: "ptc" + deviceId.slice(0, 12) + Math.random().toString(36).slice(2, 6),
            clean: true,
            reconnectPeriod: 5000,
            connectTimeout: 12000,
            protocolVersion: 4
          });
        } catch (err) {
          console.error("MQTT 连接创建失败", err);
          tryNextBroker();
          return;
        }

        mqttClient.on("connect", function () {
          connected = true;
          setStatus("on", "已连接 · 房间就绪");
          updatePeerUi();
          mqttClient.subscribe(topic, { qos: 0 }, function (err) {
            if (err) {
              console.error("订阅失败", err);
              setStatus("err", "订阅失败，请刷新");
              return;
            }
            // 进房宣告一次在线；对方收到后会回一声，双方都能统计到台数
            publishHello(false);
          });
          if (!pruneTimer) {
            pruneTimer = setInterval(updatePeerUi, 5000);
          }
        });

        mqttClient.on("message", function (msgTopic, payload) {
          if (msgTopic !== topic) return;
          handleMqttPayload(payload.toString());
        });

        mqttClient.on("reconnect", function () {
          connected = false;
          setStatus("busy", "通道重连中…");
        });

        mqttClient.on("close", function () {
          connected = false;
          if (topic) setStatus("busy", "通道断开，自动重连中…");
        });

        mqttClient.on("error", function (err) {
          console.error("MQTT 错误", err);
        });

        mqttClient.on("offline", function () {
          connected = false;
          setStatus("busy", "通道离线，重连中…");
        });

        setTimeout(function () {
          if (!topic || connected) return;
          if (mqttClient && !mqttClient.connected) {
            tryNextBroker();
          }
        }, 14000);
      }

      function tryNextBroker() {
        if (!topic) return;
        closeMqttQuiet();
        mqttUrlIndex += 1;
        if (mqttUrlIndex >= MQTT_URLS.length * 2) {
          setStatus("err", "连接失败，请刷新或检查网络");
          toast("通道连不上，请刷新重试");
          return;
        }
        openMqtt();
      }

      function publishHello(isReply) {
        if (!topic || !mqttClient || !mqttClient.connected) return;
        publishJson({
          v: 1,
          type: "hello",
          id: uid(),
          deviceId: deviceId,
          from: displayName,
          at: Date.now(),
          reply: !!isReply
        }).catch(function (err) {
          console.warn("在线宣告失败", err);
        });
      }

      // 关页/离开时尽量发出；不 await，避免拆连接前被卡住
      function publishBye() {
        if (!topic || !mqttClient || !mqttClient.connected) return;
        try {
          mqttClient.publish(topic, JSON.stringify({
            v: 1,
            type: "bye",
            id: uid(),
            deviceId: deviceId,
            from: displayName,
            at: Date.now()
          }), { qos: 0 });
        } catch (err) {
          console.warn("离开宣告失败", err);
        }
      }

      function handleMqttPayload(raw) {
        if (!raw) return;
        var payload;
        try {
          payload = JSON.parse(raw);
        } catch (err) {
          return;
        }
        if (!payload || payload.v !== 1) return;
        if (payload.deviceId === deviceId) return;

        // 对端离开：立刻从在线列表移除
        if (payload.type === "bye") {
          if (peers[payload.deviceId]) {
            delete peers[payload.deviceId];
            updatePeerUi();
          }
          return;
        }

        notePeer(payload);

        // 进房握手：收到对方 hello 后回一次（reply 不再回，避免互刷）
        if (payload.type === "hello") {
          if (!payload.reply) publishHello(true);
          return;
        }

        if (payload.type === "text") {
          if (markSeen(payload.id)) return;
          pushLocal({
            kind: "text",
            id: payload.id,
            from: payload.from || "对端",
            at: payload.at || Date.now(),
            text: payload.text || "",
            self: false
          });
          toast("收到文字");
          return;
        }

        if (payload.type === "file-chunk") {
          acceptFileChunk(payload);
          return;
        }
        if (payload.type === "file-done") {
          handleFileDone(payload);
          return;
        }
        if (payload.type === "file-need") {
          handleFileNeed(payload);
        }
      }

      function listMissingChunks(bag) {
        var missing = [];
        var i;
        for (i = 0; i < bag.total; i++) {
          if (!bag.chunks[i]) missing.push(i);
        }
        return missing;
      }

      function clearReceiveWatch(bag) {
        if (bag && bag.stallTimer) {
          clearTimeout(bag.stallTimer);
          bag.stallTimer = null;
        }
      }

      function touchReceiveWatch(fileId) {
        var bag = pendingFiles[fileId];
        if (!bag) return;
        clearReceiveWatch(bag);
        bag.stallTimer = setTimeout(function () {
          onReceiveStalled(fileId);
        }, RECEIVE_STALL_MS);
      }

      function onReceiveStalled(fileId) {
        var bag = pendingFiles[fileId];
        if (!bag || bag.got >= bag.total) return;
        var missing = listMissingChunks(bag);
        patchLocal(fileId, {
          upload: {
            done: bag.got,
            total: bag.total,
            status: "stalled",
            error: "缺 " + missing.length + " 片"
          }
        }, true);
        // 自动向发送端要一次缺片
        if (!bag.autoAsked) {
          bag.autoAsked = true;
          askFileChunks(fileId, missing, false);
        }
      }

      function askFileChunks(fileId, missing, isManual) {
        if (!connected) {
          toast("尚未连上，请稍候");
          return;
        }
        var bag = pendingFiles[fileId];
        var total = bag ? bag.total : (missing && missing.length) || 1;
        publishJson({
          v: 1,
          type: "file-need",
          id: fileId,
          missing: missing || [],
          total: total,
          deviceId: deviceId,
          from: displayName,
          at: Date.now()
        }, 1).then(function () {
          if (bag) {
            patchLocal(fileId, {
              upload: { done: bag.got, total: bag.total, status: "receiving" }
            }, true);
            touchReceiveWatch(fileId);
          }
          toast(isManual ? "已请求重新发送" : "正在补齐缺失分片…");
        }).catch(function (err) {
          console.error("请求补片失败", err);
          toast("请求补片失败");
        });
      }

      function requestRereceive(item) {
        if (!item || !item.id) return;
        if (!connected) {
          toast("尚未连上，请稍候");
          return;
        }
        var bag = pendingFiles[item.id];
        var total = (bag && bag.total) || (item.upload && item.upload.total) || 1;
        if (!bag) {
          bag = {
            from: item.from || "对端",
            at: item.at || Date.now(),
            fileName: item.fileName || "文件",
            mime: item.mime || "application/octet-stream",
            size: item.size || 0,
            total: total,
            chunks: [],
            got: 0,
            autoAsked: false
          };
          pendingFiles[item.id] = bag;
        } else {
          clearReceiveWatch(bag);
          bag.chunks = [];
          bag.got = 0;
          bag.autoAsked = false;
        }
        var missing = [];
        var i;
        for (i = 0; i < bag.total; i++) missing.push(i);
        patchLocal(item.id, {
          url: "",
          blob: null,
          upload: { done: 0, total: bag.total, status: "receiving" }
        }, true);
        askFileChunks(item.id, missing, true);
      }

      function handleFileDone(payload) {
        if (!payload || !payload.id) return;
        if (seenIds[payload.id]) return;
        var bag = pendingFiles[payload.id];
        if (!bag) {
          // 一份都没收到：建占位并整文件重要
          var total = payload.total || 1;
          bag = {
            from: payload.from || "对端",
            at: payload.at || Date.now(),
            fileName: payload.fileName || "文件",
            mime: payload.mime || "application/octet-stream",
            size: payload.size || 0,
            total: total,
            chunks: [],
            got: 0,
            autoAsked: true
          };
          pendingFiles[payload.id] = bag;
          pushLocal({
            kind: "file",
            id: payload.id,
            from: bag.from,
            at: bag.at,
            fileName: bag.fileName,
            mime: bag.mime,
            size: bag.size,
            url: "",
            self: false,
            upload: { done: 0, total: total, status: "receiving" }
          });
          var all = [];
          var i;
          for (i = 0; i < total; i++) all.push(i);
          askFileChunks(payload.id, all, false);
          return;
        }
        if (bag.got >= bag.total) return;
        var missing = listMissingChunks(bag);
        if (!missing.length) return;
        bag.autoAsked = true;
        askFileChunks(payload.id, missing, false);
      }

      async function handleFileNeed(payload) {
        if (!payload || !payload.id) return;
        var item = null;
        var i;
        for (i = 0; i < history.length; i++) {
          if (history[i].id === payload.id && history[i].blob) {
            item = history[i];
            break;
          }
        }
        if (!item || !item.blob) {
          console.warn("对端要补片但本地无文件", payload.id);
          return;
        }
        var missing = payload.missing;
        if (!missing || !missing.length) {
          var all = [];
          var totalGuess = Math.max(1, Math.ceil(item.blob.size / FILE_CHUNK_BYTES));
          for (i = 0; i < totalGuess; i++) all.push(i);
          missing = all;
        }
        toast("正在补发 " + (item.fileName || "文件"));
        try {
          await publishFileChunks(item.blob, item.fileName || "文件", item.mime || item.blob.type || "application/octet-stream", item.id, item.at || Date.now(), missing);
        } catch (err) {
          console.error("补发失败", err);
        }
      }

      function acceptFileChunk(payload) {
        if (!payload || !payload.id) return;
        if (seenIds[payload.id]) return;

        var bag = pendingFiles[payload.id];
        var isNew = !bag;
        if (!bag) {
          bag = {
            from: payload.from || "对端",
            at: payload.at || Date.now(),
            fileName: payload.fileName || "文件",
            mime: payload.mime || "application/octet-stream",
            size: payload.size || 0,
            total: payload.total || 1,
            chunks: [],
            got: 0,
            autoAsked: false
          };
          pendingFiles[payload.id] = bag;
          pushLocal({
            kind: "file",
            id: payload.id,
            from: bag.from,
            at: bag.at,
            fileName: bag.fileName,
            mime: bag.mime,
            size: bag.size,
            url: "",
            self: false,
            upload: { done: 0, total: bag.total, status: "receiving" }
          });
          toast("正在接收 " + bag.fileName);
        }

        var index = payload.index;
        if (index == null || index < 0 || index >= bag.total) return;
        if (!bag.chunks[index]) {
          try {
            bag.chunks[index] = base64ToUint8(payload.data || "");
            bag.got += 1;
          } catch (err) {
            console.error("分片解码失败", err);
            return;
          }
        }

        touchReceiveWatch(payload.id);

        var complete = bag.got >= bag.total;
        patchLocal(payload.id, {
          upload: { done: bag.got, total: bag.total, status: "receiving" }
        }, complete || isNew);

        if (!complete) return;
        clearReceiveWatch(bag);
        if (markSeen(payload.id)) {
          delete pendingFiles[payload.id];
          return;
        }

        try {
          var totalLen = 0;
          var i;
          for (i = 0; i < bag.total; i++) {
            if (!bag.chunks[i]) throw new Error("缺分片 " + i);
            totalLen += bag.chunks[i].length;
          }
          var merged = new Uint8Array(totalLen);
          var offset = 0;
          for (i = 0; i < bag.total; i++) {
            merged.set(bag.chunks[i], offset);
            offset += bag.chunks[i].length;
          }
          var blob = new Blob([merged], { type: bag.mime });
          var url = URL.createObjectURL(blob);
          patchLocal(payload.id, {
            url: url,
            blob: blob,
            size: bag.size || blob.size,
            mime: bag.mime,
            upload: null
          }, true);
          toast("收到文件");
        } catch (err) {
          console.error("组装文件失败", err);
          patchLocal(payload.id, {
            upload: {
              done: bag.got,
              total: bag.total,
              status: "error",
              error: "组装失败"
            }
          }, true);
          toast("收到文件但组装失败");
        }
        delete pendingFiles[payload.id];
      }

      function publishJson(obj, qos) {
        if (!topic) return Promise.reject(new Error("未进房"));
        if (!mqttClient || !mqttClient.connected) return Promise.reject(new Error("未连接"));
        var body = JSON.stringify(obj);
        var level = qos == null ? 0 : qos;
        return new Promise(function (resolve, reject) {
          mqttClient.publish(topic, body, { qos: level }, function (err) {
            if (err) reject(err);
            else resolve();
          });
        });
      }

      async function resendItem(item) {
        if (!item) return;
        if (!topic) {
          toast("请先进入房间");
          return;
        }
        if (!connected) {
          toast("尚未连上，请稍候或刷新");
          return;
        }
        try {
          if (item.kind === "text") {
            var textId = uid();
            var textAt = Date.now();
            setStatus("busy", "正在重发…");
            await publishJson({
              v: 1,
              type: "text",
              id: textId,
              deviceId: deviceId,
              from: displayName,
              at: textAt,
              text: item.text || ""
            }, 1);
            markSeen(textId);
            pushLocal({
              kind: "text",
              id: textId,
              from: displayName,
              at: textAt,
              text: item.text || "",
              self: true
            });
            setStatus("on", "已连接 · 房间就绪");
            toast("已重发文字");
            return;
          }

          var blob = item.blob || null;
          if (!blob && item.url) {
            var resp = await fetch(item.url);
            if (!resp.ok) throw new Error("读取原文件失败");
            blob = await resp.blob();
          }
          if (!blob) {
            toast("无法重发：原文件已失效");
            return;
          }
          var fileId = uid();
          var fileAt = Date.now();
          await publishFileBlob(blob, item.fileName || "文件", item.mime || blob.type || "application/octet-stream", fileId, fileAt);
          setStatus("on", "已连接 · 房间就绪");
          toast("已重发 " + (item.fileName || "文件"));
        } catch (err) {
          console.error("重发失败", err);
          setStatus("err", "重发失败");
          toast("重发失败，请重试");
        }
      }

      async function sendText(text) {
        var content = String(text || "");
        if (!content.trim()) {
          toast("内容为空");
          return;
        }
        if (!topic) {
          toast("请先进入房间");
          return;
        }
        if (!connected) {
          toast("尚未连上，请稍候或刷新");
          return;
        }

        var id = uid();
        var at = Date.now();
        setStatus("busy", "正在发送…");
        try {
          if (content.length <= MAX_INLINE_CHARS) {
            await publishJson({
              v: 1,
              type: "text",
              id: id,
              deviceId: deviceId,
              from: displayName,
              at: at,
              text: content
            }, 1);

            pushLocal({
              kind: "text",
              id: id,
              from: displayName,
              at: at,

            });

            setStatus("on", "已连接 · 房间就绪");

            return;
          }
          var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
          await publishFileBlob(blob, "clipboard.txt", "text/plain", id, at);
          textInput.value = "";
          setStatus("on", "已连接 · 房间就绪");
          toast("已发送（长文分片）");
        } catch (err) {
          console.error("发送文字失败", err);
          setStatus("err", "发送失败");
          toast("发送失败，请重试");
        }
      }

      async function publishFileChunks(blob, fileName, mime, id, at, indices) {
        var buffer = await blob.arrayBuffer();
        var bytes = new Uint8Array(buffer);
        var total = Math.max(1, Math.ceil(bytes.length / FILE_CHUNK_BYTES));
        var list = indices && indices.length ? indices.slice() : [];
        var i;
        if (!list.length) {
          for (i = 0; i < total; i++) list.push(i);
        }
        await runPool(list, CHUNK_INFLIGHT, async function (chunkIndex) {
          if (chunkIndex < 0 || chunkIndex >= total) return;
          var slice = bytes.subarray(chunkIndex * FILE_CHUNK_BYTES, (chunkIndex + 1) * FILE_CHUNK_BYTES);
          await publishJson({
            v: 1,
            type: "file-chunk",
            id: id,
            deviceId: deviceId,
            from: displayName,
            at: at,
            fileName: fileName,
            mime: mime || "application/octet-stream",
            size: blob.size,
            index: chunkIndex,
            total: total,
            data: uint8ToBase64(slice)
          }, 1);
        });
      }

      async function publishFileBlob(blob, fileName, mime, id, at, options) {
        options = options || {};
        var buffer = await blob.arrayBuffer();
        var bytes = new Uint8Array(buffer);
        var total = Math.max(1, Math.ceil(bytes.length / FILE_CHUNK_BYTES));
        var localUrl = options.url || URL.createObjectURL(blob);
        var indices = [];
        var i;
        for (i = 0; i < total; i++) indices.push(i);

        if (options.alreadyInList) {
          patchLocal(id, {
            url: localUrl,
            blob: blob,
            upload: { done: 0, total: total, status: "uploading" }
          }, true);
        } else {
          pushLocal({
            kind: "file",
            id: id,
            from: displayName,
            at: at,
            fileName: fileName,
            mime: mime || "",
            size: blob.size,
            url: localUrl,
            blob: blob,
            self: true,
            upload: { done: 0, total: total, status: "uploading" }
          });
        }

        var completed = 0;
        // 全部分片 qos1 + 有限并行，降低缺片卡死
        await runPool(indices, CHUNK_INFLIGHT, async function (chunkIndex) {
          var slice = bytes.subarray(chunkIndex * FILE_CHUNK_BYTES, (chunkIndex + 1) * FILE_CHUNK_BYTES);
          await publishJson({
            v: 1,
            type: "file-chunk",
            id: id,
            deviceId: deviceId,
            from: displayName,
            at: at,
            fileName: fileName,
            mime: mime || "application/octet-stream",
            size: blob.size,
            index: chunkIndex,
            total: total,
            data: uint8ToBase64(slice)
          }, 1);
          completed += 1;
          patchLocal(id, {
            upload: { done: completed, total: total, status: "uploading" }
          }, completed >= total);
        });

        markSeen(id);
        patchLocal(id, { upload: null }, true);
        // 通知对端发送结束，便于对端发现缺片并自动补要
        await publishJson({
          v: 1,
          type: "file-done",
          id: id,
          deviceId: deviceId,
          from: displayName,
          at: at,
          fileName: fileName,
          mime: mime || "application/octet-stream",
          size: blob.size,
          total: total
        }, 1);
      }

      async function sendFiles(fileList) {
        var files = Array.prototype.slice.call(fileList || []);
        if (!files.length) return;
        if (!topic) {
          toast("请先进入房间");
          return;
        }
        if (!connected) {
          toast("尚未连上，请稍候或刷新");
          return;
        }

        var jobs = [];
        var i;
        for (i = 0; i < files.length; i++) {
          var file = files[i];
          if (file.size > MAX_FILE_BYTES) {
            toast(file.name + " 超过 8MB，已跳过");
            continue;
          }
          var id = uid();
          var at = Date.now();
          var totalChunks = Math.max(1, Math.ceil(file.size / FILE_CHUNK_BYTES));
          var previewUrl = URL.createObjectURL(file);
          pushLocal({
            kind: "file",
            id: id,
            from: displayName,
            at: at,
            fileName: file.name,
            mime: file.type || "application/octet-stream",
            size: file.size,
            url: previewUrl,
            blob: file,
            self: true,
            upload: { done: 0, total: totalChunks, status: "pending" }
          });
          jobs.push({
            file: file,
            id: id,
            at: at,
            url: previewUrl
          });
        }
        if (!jobs.length) return;

        setStatus("busy", "正在上传 " + jobs.length + " 个文件…");
        var okCount = 0;
        var failCount = 0;
        await runPool(jobs, UPLOAD_CONCURRENCY, async function (job) {
          try {
            await publishFileBlob(
              job.file,
              job.file.name,
              job.file.type || "application/octet-stream",
              job.id,
              job.at,
              { alreadyInList: true, url: job.url }
            );
            okCount += 1;
          } catch (err) {
            failCount += 1;
            console.error("发送文件失败", err);
            patchLocal(job.id, {
              upload: {
                done: 0,
                total: Math.max(1, Math.ceil(job.file.size / FILE_CHUNK_BYTES)),
                status: "error",
                error: "请点重发"
              }
            }, true);
          }
        });

        setStatus(connected ? "on" : "busy", connected ? "已连接 · 房间就绪" : "通道断开，自动重连中…");
        if (failCount && okCount) toast("完成：成功 " + okCount + "，失败 " + failCount);
        else if (failCount) toast("上传失败，可点重发");
        else toast("已发送 " + okCount + " 个文件");
      }

      document.addEventListener("paste", function (ev) {
        if (!topic) return;
        var now = Date.now();
        if (now - lastPasteAt < 400) return;
        lastPasteAt = now;

        var items = ev.clipboardData && ev.clipboardData.items;
        var files = [];
        if (items) {
          var i;
          for (i = 0; i < items.length; i++) {
            if (items[i].kind === "file") {
              var f = items[i].getAsFile();
              if (f) files.push(f);
            }
          }
        }
        if (files.length) {
          ev.preventDefault();
          sendFiles(files);
          return;
        }
        // 输入框内粘贴留给用户编辑；页面其它区域粘贴直接发送
        if (document.activeElement === textInput || document.activeElement === roomInput || document.activeElement === nameInput) {
          return;
        }
        var text = ev.clipboardData && ev.clipboardData.getData("text/plain");
        if (text) {
          ev.preventDefault();
          sendText(text);
        }
      });

      window.addEventListener("pagehide", function () {
        publishBye();
      });
      window.addEventListener("beforeunload", function () {
        publishBye();
        stopChannel();
      });

      // 网络恢复时尝试重订 SSE；久挂异常请手动刷新页面
      window.addEventListener("online", function () {
        if (!topic) return;
        if (!mqttClient || !mqttClient.connected) {
          openMqtt();
        }
      });

      renderHistory();
      // 上次已进房且口令仍在：打开页面自动重连，免得点「进入房间」
      if ((roomInput.value || "").trim() && localStorage.getItem(JOINED_KEY) !== "0") {
        joinRoom();
      } else {
        setStatus("", "未连接");
      }
    })();
  </script>
</body>
</html>
