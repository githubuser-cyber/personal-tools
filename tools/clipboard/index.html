<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="共享剪贴板" />
  <title>共享剪贴板</title>
  <style>
    :root {
      --bg0: #e8eef5;
      --bg1: #f5f7fb;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(148, 163, 184, 0.38);
      --accent: #0f766e;
      --accent-hover: #0d9488;
      --accent-soft: #ccfbf1;
      --danger: #b91c1c;
      --ok: #047857;
      --radius: 18px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 14px 36px rgba(15, 23, 42, 0.07);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1000px 480px at 0% -10%, rgba(13, 148, 136, 0.14), transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }

    [hidden] { display: none !important; }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 18px 48px;
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }

    .home-link {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--accent);
      font-weight: 650;
      text-decoration: none;
    }

    .home-link:hover { text-decoration: underline; }

    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      font-size: 0.9rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .dot.is-on { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }
    .dot.is-busy { background: #f59e0b; }
    .dot.is-err { background: #ef4444; }

    .peers { color: var(--muted); font-size: 0.86rem; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }

    textarea { min-height: 88px; resize: vertical; }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 12px;
      min-height: 42px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
    }

    .btn:hover:not(:disabled) { background: #fff; border-color: #94a3b8; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-danger { color: var(--danger); border-color: #fecaca; background: #fff5f5; }

    .hint {
      margin: 10px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .dropzone {
      border: 1.5px dashed rgba(13, 148, 136, 0.45);
      border-radius: 14px;
      padding: 22px 14px;
      text-align: center;
      color: var(--muted);
      background: rgba(204, 251, 241, 0.35);
      cursor: pointer;
    }

    .dropzone.is-drag {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    .clip-list { display: flex; flex-direction: column; gap: 10px; }

    .clip {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }

    .clip-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .clip-body {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
      max-height: 180px;
      overflow: auto;
    }

    .clip-file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .clip-thumb {
      max-width: 100%;
      max-height: 160px;
      border-radius: 8px;
      display: block;
      margin-top: 8px;
      cursor: zoom-in;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
    }

    .lightbox[hidden] { display: none !important; }

    .lightbox-panel {
      width: min(96vw, 1100px);
      height: min(92vh, 900px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lightbox-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #fff;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .lightbox-bar .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: min(42vw, 420px);
    }

    .lightbox-bar .bar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .lightbox-bar .zoom-val {
      min-width: 3.2em;
      text-align: right;
      opacity: 0.9;
      font-variant-numeric: tabular-nums;
    }

    .lightbox-bar .btn {
      min-height: 36px;
      padding: 6px 10px;
      background: rgba(248, 250, 252, 0.92);
    }

    .lightbox-body {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.55);
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .lightbox-body.is-dragging { cursor: grabbing; }

    .lightbox-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0);
      transform-origin: center center;
      will-change: transform;
    }

    .lightbox-stage img {
      display: block;
      max-width: none;
      pointer-events: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      background: #0f172a;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 20;
      max-width: min(90vw, 360px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app">
    <a class="home-link" href="../../">← 返回工具箱</a>
    <h1>共享剪贴板</h1>
    <p class="lead">同一口令即可跨设备同步文字 / 图片 / 文件。走 HTTPS 消息通道（ntfy），不依赖 WebRTC，公司网也能用。口令请自管，勿发敏感内容。</p>

    <div class="card">
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">未连接</span>
        <span class="peers" id="peerText"></span>
      </div>
    </div>

    <div class="card" id="joinCard">
      <label for="roomInput">房间口令</label>
      <input id="roomInput" type="text" maxlength="64" placeholder="例如：家里办公室" autocomplete="off" />
      <label for="nameInput" style="margin-top:12px">本机显示名</label>
      <input id="nameInput" type="text" maxlength="24" placeholder="例如：手机 / 公司电脑" autocomplete="off" />
      <div class="row-actions">
        <button type="button" class="btn btn-primary" id="joinBtn">进入房间</button>
        <button type="button" class="btn" id="leaveBtn" hidden>离开房间</button>
      </div>
      <p class="hint">口令完全一致才在同一房间。连接走 ntfy 公共实例，消息可能短暂经第三方中转，勿传机密。</p>
    </div>

    <div class="card" id="shareCard" hidden>
      <label for="textInput">粘贴或输入文字（Ctrl / ⌘ + V 也可）</label>
      <textarea id="textInput" placeholder="粘贴后点发送，或直接 Ctrl+V 到本页任意处"></textarea>
      <div class="row-actions">
        <button type="button" class="btn btn-primary" id="sendTextBtn">发送文字</button>
        <button type="button" class="btn" id="pickFileBtn">选择文件</button>
        <input id="fileInput" type="file" hidden multiple />
      </div>
      <div class="dropzone" id="dropzone" style="margin-top:12px">拖拽文件到这里，或点「选择文件」</div>
      <p class="hint">单文件 ≤15MB（通道附件上限）。大文件请改用网盘。</p>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
        <strong>最近同步</strong>
        <button type="button" class="btn btn-danger" id="clearBtn">清空本机列表</button>
      </div>
      <div class="clip-list" id="clipList">
        <div class="empty" id="emptyHint">还没有内容。进入房间后粘贴即可。</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
      <div class="lightbox-bar">
        <span class="title" id="lightboxTitle">预览</span>
        <div class="bar-actions">
          <span class="zoom-val" id="lightboxZoomVal">100%</span>
          <button type="button" class="btn" id="lightboxZoomOut" title="缩小">−</button>
          <button type="button" class="btn" id="lightboxZoomIn" title="放大">+</button>
          <button type="button" class="btn" id="lightboxZoomReset" title="适应窗口">适应</button>
          <button type="button" class="btn" id="lightboxClose">关闭</button>
        </div>
      </div>
      <div class="lightbox-body" id="lightboxBody">
        <div class="lightbox-stage" id="lightboxStage">
          <img id="lightboxImg" alt="预览图" />
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ROOM_KEY = "pt-clipboard-room";
      var NAME_KEY = "pt-clipboard-name";
      var DEVICE_KEY = "pt-clipboard-device";
      var JOINED_KEY = "pt-clipboard-joined";
      var NTFY_BASE = "https://ntfy.sh";
      var MAX_HISTORY = 40;
      var MAX_FILE_BYTES = 15 * 1024 * 1024;
      var MAX_INLINE_CHARS = 3500;
      var HEARTBEAT_MS = 20000;
      var PEER_TTL_MS = 45000;
      var SEEN_TTL_MS = 10 * 60 * 1000;
      var FETCH_TIMEOUT_MS = 12000;
      var ATTACH_TIMEOUT_MS = 120000;
      var SSE_STALE_MS = 90000;
      var SSE_CONNECT_TIMEOUT_MS = 15000;
      var RECONNECT_BASE_MS = 1500;
      var RECONNECT_MAX_MS = 20000;

      var statusDot = document.getElementById("statusDot");
      var statusText = document.getElementById("statusText");
      var peerText = document.getElementById("peerText");
      var roomInput = document.getElementById("roomInput");
      var nameInput = document.getElementById("nameInput");
      var joinBtn = document.getElementById("joinBtn");
      var leaveBtn = document.getElementById("leaveBtn");
      var shareCard = document.getElementById("shareCard");
      var textInput = document.getElementById("textInput");
      var sendTextBtn = document.getElementById("sendTextBtn");
      var pickFileBtn = document.getElementById("pickFileBtn");
      var fileInput = document.getElementById("fileInput");
      var dropzone = document.getElementById("dropzone");
      var clipList = document.getElementById("clipList");
      var emptyHint = document.getElementById("emptyHint");
      var clearBtn = document.getElementById("clearBtn");
      var toastEl = document.getElementById("toast");
      var lightbox = document.getElementById("lightbox");
      var lightboxTitle = document.getElementById("lightboxTitle");
      var lightboxBody = document.getElementById("lightboxBody");
      var lightboxStage = document.getElementById("lightboxStage");
      var lightboxImg = document.getElementById("lightboxImg");
      var lightboxClose = document.getElementById("lightboxClose");
      var lightboxZoomVal = document.getElementById("lightboxZoomVal");
      var lightboxZoomIn = document.getElementById("lightboxZoomIn");
      var lightboxZoomOut = document.getElementById("lightboxZoomOut");
      var lightboxZoomReset = document.getElementById("lightboxZoomReset");

      var deviceId = loadOrCreateDeviceId();
      var room = "";
      var topic = "";
      var displayName = "";
      var connected = false;
      var eventSource = null;
      var heartbeatTimer = null;
      var pruneTimer = null;
      var reconnectTimer = null;
      var history = [];
      var peers = Object.create(null);
      var seenIds = Object.create(null);
      var toastTimer = null;
      var lastPasteAt = 0;
      var lastSseAt = 0;
      var heartbeatFailCount = 0;
      var reconnectAttempt = 0;
      var sseWatchTimer = null;
      var connectWatchTimer = null;
      var lightboxView = {
        scale: 1,
        x: 0,
        y: 0,
        min: 0.08,
        max: 12,
        dragging: false,
        pinching: false,
        lastX: 0,
        lastY: 0,
        moved: false,
        tapOnMask: false,
        pinchStartDist: 0,
        pinchStartScale: 1,
        pinchWorldX: 0,
        pinchWorldY: 0,
        rafId: 0,
        zoomDirty: false
      };

      roomInput.value = localStorage.getItem(ROOM_KEY) || "";
      nameInput.value = localStorage.getItem(NAME_KEY) || guessDeviceName();

      function guessDeviceName() {
        var ua = navigator.userAgent || "";
        if (/iPhone|iPad|Android/i.test(ua)) return "手机";
        if (/Macintosh/i.test(ua)) return "Mac";
        return "电脑";
      }

      function loadOrCreateDeviceId() {
        var id = localStorage.getItem(DEVICE_KEY);
        if (id) return id;
        id = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem(DEVICE_KEY, id);
        return id;
      }

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("show");
        }, 2200);
      }

      function lightboxTouchDistance(touches) {
        var dx = touches[0].clientX - touches[1].clientX;
        var dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function lightboxTouchCenter(touches) {
        var rect = lightboxBody.getBoundingClientRect();
        var midX = (touches[0].clientX + touches[1].clientX) / 2;
        var midY = (touches[0].clientY + touches[1].clientY) / 2;
        return {
          x: midX - rect.left - rect.width / 2,
          y: midY - rect.top - rect.height / 2
        };
      }

      function beginLightboxPinch(touches) {
        lightboxView.dragging = false;
        lightboxView.pinching = true;
        lightboxView.moved = true;
        lightboxView.tapOnMask = false;
        lightboxView.pinchStartDist = lightboxTouchDistance(touches);
        lightboxView.pinchStartScale = lightboxView.scale;
        var center = lightboxTouchCenter(touches);
        lightboxView.pinchWorldX = (center.x - lightboxView.x) / lightboxView.scale;
        lightboxView.pinchWorldY = (center.y - lightboxView.y) / lightboxView.scale;
      }

      function flushLightboxTransform() {
        lightboxView.rafId = 0;
        lightboxStage.style.transform =
          "translate3d(-50%, -50%, 0) translate3d(" + lightboxView.x + "px," + lightboxView.y + "px,0) scale(" + lightboxView.scale + ")";
        if (lightboxView.zoomDirty) {
          lightboxZoomVal.textContent = Math.round(lightboxView.scale * 100) + "%";
          lightboxView.zoomDirty = false;
        }
      }

      function applyLightboxTransform(updateZoom) {
        if (updateZoom) lightboxView.zoomDirty = true;
        if (lightboxView.rafId) return;
        lightboxView.rafId = requestAnimationFrame(flushLightboxTransform);
      }

      function fitLightboxToView() {
        var w = lightboxImg.naturalWidth;
        var h = lightboxImg.naturalHeight;
        var bw = lightboxBody.clientWidth;
        var bh = lightboxBody.clientHeight;
        if (!w || !h || !bw || !bh) {
          applyLightboxTransform(true);
          return;
        }
        var fit = Math.min(bw / w, bh / h) * 0.98;
        lightboxView.scale = Math.max(lightboxView.min, Math.min(lightboxView.max, fit));
        lightboxView.x = 0;
        lightboxView.y = 0;
        applyLightboxTransform(true);
      }

      function resetLightboxView(fit) {
        lightboxView.scale = 1;
        lightboxView.x = 0;
        lightboxView.y = 0;
        lightboxView.dragging = false;
        lightboxView.pinching = false;
        lightboxView.moved = false;
        lightboxView.tapOnMask = false;
        lightboxBody.classList.remove("is-dragging");
        applyLightboxTransform(true);
        if (fit) {
          requestAnimationFrame(function () {
            fitLightboxToView();
          });
        }
      }

      function zoomLightboxBy(factor, clientX, clientY) {
        var rect = lightboxBody.getBoundingClientRect();
        var cx = (clientX != null ? clientX : rect.left + rect.width / 2) - rect.left - rect.width / 2;
        var cy = (clientY != null ? clientY : rect.top + rect.height / 2) - rect.top - rect.height / 2;
        var next = Math.min(lightboxView.max, Math.max(lightboxView.min, lightboxView.scale * factor));
        if (next === lightboxView.scale) return;
        var worldX = (cx - lightboxView.x) / lightboxView.scale;
        var worldY = (cy - lightboxView.y) / lightboxView.scale;
        lightboxView.scale = next;
        lightboxView.x = cx - worldX * lightboxView.scale;
        lightboxView.y = cy - worldY * lightboxView.scale;
        applyLightboxTransform(true);
      }

      function openLightbox(url, title) {
        if (!url) return;
        lightboxTitle.textContent = title || "预览";
        lightboxImg.alt = title || "预览图";
        lightbox.hidden = false;
        document.body.style.overflow = "hidden";
        resetLightboxView(false);
        lightboxImg.onload = function () {
          fitLightboxToView();
        };
        lightboxImg.src = url;
        if (lightboxImg.complete && lightboxImg.naturalWidth) {
          fitLightboxToView();
        }
      }

      function closeLightbox() {
        lightbox.hidden = true;
        lightboxImg.onload = null;
        lightboxImg.removeAttribute("src");
        lightboxBody.classList.remove("is-dragging");
        lightboxView.dragging = false;
        lightboxView.pinching = false;
        document.body.style.overflow = "";
      }

      function onLightboxWheel(event) {
        if (lightbox.hidden) return;
        event.preventDefault();
        zoomLightboxBy(event.deltaY < 0 ? 1.12 : 1 / 1.12, event.clientX, event.clientY);
      }

      function onLightboxPointerDown(event) {
        if (lightbox.hidden) return;
        if (event.target.closest && event.target.closest(".lightbox-bar")) return;

        if (event.touches && event.touches.length >= 2) {
          event.preventDefault();
          beginLightboxPinch(event.touches);
          return;
        }

        if (event.button != null && event.button !== 0 && !(event.touches && event.touches.length)) return;
        event.preventDefault();
        lightboxView.pinching = false;
        lightboxView.dragging = true;
        lightboxView.moved = false;
        lightboxView.tapOnMask = !(event.target.closest && event.target.closest(".lightbox-stage"));
        lightboxView.lastX = event.clientX;
        lightboxView.lastY = event.clientY;
        if (event.touches && event.touches[0]) {
          lightboxView.lastX = event.touches[0].clientX;
          lightboxView.lastY = event.touches[0].clientY;
        }
        lightboxBody.classList.add("is-dragging");
      }

      function onLightboxPointerMove(event) {
        if (lightbox.hidden) return;

        if (event.touches && event.touches.length >= 2) {
          event.preventDefault();
          if (!lightboxView.pinching) beginLightboxPinch(event.touches);
          if (lightboxView.pinchStartDist < 1) return;
          var nextScale = lightboxView.pinchStartScale * (lightboxTouchDistance(event.touches) / lightboxView.pinchStartDist);
          nextScale = Math.min(lightboxView.max, Math.max(lightboxView.min, nextScale));
          var center = lightboxTouchCenter(event.touches);
          lightboxView.scale = nextScale;
          lightboxView.x = center.x - lightboxView.pinchWorldX * nextScale;
          lightboxView.y = center.y - lightboxView.pinchWorldY * nextScale;
          applyLightboxTransform(true);
          return;
        }

        if (!lightboxView.dragging) return;
        event.preventDefault();
        var clientX = event.clientX;
        var clientY = event.clientY;
        if (event.touches && event.touches[0]) {
          clientX = event.touches[0].clientX;
          clientY = event.touches[0].clientY;
        }
        var dx = clientX - lightboxView.lastX;
        var dy = clientY - lightboxView.lastY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) lightboxView.moved = true;
        lightboxView.x += dx;
        lightboxView.y += dy;
        lightboxView.lastX = clientX;
        lightboxView.lastY = clientY;
        applyLightboxTransform(false);
      }

      function onLightboxPointerUp(event) {
        if (lightbox.hidden) return;

        if (event.touches && event.touches.length === 1 && lightboxView.pinching) {
          lightboxView.pinching = false;
          lightboxView.dragging = true;
          lightboxView.lastX = event.touches[0].clientX;
          lightboxView.lastY = event.touches[0].clientY;
          lightboxBody.classList.add("is-dragging");
          return;
        }

        if (event.touches && event.touches.length > 0) return;

        var moved = lightboxView.moved;
        var tapOnMask = lightboxView.tapOnMask;
        lightboxView.dragging = false;
        lightboxView.pinching = false;
        lightboxView.tapOnMask = false;
        lightboxBody.classList.remove("is-dragging");

        if (!moved && tapOnMask) {
          closeLightbox();
        }
      }

      function setStatus(kind, text) {
        statusDot.className = "dot" + (kind ? " is-" + kind : "");
        statusText.textContent = text;
      }

      function formatBytes(n) {
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      function formatTime(ts) {
        var d = new Date(ts);
        var hh = String(d.getHours()).padStart(2, "0");
        var mm = String(d.getMinutes()).padStart(2, "0");
        var ss = String(d.getSeconds()).padStart(2, "0");
        return hh + ":" + mm + ":" + ss;
      }

      function roomToTopic(roomName) {
        var hash = 5381;
        var i;
        for (i = 0; i < roomName.length; i++) {
          hash = ((hash << 5) + hash) + roomName.charCodeAt(i);
          hash = hash | 0;
        }
        var hex = (hash >>> 0).toString(36);
        var safe = String(roomName).replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 28);
        return ("ptclip" + hex + (safe || "r")).slice(0, 64);
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function pruneSeen() {
        var now = Date.now();
        Object.keys(seenIds).forEach(function (id) {
          if (now - seenIds[id] > SEEN_TTL_MS) delete seenIds[id];
        });
      }

      function markSeen(id) {
        if (!id) return false;
        if (seenIds[id]) return true;
        seenIds[id] = Date.now();
        pruneSeen();
        return false;
      }

      function updatePeerUi() {
        var now = Date.now();
        var names = [];
        Object.keys(peers).forEach(function (id) {
          if (id === deviceId) return;
          if (now - peers[id].at > PEER_TTL_MS) {
            delete peers[id];
            return;
          }
          names.push(peers[id].name || "设备");
        });
        if (!connected) {
          peerText.textContent = "";
          return;
        }
        if (!names.length) {
          peerText.textContent = "在线 1 台 · 仅本机";
          return;
        }
        peerText.textContent = "在线 " + (names.length + 1) + " 台 · " + names.join("、");
      }

      function notePeer(msg) {
        if (!msg || !msg.deviceId || msg.deviceId === deviceId) return;
        peers[msg.deviceId] = {
          name: msg.from || "设备",
          at: Date.now()
        };
        updatePeerUi();
      }

      function renderHistory() {
        clipList.querySelectorAll(".clip").forEach(function (node) {
          node.remove();
        });
        emptyHint.hidden = history.length > 0;
        history.forEach(function (item) {
          var el = document.createElement("div");
          el.className = "clip";
          var meta = document.createElement("div");
          meta.className = "clip-meta";
          meta.innerHTML = "<span>" + escapeHtml(item.from || "未知") + (item.self ? "（本机）" : "") + "</span><span>" + formatTime(item.at) + "</span>";
          el.appendChild(meta);

          if (item.kind === "text") {
            var body = document.createElement("div");
            body.className = "clip-body";
            body.textContent = item.text || "";
            el.appendChild(body);
            var actions = document.createElement("div");
            actions.className = "row-actions";
            var copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "btn";
            copyBtn.textContent = "复制";
            copyBtn.addEventListener("click", function () {
              copyText(item.text || "");
            });
            actions.appendChild(copyBtn);
            el.appendChild(actions);
          } else {
            var fileRow = document.createElement("div");
            fileRow.className = "clip-file";
            var info = document.createElement("div");
            info.textContent = (item.fileName || "文件") + " · " + formatBytes(item.size || 0);
            fileRow.appendChild(info);
            var fileActions = document.createElement("div");
            fileActions.className = "row-actions";
            if (item.url) {
              var openBtn = document.createElement("a");
              openBtn.className = "btn";
              openBtn.href = item.url;
              openBtn.target = "_blank";
              openBtn.rel = "noopener";
              openBtn.textContent = "打开 / 下载";
              fileActions.appendChild(openBtn);
            }
            var isImage = item.mime && item.mime.indexOf("image/") === 0 && item.url;
            if (isImage) {
              var copyImgBtn = document.createElement("button");
              copyImgBtn.type = "button";
              copyImgBtn.className = "btn";
              copyImgBtn.textContent = "复制";
              copyImgBtn.addEventListener("click", function () {
                copyImage(item.url, item.mime);
              });
              fileActions.appendChild(copyImgBtn);
            }
            fileRow.appendChild(fileActions);
            el.appendChild(fileRow);
            if (isImage) {
              var img = document.createElement("img");
              img.className = "clip-thumb";
              img.alt = item.fileName || "图片";
              img.src = item.url;
              img.title = "点击预览";
              img.addEventListener("click", function () {
                openLightbox(item.url, item.fileName || "图片");
              });
              el.appendChild(img);
            }
          }
          clipList.appendChild(el);
        });
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function pushLocal(item) {
        history.unshift(item);
        if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
        renderHistory();
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            toast("已复制");
          }).catch(function () {
            fallbackCopy(text);
          });
          return;
        }
        fallbackCopy(text);
      }

      function blobToPng(blob) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(blob);
          var img = new Image();
          img.onload = function () {
            try {
              var canvas = document.createElement("canvas");
              canvas.width = img.naturalWidth;
              canvas.height = img.naturalHeight;
              canvas.getContext("2d").drawImage(img, 0, 0);
              canvas.toBlob(function (png) {
                URL.revokeObjectURL(url);
                if (png) resolve(png);
                else reject(new Error("toBlob failed"));
              }, "image/png");
            } catch (err) {
              URL.revokeObjectURL(url);
              reject(err);
            }
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("image load failed"));
          };
          img.src = url;
        });
      }

      // 复制图片到系统剪贴板；跨域附件先 fetch，失败再提示
      async function copyImage(url, mime) {
        if (!url) {
          toast("无可复制图片");
          return;
        }
        if (!navigator.clipboard || !window.ClipboardItem) {
          toast("当前浏览器不支持复制图片");
          return;
        }
        try {
          var resp = await fetch(url);
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          var blob = await resp.blob();
          var type = blob.type || mime || "image/png";
          var payload = blob;
          if (type !== "image/png") {
            payload = await blobToPng(blob);
            type = "image/png";
          }
          var data = {};
          data[type] = payload;
          await navigator.clipboard.write([new ClipboardItem(data)]);
          toast("已复制图片");
        } catch (err) {
          console.error("复制图片失败", err);
          toast("复制图片失败，可点打开后另存");
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          toast("已复制");
        } catch (err) {
          toast("复制失败");
        }
        document.body.removeChild(ta);
      }

      function stopChannel() {
        connected = false;
        closeEventSourceQuiet();
        if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }
        if (pruneTimer) {
          clearInterval(pruneTimer);
          pruneTimer = null;
        }
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        if (connectWatchTimer) {
          clearTimeout(connectWatchTimer);
          connectWatchTimer = null;
        }
        heartbeatFailCount = 0;
        reconnectAttempt = 0;
        lastSseAt = 0;
        peers = Object.create(null);
        updatePeerUi();
      }

      function closeEventSourceQuiet() {
        if (!eventSource) return;
        // 先卸掉 onerror，避免主动 close 时再触发一次重连风暴
        eventSource.onerror = null;
        eventSource.onopen = null;
        eventSource.onmessage = null;
        try { eventSource.close(); } catch (e) {}
        eventSource = null;
      }

      function bumpSseAlive() {
        lastSseAt = Date.now();
      }

      function fetchWithTimeout(url, options, timeoutMs) {
        var controller = new AbortController();
        var ms = timeoutMs || FETCH_TIMEOUT_MS;
        var timer = setTimeout(function () {
          controller.abort();
        }, ms);
        var opts = Object.assign({}, options || {}, { signal: controller.signal });
        return fetch(url, opts).then(function (resp) {
          clearTimeout(timer);
          return resp;
        }, function (err) {
          clearTimeout(timer);
          throw err;
        });
      }

      // 空闲断线 / 心跳失败 / 切回前台：强制重连 SSE，不退出房间
      function forceReconnect(reason) {
        if (!topic) return;
        connected = false;
        heartbeatFailCount = 0;
        setStatus("busy", "通道中断，正在重连…");
        closeEventSourceQuiet();
        if (connectWatchTimer) {
          clearTimeout(connectWatchTimer);
          connectWatchTimer = null;
        }
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        scheduleReconnect(reason === "visible" || reason === "online" || reason === "heartbeat" || reason === "send-fail");
      }

      function leaveRoom() {
        stopChannel();
        room = "";
        topic = "";
        shareCard.hidden = true;
        leaveBtn.hidden = true;
        joinBtn.disabled = false;
        roomInput.disabled = false;
        nameInput.disabled = false;
        // 主动离开后不再自动进房；口令仍保留在输入框方便下次点进
        localStorage.setItem(JOINED_KEY, "0");
        setStatus("", "未连接");
        toast("已离开房间");
      }

      async function joinRoom() {
        var nextRoom = (roomInput.value || "").trim();
        var nextName = (nameInput.value || "").trim() || guessDeviceName();
        if (!nextRoom) {
          toast("请填写房间口令");
          roomInput.focus();
          return;
        }
        stopChannel();
        room = nextRoom;
        displayName = nextName;
        topic = roomToTopic(room);
        localStorage.setItem(ROOM_KEY, room);
        localStorage.setItem(NAME_KEY, displayName);
        localStorage.setItem(JOINED_KEY, "1");
        roomInput.disabled = true;
        nameInput.disabled = true;
        joinBtn.disabled = true;
        leaveBtn.hidden = false;
        shareCard.hidden = false;
        setStatus("busy", "正在连接通道…");
        openSse();
      }

      function openSse() {
        if (!topic) return;
        closeEventSourceQuiet();
        // since=当前秒，避免进房刷出旧剪贴板
        var url = NTFY_BASE + "/" + encodeURIComponent(topic) + "/sse?since=" + Math.floor(Date.now() / 1000);
        setStatus("busy", "正在订阅房间…");
        bumpSseAlive();
        try {
          eventSource = new EventSource(url);
        } catch (err) {
          setStatus("err", "订阅失败，将重试");
          scheduleReconnect(false);
          return;
        }

        if (connectWatchTimer) clearTimeout(connectWatchTimer);
        connectWatchTimer = setTimeout(function () {
          connectWatchTimer = null;
          if (!topic) return;
          if (!eventSource || eventSource.readyState !== EventSource.OPEN) {
            forceReconnect("connect-timeout");
          }
        }, SSE_CONNECT_TIMEOUT_MS);

        eventSource.onopen = function () {
          if (connectWatchTimer) {
            clearTimeout(connectWatchTimer);
            connectWatchTimer = null;
          }
          connected = true;
          reconnectAttempt = 0;
          heartbeatFailCount = 0;
          bumpSseAlive();
          setStatus("on", "已连接 · 房间就绪");
          updatePeerUi();
          publishHello();
          if (!heartbeatTimer) {
            heartbeatTimer = setInterval(publishHello, HEARTBEAT_MS);
          }
          if (!pruneTimer) {
            pruneTimer = setInterval(updatePeerUi, 5000);
          }
        };

        // ntfy 命名事件：保活 / 开流也算通道仍活着
        eventSource.addEventListener("keepalive", function () {
          bumpSseAlive();
        });
        eventSource.addEventListener("open", function () {
          bumpSseAlive();
        });

        eventSource.onerror = function () {
          connected = false;
          setStatus("busy", "通道中断，正在重连…");
          closeEventSourceQuiet();
          scheduleReconnect(false);
        };

        eventSource.onmessage = function (ev) {
          bumpSseAlive();
          handleNtfyRaw(ev.data);
        };
      }

      function scheduleReconnect(immediate) {
        if (!topic) return;
        if (reconnectTimer) return;
        var delay = immediate
          ? 400
          : Math.min(RECONNECT_MAX_MS, Math.round(RECONNECT_BASE_MS * Math.pow(1.7, reconnectAttempt)));
        reconnectAttempt += 1;
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          openSse();
        }, delay);
      }

      function handleNtfyRaw(raw) {
        if (!raw) return;
        var envelope;
        try {
          envelope = JSON.parse(raw);
        } catch (err) {
          return;
        }
        // ntfy 保活 / 开流事件无 message
        if (!envelope.message && !envelope.attachment) return;

        var payload = envelope.message ? parseToolPayload(envelope.message) : null;
        // 仅附件、无 message 时无法识别本工具协议，忽略
        if (!payload || payload.v !== 1) return;
        notePeer(payload);

        if (payload.type === "hello") return;

        if (payload.deviceId === deviceId) return;
        if (markSeen(payload.id)) return;

        if (payload.type === "text") {
          pushLocal({
            kind: "text",
            id: payload.id,
            from: payload.from || "对端",
            at: payload.at || Date.now(),
            text: payload.text || "",
            self: false
          });
          toast("收到文字");
          return;
        }

        if (payload.type === "file") {
          var fileUrl = payload.url;
          if (!fileUrl && envelope.attachment && envelope.attachment.url) {
            fileUrl = envelope.attachment.url;
          }
          pushLocal({
            kind: "file",
            id: payload.id,
            from: payload.from || "对端",
            at: payload.at || Date.now(),
            fileName: payload.fileName || (envelope.attachment && envelope.attachment.name) || "文件",
            mime: payload.mime || (envelope.attachment && envelope.attachment.type) || "",
            size: payload.size || (envelope.attachment && envelope.attachment.size) || 0,
            url: fileUrl || "",
            self: false
          });
          toast("收到文件");
        }
      }

      async function publishJson(obj) {
        if (!topic) throw new Error("未进房");
        var body = JSON.stringify(obj);
        var resp = await fetchWithTimeout(NTFY_BASE + "/" + encodeURIComponent(topic), {
          method: "POST",
          headers: {
            "Content-Type": "text/plain; charset=utf-8"
          },
          body: body
        });
        if (!resp.ok) {
          throw new Error("发布失败 HTTP " + resp.status);
        }
      }

      async function publishHello() {
        if (!topic) return;
        try {
          await publishJson({
            v: 1,
            type: "hello",
            id: uid(),
            deviceId: deviceId,
            from: displayName,
            at: Date.now()
          });
          heartbeatFailCount = 0;
        } catch (err) {
          heartbeatFailCount += 1;
          console.warn("心跳失败", err);
          // 连续失败说明 POST 通道或网络已死，主动拆掉僵死 SSE 再连
          if (heartbeatFailCount >= 2) {
            forceReconnect("heartbeat");
          }
        }
      }

      async function sendText(text) {
        var content = String(text || "");
        if (!content.trim()) {
          toast("内容为空");
          return;
        }
        if (!topic) {
          toast("请先进入房间");
          return;
        }

        var id = uid();
        var at = Date.now();
        var meta = {
          v: 1,
          type: "text",
          id: id,
          deviceId: deviceId,
          from: displayName,
          at: at,
          text: content
        };

        setStatus("busy", "正在发送…");
        try {
          if (content.length <= MAX_INLINE_CHARS) {
            await publishJson(meta);
          } else {
            // 超长文字走附件，避免 4KB 消息上限
            var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            var fileMeta = {
              v: 1,
              type: "file",
              id: id,
              deviceId: deviceId,
              from: displayName,
              at: at,
              fileName: "clipboard.txt",
              mime: "text/plain",
              size: blob.size
            };
            await publishAttachment(blob, "clipboard.txt", fileMeta);
            pushLocal({
              kind: "file",
              id: id,
              from: displayName,
              at: at,
              fileName: "clipboard.txt",
              mime: "text/plain",
              size: blob.size,
              url: "",
              self: true
            });
            textInput.value = "";
            setStatus("on", "已连接 · 房间就绪");
            toast("已发送（长文附件）");
            return;
          }
          markSeen(id);
          pushLocal({
            kind: "text",
            id: id,
            from: displayName,
            at: at,
            text: content,
            self: true
          });
          textInput.value = "";
          setStatus("on", "已连接 · 房间就绪");
          toast("已发送");
        } catch (err) {
          console.error("发送文字失败", err);
          setStatus("err", "发送失败，正在重连…");
          toast("发送失败，正在重连");
          forceReconnect("send-fail");
        }
      }

      // fetch 的 header 必须是 ISO-8859-1；中文显示名/文件名只能先 Base64 再放进 Message
      function utf8ToBase64(str) {
        var bytes = new TextEncoder().encode(str);
        var bin = "";
        var i;
        for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }

      function base64ToUtf8(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        var i;
        for (i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      function parseToolPayload(message) {
        if (!message) return null;
        try {
          return JSON.parse(message);
        } catch (err) {
          // 附件通道：Message 头为 UTF-8 JSON 的 Base64
        }
        try {
          return JSON.parse(base64ToUtf8(message));
        } catch (err2) {
          return null;
        }
      }

      async function publishAttachment(blob, fileName, meta) {
        var resp = await fetchWithTimeout(NTFY_BASE + "/" + encodeURIComponent(topic), {
          method: "PUT",
          headers: {
            "Filename": sanitizeFileName(fileName),
            "Message": utf8ToBase64(JSON.stringify(meta)),
            "Content-Type": blob.type || "application/octet-stream"
          },
          body: blob
        }, ATTACH_TIMEOUT_MS);
        if (!resp.ok) {
          throw new Error("附件发布失败 HTTP " + resp.status);
        }
        var published = null;
        try {
          published = await resp.json();
        } catch (e) {}
        return published;
      }

      // Filename 头只能 ASCII；真实中文名放在 meta.fileName（经 Message Base64 传递）
      function sanitizeFileName(name) {
        var ascii = String(name || "file")
          .replace(/[^\x20-\x7E]/g, "_")
          .replace(/["\\]/g, "_")
          .trim();
        if (!ascii || /^\.+$/.test(ascii)) ascii = "file.bin";
        return ascii.slice(0, 120);
      }

      async function sendFiles(fileList) {
        var files = Array.prototype.slice.call(fileList || []);
        if (!files.length) return;
        if (!topic) {
          toast("请先进入房间");
          return;
        }

        var i;
        for (i = 0; i < files.length; i++) {
          var file = files[i];
          if (file.size > MAX_FILE_BYTES) {
            toast(file.name + " 超过 15MB，已跳过");
            continue;
          }
          var id = uid();
          var at = Date.now();
          var meta = {
            v: 1,
            type: "file",
            id: id,
            deviceId: deviceId,
            from: displayName,
            at: at,
            fileName: file.name,
            mime: file.type || "application/octet-stream",
            size: file.size
          };
          setStatus("busy", "正在发送 " + file.name + "…");
          try {
            var published = await publishAttachment(file, file.name, meta);
            var url = "";
            if (published && published.attachment && published.attachment.url) {
              url = published.attachment.url;
            }
            markSeen(id);
            pushLocal({
              kind: "file",
              id: id,
              from: displayName,
              at: at,
              fileName: file.name,
              mime: file.type || "",
              size: file.size,
              url: url,
              self: true
            });
            toast("已发送 " + file.name);
          } catch (err) {
            console.error("发送文件失败", err);
            toast("发送失败：" + file.name);
            forceReconnect("send-fail");
          }
        }
        setStatus(connected ? "on" : "busy", connected ? "已连接 · 房间就绪" : "通道中断，正在重连…");
      }

      joinBtn.addEventListener("click", function () {
        joinRoom();
      });
      leaveBtn.addEventListener("click", leaveRoom);
      sendTextBtn.addEventListener("click", function () {
        sendText(textInput.value);
      });
      pickFileBtn.addEventListener("click", function () {
        fileInput.click();
      });
      fileInput.addEventListener("change", function () {
        sendFiles(fileInput.files);
        fileInput.value = "";
      });
      clearBtn.addEventListener("click", function () {
        history = [];
        renderHistory();
        toast("已清空");
      });

      lightboxClose.addEventListener("click", function (ev) {
        ev.stopPropagation();
        closeLightbox();
      });
      lightboxZoomIn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        zoomLightboxBy(1.2);
      });
      lightboxZoomOut.addEventListener("click", function (ev) {
        ev.stopPropagation();
        zoomLightboxBy(1 / 1.2);
      });
      lightboxZoomReset.addEventListener("click", function (ev) {
        ev.stopPropagation();
        fitLightboxToView();
      });
      lightboxBody.addEventListener("wheel", onLightboxWheel, { passive: false });
      lightboxBody.addEventListener("mousedown", onLightboxPointerDown);
      window.addEventListener("mousemove", onLightboxPointerMove);
      window.addEventListener("mouseup", onLightboxPointerUp);
      lightboxBody.addEventListener("touchstart", onLightboxPointerDown, { passive: false });
      lightboxBody.addEventListener("touchmove", onLightboxPointerMove, { passive: false });
      lightboxBody.addEventListener("touchend", onLightboxPointerUp);
      lightboxBody.addEventListener("touchcancel", onLightboxPointerUp);
      lightbox.addEventListener("click", function (ev) {
        if (ev.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && !lightbox.hidden) closeLightbox();
      });

      roomInput.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") joinRoom();
      });
      nameInput.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") joinRoom();
      });

      ;["dragenter", "dragover"].forEach(function (type) {
        dropzone.addEventListener(type, function (ev) {
          ev.preventDefault();
          dropzone.classList.add("is-drag");
        });
      });
      ;["dragleave", "drop"].forEach(function (type) {
        dropzone.addEventListener(type, function (ev) {
          ev.preventDefault();
          dropzone.classList.remove("is-drag");
        });
      });
      dropzone.addEventListener("drop", function (ev) {
        if (ev.dataTransfer && ev.dataTransfer.files) {
          sendFiles(ev.dataTransfer.files);
        }
      });

      document.addEventListener("paste", function (ev) {
        if (!topic) return;
        var now = Date.now();
        if (now - lastPasteAt < 400) return;
        lastPasteAt = now;

        var items = ev.clipboardData && ev.clipboardData.items;
        var files = [];
        if (items) {
          var i;
          for (i = 0; i < items.length; i++) {
            if (items[i].kind === "file") {
              var f = items[i].getAsFile();
              if (f) files.push(f);
            }
          }
        }
        if (files.length) {
          ev.preventDefault();
          sendFiles(files);
          return;
        }
        // 输入框内粘贴留给用户编辑；页面其它区域粘贴直接发送
        if (document.activeElement === textInput || document.activeElement === roomInput || document.activeElement === nameInput) {
          return;
        }
        var text = ev.clipboardData && ev.clipboardData.getData("text/plain");
        if (text) {
          ev.preventDefault();
          sendText(text);
        }
      });

      window.addEventListener("beforeunload", function () {
        stopChannel();
      });

      // 切回标签页 / 网络恢复：立刻探测并重连，避免久挂假在线
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || !topic) return;
        if (!eventSource || eventSource.readyState !== EventSource.OPEN || !connected) {
          forceReconnect("visible");
        } else {
          publishHello();
        }
      });
      window.addEventListener("online", function () {
        if (topic) forceReconnect("online");
      });

      // SSE 僵死检测：长时间无 keepalive / 消息则强制重连
      if (!sseWatchTimer) {
        sseWatchTimer = setInterval(function () {
          if (!topic) return;
          if (eventSource && eventSource.readyState === EventSource.CLOSED) {
            forceReconnect("sse-closed");
            return;
          }
          if (lastSseAt && Date.now() - lastSseAt > SSE_STALE_MS) {
            forceReconnect("sse-stale");
          }
        }, 10000);
      }

      renderHistory();
      // 上次已进房且口令仍在：打开页面自动重连，免得点「进入房间」
      if ((roomInput.value || "").trim() && localStorage.getItem(JOINED_KEY) !== "0") {
        joinRoom();
      } else {
        setStatus("", "未连接");
      }
    })();
  </script>
</body>
</html>
