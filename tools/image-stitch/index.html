<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="图片拼接" />
  <title>图片拼接助手</title>
  <style>
    :root {
      --bg0: #e8eef5;
      --bg1: #f5f7fb;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(148, 163, 184, 0.38);
      --accent: #0f766e;
      --accent-hover: #0d9488;
      --accent-soft: #ccfbf1;
      --danger: #b91c1c;
      --ok: #047857;
      --radius: 18px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 14px 36px rgba(15, 23, 42, 0.07);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --dock-h: 68px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      background:
        radial-gradient(900px 480px at 0% -5%, rgba(15, 118, 110, 0.12), transparent 55%),
        radial-gradient(800px 420px at 100% 0%, rgba(14, 165, 233, 0.1), transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }

    button, input, select { font: inherit; }

    .app {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 16px calc(var(--dock-h) + 28px);
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .back-link:hover { color: var(--accent); border-color: rgba(13, 148, 136, 0.35); }

    header.top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 18px 20px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    header.top h1 {
      margin: 0 0 6px;
      font-size: clamp(1.3rem, 3vw, 1.55rem);
      font-weight: 760;
      letter-spacing: -0.02em;
    }

    header.top .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 650;
      line-height: 1.2;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
    }

    .btn:hover { border-color: #94a3b8; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(180deg, #14b8a6, var(--accent));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 6px 16px rgba(15, 118, 110, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(180deg, #2dd4bf, var(--accent-hover));
    }

    .btn-ghost { background: rgba(255, 255, 255, 0.85); }
    .btn-danger { color: var(--danger); border-color: #fecaca; background: #fff5f5; }
    .btn-sm { padding: 6px 10px; font-size: 0.88rem; }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 6px;
    }

    .panel-title .step {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .panel h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    .hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .dropzone {
      border: 1.5px dashed #94a3b8;
      border-radius: 16px;
      padding: 32px 16px;
      text-align: center;
      background:
        linear-gradient(180deg, #f8fafc, #f1f5f9);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      cursor: pointer;
      user-select: none;
    }

    .dropzone .dz-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--accent);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    .dropzone .dz-icon svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dropzone .dz-title {
      font-weight: 700;
      font-size: 0.98rem;
      margin-bottom: 4px;
    }

    .dropzone.is-drag {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(13, 148, 136, 0.25);
    }

    .dropzone strong { color: var(--accent); }

    .settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .field input[type="number"],
    .field input[type="color"],
    .field select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      background: #fff;
      color: var(--text);
    }

    .field input[type="color"] {
      padding: 4px;
      height: 40px;
    }

    .thumbs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .thumb {
      display: grid;
      grid-template-columns: 148px 1fr auto;
      gap: 12px 14px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .thumb.is-dragging { opacity: 0.55; }

    .thumb-preview {
      width: 148px;
      height: 110px;
      border-radius: 10px;
      object-fit: cover;
      background: #e2e8f0;
      display: block;
      cursor: zoom-in;
      border: 1px solid var(--border);
    }

    .thumb-preview:hover {
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.35);
    }

    .thumb-meta {
      min-width: 0;
      font-size: 0.9rem;
    }

    .thumb-meta .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700;
    }

    .thumb-meta .size { color: var(--muted); margin-top: 4px; font-size: 0.84rem; }

    .thumb-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 72px;
    }

    .thumb-actions button {
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 10px;
      min-height: 40px;
      width: 100%;
      cursor: pointer;
      padding: 8px 12px;
      line-height: 1.2;
      color: #334155;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .thumb-actions button:hover:not(:disabled) {
      border-color: #94a3b8;
      background: #fff;
    }

    .thumb-actions button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .thumb-actions button.is-danger {
      color: var(--danger);
      border-color: #fecaca;
      background: #fff5f5;
    }

    .thumb-actions button.is-danger:hover:not(:disabled) {
      background: #fee2e2;
    }

    .preview-wrap {
      overflow: auto;
      max-height: min(52vh, 560px);
      border: 1px solid var(--border);
      border-radius: 14px;
      background:
        linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
      background-color: #f8fafc;
      padding: 16px;
      text-align: center;
    }

    .preview-wrap canvas {
      max-width: 100%;
      height: auto;
      vertical-align: middle;
      background: transparent;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      cursor: zoom-in;
    }

    .preview-empty {
      color: var(--muted);
      padding: 48px 12px;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 12px;
      display: inline-block;
    }

    .preview-empty[hidden] {
      display: none !important;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background: rgba(15, 23, 42, 0.55);
      touch-action: none;
    }

    .lightbox[hidden] {
      display: none !important;
    }

    .lightbox-panel {
      width: 100%;
      height: 100%;
      max-height: none;
      display: flex;
      flex-direction: column;
      background: transparent;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
    }

    .lightbox-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(30, 41, 59, 0.96);
      color: #e2e8f0;
      font-size: 0.92rem;
      font-weight: 650;
      flex-shrink: 0;
    }

    .lightbox-bar .title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .lightbox-bar .bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .lightbox-bar .zoom-val {
      font-variant-numeric: tabular-nums;
      min-width: 3.2em;
      text-align: right;
      color: #cbd5e1;
      font-size: 0.84rem;
    }

    .lightbox-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      padding: 0;
      text-align: center;
      cursor: grab;
      touch-action: none;
      user-select: none;
      background: transparent;
    }

    .lightbox-body.is-dragging {
      cursor: grabbing;
    }

    .lightbox-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0) scale(1);
      transform-origin: center center;
      will-change: transform;
      line-height: 0;
      backface-visibility: hidden;
    }

    .lightbox-stage img,
    .lightbox-stage canvas {
      display: block;
      max-width: none;
      max-height: none;
      width: auto;
      height: auto;
      border-radius: 4px;
      background: transparent;
      pointer-events: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      /* 减轻超大图合成开销 */
      image-rendering: auto;
    }

    .lightbox-body.is-dragging .lightbox-stage img,
    .lightbox-body.is-dragging .lightbox-stage canvas {
      box-shadow: none;
    }

    /* 避免 display:block 盖过 hidden，露出空白 canvas 白块 */
    .lightbox-stage img[hidden],
    .lightbox-stage canvas[hidden] {
      display: none !important;
    }

    /* —— 标注编辑态 —— */
    body.is-edit {
      overflow: hidden;
      overscroll-behavior: none;
    }
    body.is-edit .compose-only { display: none !important; }
    body:not(.is-edit) .edit-only { display: none !important; }

    .edit-stage {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      overscroll-behavior: none;
      background: #64748b;
      margin: 0;
      touch-action: none;
    }

    .edit-viewport {
      position: absolute;
      top: max(56px, calc(44px + env(safe-area-inset-top)));
      left: 0;
      right: 0;
      bottom: max(88px, calc(72px + env(safe-area-inset-bottom)));
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .edit-viewport.is-panning { cursor: grabbing; }

    .edit-world {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0) scale(1);
      transform-origin: center center;
      will-change: transform;
      line-height: 0;
      backface-visibility: hidden;
    }

    .edit-frame {
      position: relative;
      display: block;
      width: fit-content;
      max-width: none;
      margin: 0;
      line-height: 0;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
      background: #fff;
    }

    .edit-frame canvas {
      display: block;
      max-width: none;
      width: auto;
      height: auto;
      cursor: crosshair;
      touch-action: none;
    }

    .edit-frame[data-tool="pan"] canvas {
      cursor: grab;
    }

    .edit-viewport.is-panning .edit-frame[data-tool="pan"] canvas,
    .edit-frame[data-tool="pan"] canvas:active { cursor: grabbing; }

    .edit-frame[data-tool="select"] canvas {
      cursor: default;
      touch-action: none;
    }

    .edit-frame[data-tool="text"] canvas { cursor: text; }

    .size-badge {
      position: fixed;
      left: 12px;
      top: max(12px, env(safe-area-inset-top));
      z-index: 41;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      line-height: 1.4;
      pointer-events: none;
    }

    .beautify-bar {
      position: fixed;
      left: 50%;
      top: max(10px, env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 41;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: var(--shadow);
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    .beautify-bar label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .beautify-bar input[type="range"] { width: 90px; vertical-align: middle; }

    .text-input-pop {
      position: fixed;
      z-index: 45;
      min-width: 160px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 16px;
      outline: none;
      background: rgba(255, 255, 255, 0.95);
    }

    .edit-toolbar {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 16px);
      background: #fff;
      border-radius: 999px;
      padding: 8px 10px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.18);
      border: 1px solid #e5e7eb;
    }

    .edit-toolbar .tb {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .edit-toolbar .tb:hover { background: #f1f5f9; }
    .edit-toolbar .tb.is-active { background: var(--accent-soft); color: var(--accent); }
    .edit-toolbar .tb:disabled { opacity: 0.35; cursor: not-allowed; }
    .edit-toolbar .sep {
      width: 1px;
      height: 22px;
      background: #e5e7eb;
      margin: 0 4px;
    }

    .edit-toolbar .tb-ok { color: var(--ok); }
    .edit-toolbar .tb-cancel { color: var(--danger); }

    .edit-toolbar svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
    }

    .color-row input[type="color"] {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }

    .stroke-select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      background: #fff;
    }

    .compose-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    .compose-dock .btn { flex: 1; max-width: 200px; justify-content: center; }

    .preview-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .preview-head .panel-title { margin-bottom: 4px; }

    .preview-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--dock-h) + 18px);
      transform: translateX(-50%) translateY(12px);
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 60;
      max-width: min(90vw, 360px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    body.is-edit .compose-dock,
    body.is-edit .toast { bottom: 88px; }

    @media (max-width: 640px) {
      header.top { padding: 14px 14px; }
      header.top h1 { font-size: 1.22rem; }
      .thumb {
        grid-template-columns: 120px 1fr auto;
      }
      .thumb-preview {
        width: 120px;
        height: 90px;
      }
      .thumb-actions {
        min-width: 64px;
      }
      .thumb-actions button {
        min-height: 38px;
        padding: 6px 10px;
        font-size: 0.86rem;
      }
      .preview-actions { width: 100%; }
      .preview-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <a class="back-link compose-only" href="../../">← 返回工具箱</a>

    <header class="top compose-only">
      <div>
        <h1>图片拼接助手</h1>
        <p class="sub">批量上传 / 拖拽 / Ctrl+V · 拼接后可标注 · 纯本地离线</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost" id="btnClearAll">清空</button>
      </div>
    </header>

    <section class="panel compose-only" id="uploadPanel">
      <div class="panel-title">
        <span class="step">1</span>
        <h2>添加图片</h2>
      </div>
      <p class="hint">支持多选本地文件、拖入本页，或复制图片后 Ctrl+V 粘贴（手机可用相册多选）。</p>
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入图片">
        <div class="dz-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 16V5"/><path d="M8 9l4-4 4 4"/><path d="M4 19h16"/></svg>
        </div>
        <div class="dz-title">点击选择，或把图片拖到这里</div>
        <div style="margin-top:4px;font-size:0.86rem;color:var(--muted)">也可 <strong>Ctrl+V</strong> 粘贴剪贴板图片</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />

      <div class="settings">
        <div class="field">
          <label for="direction">拼接方向</label>
          <select id="direction">
            <option value="vertical">纵向（长图）</option>
            <option value="horizontal">横向（宽图）</option>
          </select>
        </div>
        <div class="field">
          <label for="scaleMode">对齐缩放</label>
          <select id="scaleMode">
            <option value="max" selected>按最长边对齐（放大）</option>
            <option value="min">按最短边对齐（缩小）</option>
            <option value="none">保持原尺寸</option>
