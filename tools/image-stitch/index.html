    btnUndo: document.getElementById("btnUndo"),
    btnRedo: document.getElementById("btnRedo"),
    btnDeleteShape: document.getElementById("btnDeleteShape")
  };

  function uid() {
    return "img_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  /** 第二个参数为 true 时用橙色提醒样式并多停留一会儿；鼠标停在提示上时不消失 */
  function showToast(message, isWarn) {
    const warn = Boolean(isWarn);
    els.toastText.textContent = message;
    els.toastIcon.textContent = warn ? "!" : "✓";
    els.toast.classList.toggle("is-warn", warn);
    els.toast.classList.add("show");
    toastState.duration = warn ? TOAST_WARN_MS : TOAST_MS;
    scheduleToastHide();
  }

  function scheduleToastHide() {
    clearTimeout(toastState.timer);
    toastState.timer = setTimeout(() => {
      if (!toastState.hovering) els.toast.classList.remove("show");
    }, toastState.duration);
  }

  function releaseImage(item) {
    if (!item) return;
    if (item.bitmap && item.bitmap.close) item.bitmap.close();
    if (item.url) URL.revokeObjectURL(item.url);
    item.url = "";
  }

  function loadBitmapFromBlob(blob, name) {
    return createImageBitmap(blob).then((bitmap) => ({
      id: uid(),
      name: name || "image",
      bitmap,
      width: bitmap.width,
      height: bitmap.height,
      url: URL.createObjectURL(blob)
    }));
  }

  /**
   * 追加图片：非图片文件跳过，单张解码失败不影响其他张，按选择顺序排在已有图片后面。
   * 提示里写清加了几张、一共几张、跳过或失败了几个。
   */
  function addFiles(fileList, verb) {
    const all = Array.from(fileList || []);
    const files = all.filter((file) => file && file.type && file.type.indexOf("image/") === 0);
    const skipped = all.length - files.length;
    if (!files.length) {
      showToast(all.length ? "选中的不是图片：支持 PNG、JPG、WebP、GIF 等图片格式" : "没有读到图片", true);
      return;
    }
    Promise.allSettled(files.map((file) => loadBitmapFromBlob(file, file.name))).then((results) => {
      const loaded = [];
      results.forEach((result, index) => {
        if (result.status === "fulfilled") loaded.push(result.value);
        else console.error("图片解码失败", files[index].name, result.reason);
      });
      const failed = results.length - loaded.length;
      images = images.concat(loaded);
      renderThumbs();
      schedulePreview();
      const parts = [];
      if (loaded.length) parts.push((verb || "已添加") + " " + loaded.length + " 张，共 " + images.length + " 张");
      if (failed) parts.push(failed + " 张读不出来（文件可能损坏或格式不支持）");
      if (skipped) parts.push(skipped + " 个不是图片，已跳过");
      showToast(parts.join("；"), failed > 0 || skipped > 0);
    });
  }

  /** 粘贴里有图片就整批添加并返回 true；只有文字时返回 false，交给调用方决定是否提示 */
  function addClipboardItems(clipboardData) {
    if (!clipboardData) return false;
    const fromItems = Array.from(clipboardData.items || [])
      .filter((entry) => entry.kind === "file" && entry.type.indexOf("image/") === 0)
      .map((entry) => entry.getAsFile())
      .filter(Boolean);
    const files = fromItems.length ? fromItems : Array.from(clipboardData.files || []);
    if (!files.length) return false;
    addFiles(files, "已粘贴");
    return true;
  }

  /** 每行显示原尺寸；按当前对齐方式会被缩放时，再标出拼接后的尺寸和比例（放大用橙色提醒可能变糊） */
  function renderThumbs() {
    const sizes = computeScaledSizes(getSettings());
    const fragment = document.createDocumentFragment();
    images.forEach((item, index) => {
      const scaled = sizes[index];
      const ratio = Math.round((scaled.w / item.width) * 100);
      const row = document.createElement("div");
      row.className = "thumb";
      row.draggable = true;
      row.dataset.id = item.id;
      row.innerHTML =
        '<div class="thumb-index" title="按住拖动调整顺序"><span class="grip" aria-hidden="true">⋮⋮</span><span class="num">' + (index + 1) + "</span></div>" +
        '<img class="thumb-preview" draggable="false" title="点击看大图" />' +
        '<div class="thumb-meta"><div class="name"></div><div class="size">' + item.width + " × " + item.height +
        (ratio === 100 ? "" : '<span class="scaled' + (ratio > 100 ? " is-up" : "") + '"> → ' + scaled.w + " × " + scaled.h + "（" + (ratio > 100 ? "放大" : "缩小") + "到 " + ratio + "%）</span>") +
        "</div></div>" +
        '<div class="thumb-actions">' +
        '<button type="button" class="btn btn-sm btn-step" data-act="up" title="往前挪一位" aria-label="上移"' + (index === 0 ? " disabled" : "") + ">↑</button>" +
        '<button type="button" class="btn btn-sm btn-step" data-act="down" title="往后挪一位" aria-label="下移"' + (index === images.length - 1 ? " disabled" : "") + ">↓</button>" +
        '<button type="button" class="btn btn-sm btn-text-danger" data-act="del" title="从拼接里去掉这张，不影响原文件">移除</button>' +
        "</div>";
      const img = row.querySelector(".thumb-preview");
      img.src = item.url;
      img.alt = item.name;
      const name = row.querySelector(".name");
      name.textContent = item.name;
      name.title = item.name;

      img.addEventListener("click", (event) => {
        event.stopPropagation();
        const title = item.name + "（" + item.width + " × " + item.height + "）";
        if (item.bitmap) openLightboxBitmap(item.bitmap, item.width, item.height, title);
        else openLightboxUrl(item.url, title);
      });
      row.querySelector(".thumb-actions").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        event.stopPropagation();
        const act = button.dataset.act;
        if (act === "up") moveItem(index, index - 1);
        else if (act === "down") moveItem(index, index + 1);
        else if (act === "del") removeItem(index);
      });

      // 只认本列表内发起的拖动；拖入文件交给整页的投放处理
      row.addEventListener("dragstart", (event) => {
        if (event.target.closest && event.target.closest("button")) {
          event.preventDefault();
          return;
        }
        thumbDragIndex = index;
        row.classList.add("is-dragging");
        event.dataTransfer.setData("text/plain", item.name);
        event.dataTransfer.effectAllowed = "move";
      });
      row.addEventListener("dragend", () => {
        thumbDragIndex = -1;
        row.classList.remove("is-dragging");
        els.thumbList.querySelectorAll(".is-drop-target").forEach((target) => target.classList.remove("is-drop-target"));
      });
      row.addEventListener("dragover", (event) => {
        if (thumbDragIndex < 0) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        if (thumbDragIndex !== index) row.classList.add("is-drop-target");
      });
      row.addEventListener("dragleave", (event) => {
        if (!row.contains(event.relatedTarget)) row.classList.remove("is-drop-target");
      });
      row.addEventListener("drop", (event) => {
        if (thumbDragIndex < 0) return;
        event.preventDefault();
        row.classList.remove("is-drop-target");
        moveItem(thumbDragIndex, index);
      });
      fragment.appendChild(row);
    });
    els.thumbList.replaceChildren(fragment);
    els.thumbsHead.hidden = images.length < 2;
    els.imageCount.textContent = images.length ? "已添加 " + images.length + " 张" : "";
    els.btnClearAll.disabled = !images.length;
    els.btnEnterEdit.disabled = !images.length;
    els.btnCopyStitchDock.disabled = !images.length;
    els.btnDownloadStitchDock.disabled = !images.length;
  }

  var lightboxView = {
    scale: 1,
    x: 0,
    y: 0,
    min: 0.08,
    max: 12,
    dragging: false,
    pinching: false,
    lastX: 0,
    lastY: 0,
    moved: false,
    tapOnMask: false,
    pinchStartDist: 0,
    pinchStartScale: 1,
    pinchWorldX: 0,
    pinchWorldY: 0,
    rafId: 0,
    zoomDirty: false,
    objectUrl: ""
  };

  function lightboxTouchDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function lightboxTouchCenter(touches) {
    var body = els.lightboxBody;
    var rect = body.getBoundingClientRect();
    var midX = (touches[0].clientX + touches[1].clientX) / 2;
    var midY = (touches[0].clientY + touches[1].clientY) / 2;
    return {
      x: midX - rect.left - rect.width / 2,
      y: midY - rect.top - rect.height / 2
    };
  }

  function beginLightboxPinch(touches) {
    lightboxView.dragging = false;
    lightboxView.pinching = true;
    lightboxView.moved = true;
    lightboxView.tapOnMask = false;
    lightboxView.pinchStartDist = lightboxTouchDistance(touches);
    lightboxView.pinchStartScale = lightboxView.scale;
    var center = lightboxTouchCenter(touches);
    lightboxView.pinchWorldX = (center.x - lightboxView.x) / lightboxView.scale;
    lightboxView.pinchWorldY = (center.y - lightboxView.y) / lightboxView.scale;
  }

  /** 灯箱显示用最长边上限：约 2×屏宽×dpr，封顶 2560，避免拖拽全分辨率大图 */
  function getLightboxDisplayMaxEdge() {
    var dpr = window.devicePixelRatio || 1;
    var edge = Math.max(window.innerWidth || 0, window.innerHeight || 0) * dpr * 2;
    if (!edge || edge < 1280) edge = 1600;
    return Math.min(Math.round(edge), 2560);
  }

  function revokeLightboxObjectUrl() {
    if (lightboxView.objectUrl) {
      URL.revokeObjectURL(lightboxView.objectUrl);
      lightboxView.objectUrl = "";
    }
  }

  function flushLightboxTransform() {
    lightboxView.rafId = 0;
    if (!els.lightboxStage) return;
    // translate3d 便于走 GPU 合成层
    els.lightboxStage.style.transform =
      "translate3d(-50%, -50%, 0) translate3d(" + lightboxView.x + "px," + lightboxView.y + "px,0) scale(" + lightboxView.scale + ")";
    if (lightboxView.zoomDirty && els.lightboxZoomVal) {
      els.lightboxZoomVal.textContent = Math.round(lightboxView.scale * 100) + "%";
      lightboxView.zoomDirty = false;
    }
  }

  function applyLightboxTransform(updateZoom) {
    if (updateZoom) lightboxView.zoomDirty = true;
    if (lightboxView.rafId) return;
    lightboxView.rafId = requestAnimationFrame(flushLightboxTransform);
  }

  function resetLightboxView(fit) {
    lightboxView.scale = 1;
    lightboxView.x = 0;
    lightboxView.y = 0;
    lightboxView.dragging = false;
    lightboxView.pinching = false;
    lightboxView.moved = false;
    lightboxView.tapOnMask = false;
    if (els.lightboxBody) els.lightboxBody.classList.remove("is-dragging");
    applyLightboxTransform(true);
    if (fit) {
      requestAnimationFrame(function () {
        fitLightboxToView();
      });
    }
  }

  function getLightboxMediaSize() {
    if (els.lightboxImg && !els.lightboxImg.hidden && els.lightboxImg.naturalWidth) {
      return { w: els.lightboxImg.naturalWidth, h: els.lightboxImg.naturalHeight };
    }
    if (els.lightboxCanvas && !els.lightboxCanvas.hidden) {
      return { w: els.lightboxCanvas.width, h: els.lightboxCanvas.height };
    }
    return null;
  }

  function fitLightboxToView() {
    var size = getLightboxMediaSize();
    var body = els.lightboxBody;
    if (!size || !body || size.w < 1 || size.h < 1) {
      applyLightboxTransform(true);
      return;
    }
    var bw = body.clientWidth;
    var bh = body.clientHeight;
    if (bw < 1 || bh < 1) {
      applyLightboxTransform(true);
      return;
    }
    var fit = Math.min(bw / size.w, bh / size.h) * 0.98;
    lightboxView.scale = Math.max(lightboxView.min, Math.min(lightboxView.max, fit));
    lightboxView.x = 0;
    lightboxView.y = 0;
    applyLightboxTransform(true);
  }

  function openLightboxUrl(url, title) {
    els.lightboxTitle.textContent = title || "预览";
    els.lightboxCanvas.hidden = true;
    els.lightboxCanvas.width = 0;
    els.lightboxCanvas.height = 0;
    els.lightboxImg.hidden = false;
    els.lightbox.hidden = false;
    resetLightboxView(false);
    els.lightboxImg.onload = function () {
      fitLightboxToView();
    };
    els.lightboxImg.src = url;
    if (els.lightboxImg.complete && els.lightboxImg.naturalWidth) {
      fitLightboxToView();
    }
  }

  function openLightboxOwnedUrl(url, title) {
    revokeLightboxObjectUrl();
    if (url && String(url).indexOf("blob:") === 0) lightboxView.objectUrl = url;
    openLightboxUrl(url, title);
  }

  /** 超大图先缩到显示上限再预览，拖拽/捏合更顺 */
  function openLightboxBitmap(bitmap, width, height, title) {
    if (!bitmap) return;
    var maxEdge = getLightboxDisplayMaxEdge();
    var scale = Math.min(1, maxEdge / Math.max(width, height));
    var dw = Math.max(1, Math.round(width * scale));
    var dh = Math.max(1, Math.round(height * scale));
    var canvas = document.createElement("canvas");
    canvas.width = dw;
    canvas.height = dh;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, dw, dh);
    openLightboxFromDisplayCanvas(canvas, title);
  }

  function openLightboxFromDisplayCanvas(sourceCanvas, title) {
    if (!sourceCanvas) return;
    // 用 JPEG blob + img：合成层比巨大 canvas 拖拽更轻
    var finishWithUrl = function (url) {
      openLightboxOwnedUrl(url, title);
    };
    if (sourceCanvas.toBlob) {
      sourceCanvas.toBlob(function (blob) {
        if (!blob) {
          openLightboxCanvasFallback(sourceCanvas, title);
          return;
        }
        finishWithUrl(URL.createObjectURL(blob));
      }, "image/jpeg", 0.92);
      return;
    }
    try {
      finishWithUrl(sourceCanvas.toDataURL("image/jpeg", 0.92));
    } catch (ex) {
      openLightboxCanvasFallback(sourceCanvas, title);
    }
  }

  function openLightboxCanvasFallback(sourceCanvas, title) {
    revokeLightboxObjectUrl();
    els.lightboxTitle.textContent = title || "拼接预览";
    els.lightboxImg.hidden = true;
    els.lightboxImg.removeAttribute("src");
    var canvas = els.lightboxCanvas;
    canvas.hidden = false;
    canvas.width = sourceCanvas.width;
    canvas.height = sourceCanvas.height;
    canvas.getContext("2d").drawImage(sourceCanvas, 0, 0);
    els.lightbox.hidden = false;
    resetLightboxView(true);
  }

  function openLightboxCanvas(sourceCanvas, title) {
    if (!sourceCanvas) return;
    var maxEdge = getLightboxDisplayMaxEdge();
    var scale = Math.min(1, maxEdge / Math.max(sourceCanvas.width, sourceCanvas.height));
    if (scale >= 0.98) {
      openLightboxFromDisplayCanvas(sourceCanvas, title);
      return;
    }
    var canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(sourceCanvas.width * scale));
    canvas.height = Math.max(1, Math.round(sourceCanvas.height * scale));
    canvas.getContext("2d").drawImage(sourceCanvas, 0, 0, canvas.width, canvas.height);
    openLightboxFromDisplayCanvas(canvas, title);
  }

  function swallowNextClick() {
    // 触摸关闭后浏览器可能向遮罩下方派发合成 click，吞掉一次避免误触列表
    var swallow = function (event) {
      event.preventDefault();
      event.stopPropagation();
      document.removeEventListener("click", swallow, true);
    };
    document.addEventListener("click", swallow, true);
    setTimeout(function () {
      document.removeEventListener("click", swallow, true);
    }, 450);
  }

  function closeLightbox() {
    if (lightboxView.rafId) {
      cancelAnimationFrame(lightboxView.rafId);
      lightboxView.rafId = 0;
    }
    els.lightbox.hidden = true;
    els.lightboxImg.hidden = true;
    els.lightboxImg.removeAttribute("src");
    els.lightboxImg.onload = null;
    els.lightboxCanvas.hidden = true;
    els.lightboxCanvas.width = 0;
    els.lightboxCanvas.height = 0;
    revokeLightboxObjectUrl();
    lightboxView.dragging = false;
    lightboxView.pinching = false;
    lightboxView.tapOnMask = false;
    if (els.lightboxBody) els.lightboxBody.classList.remove("is-dragging");
  }

  function onLightboxWheel(event) {
    if (els.lightbox.hidden) return;
    event.preventDefault();
    var body = els.lightboxBody;
    var rect = body.getBoundingClientRect();
    var cx = event.clientX - rect.left - rect.width / 2;
    var cy = event.clientY - rect.top - rect.height / 2;
    var factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
    var next = Math.min(lightboxView.max, Math.max(lightboxView.min, lightboxView.scale * factor));
    if (next === lightboxView.scale) return;
    var worldX = (cx - lightboxView.x) / lightboxView.scale;
    var worldY = (cy - lightboxView.y) / lightboxView.scale;
    lightboxView.scale = next;
    lightboxView.x = cx - worldX * lightboxView.scale;
    lightboxView.y = cy - worldY * lightboxView.scale;
    applyLightboxTransform(true);
  }

  function onLightboxPointerDown(event) {
    if (els.lightbox.hidden) return;
    if (event.target.closest && event.target.closest(".lightbox-bar")) return;

    // 双指：进入捏合缩放
    if (event.touches && event.touches.length >= 2) {
      event.preventDefault();
      beginLightboxPinch(event.touches);
      return;
    }

    if (event.button != null && event.button !== 0 && !(event.touches && event.touches.length)) return;
    event.preventDefault();
    lightboxView.pinching = false;
    lightboxView.dragging = true;
    lightboxView.moved = false;
    // 图片本体有 pointer-events:none，点图命中 stage；点空白命中 body
    lightboxView.tapOnMask = !(event.target.closest && event.target.closest(".lightbox-stage"));
    lightboxView.lastX = event.clientX;
    lightboxView.lastY = event.clientY;
    if (event.touches && event.touches[0]) {
      lightboxView.lastX = event.touches[0].clientX;
      lightboxView.lastY = event.touches[0].clientY;
    }
    els.lightboxBody.classList.add("is-dragging");
  }

  function onLightboxPointerMove(event) {
    if (els.lightbox.hidden) return;

    // 双指捏合缩放（相对起始指距）
    if (event.touches && event.touches.length >= 2) {
      event.preventDefault();
      if (!lightboxView.pinching) beginLightboxPinch(event.touches);
      if (lightboxView.pinchStartDist < 1) return;
      var nextScale = lightboxView.pinchStartScale * (lightboxTouchDistance(event.touches) / lightboxView.pinchStartDist);
      nextScale = Math.min(lightboxView.max, Math.max(lightboxView.min, nextScale));
      var center = lightboxTouchCenter(event.touches);
      lightboxView.scale = nextScale;
      lightboxView.x = center.x - lightboxView.pinchWorldX * nextScale;
      lightboxView.y = center.y - lightboxView.pinchWorldY * nextScale;
      applyLightboxTransform(true);
      return;
    }

    if (!lightboxView.dragging) return;
    event.preventDefault();
    var clientX = event.clientX;
    var clientY = event.clientY;
    if (event.touches && event.touches[0]) {
      clientX = event.touches[0].clientX;
      clientY = event.touches[0].clientY;
    }
    var dx = clientX - lightboxView.lastX;
    var dy = clientY - lightboxView.lastY;
    // 手机触控抖动阈值，避免误判为拖动导致无法点遮罩关闭
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) lightboxView.moved = true;
    lightboxView.x += dx;
    lightboxView.y += dy;
    lightboxView.lastX = clientX;
    lightboxView.lastY = clientY;
    applyLightboxTransform(false);
  }

  function onLightboxPointerUp(event) {
    if (els.lightbox.hidden) return;

    // 双指变单指：结束捏合，继续单指拖动
    if (event.touches && event.touches.length === 1 && lightboxView.pinching) {
      lightboxView.pinching = false;
      lightboxView.dragging = true;
      lightboxView.lastX = event.touches[0].clientX;
      lightboxView.lastY = event.touches[0].clientY;
      els.lightboxBody.classList.add("is-dragging");
      return;
    }

    if (event.touches && event.touches.length > 0) return;

    var wasDragging = lightboxView.dragging;
    var wasPinching = lightboxView.pinching;
    var moved = lightboxView.moved;
    var tapOnMask = lightboxView.tapOnMask;
    lightboxView.dragging = false;
    lightboxView.pinching = false;
    lightboxView.tapOnMask = false;
    els.lightboxBody.classList.remove("is-dragging");

    // 触摸轻点遮罩关闭：preventDefault 后多数移动端不会再派发 click
    if (event.type && event.type.indexOf("touch") === 0) {
      if (wasDragging && tapOnMask && !moved && !wasPinching) {
        closeLightbox();
        swallowNextClick();
      }
    }
  }

  function previewStitchLarge() {
    // 灯箱只按屏幕分辨率拼接，标题写导出时的真实尺寸
    const settings = getSettings();
    const out = stitchToCanvas(settings, getLightboxDisplayMaxEdge());
    if (!out) {
      showToast("请先添加图片", true);
      return;
    }
    const size = exportSize(settings);
    openLightboxCanvas(out, "拼接结果 · 导出 " + size.w + " × " + size.h);
  }

  function moveItem(from, to) {
    if (to < 0 || to >= images.length || from === to) return;
    const item = images.splice(from, 1)[0];
    images.splice(to, 0, item);
    renderThumbs();
    schedulePreview();
  }

  function removeItem(index) {
    const item = images.splice(index, 1)[0];
    if (!item) return;
    releaseImage(item);
    renderThumbs();
    schedulePreview();
    showToast("已移除「" + item.name + "」" + (images.length ? "，还剩 " + images.length + " 张" : "，列表已经空了"));
  }

  function clearAll() {
    if (!images.length) return;
    if (!window.confirm("清空已添加的 " + images.length + " 张图片？只是从这里移除，原文件不受影响。")) return;
    images.forEach(releaseImage);
    images = [];
    renderThumbs();
    schedulePreview();
    showToast("已清空，可以重新添加图片");
  }

  function getSettings() {
    return {
      direction: getRadioValue(els.direction),
      scaleMode: getRadioValue(els.scaleMode),
      gap: Math.min(GAP_MAX, Math.max(0, parseInt(els.gap.value, 10) || 0)),
      bgColor: els.bgColor.value || "#000000"
    };
  }

  /** 纵向统一宽度、横向统一高度：max 向最大的看齐（小图放大），min 向最小的看齐（大图缩小），none 不缩放 */
  function computeScaledSizes(settings) {
    const sizes = images.map((item) => ({ w: item.width, h: item.height, img: item }));
    if (!sizes.length || settings.scaleMode === "none") return sizes;
    const vertical = settings.direction === "vertical";
    const edges = sizes.map((size) => (vertical ? size.w : size.h));
    const target = settings.scaleMode === "min" ? Math.min(...edges) : Math.max(...edges);
    return sizes.map((size) => {
      const scale = target / (vertical ? size.w : size.h);
      return { w: Math.round(size.w * scale), h: Math.round(size.h * scale), img: size.img };
    });
  }

  /** 成图原始像素尺寸，未做 8000 封顶；没有图片返回 null */
  function measureStitch(sizes, settings) {
    if (!sizes.length) return null;
    const gapTotal = settings.gap * (sizes.length - 1);
    if (settings.direction === "vertical") {
      return { w: Math.max(...sizes.map((size) => size.w)), h: sizes.reduce((sum, size) => sum + size.h, 0) + gapTotal };
    }
    return { w: sizes.reduce((sum, size) => sum + size.w, 0) + gapTotal, h: Math.max(...sizes.map((size) => size.h)) };
  }

  /**
   * 复制、下载、标注实际用的尺寸：最长边超过 8000 时等比缩小（与 stitchToCanvas 的取整一致），
   * capped 表示是否缩过，rawW / rawH 是缩之前的尺寸；没有图片返回 null
   */
  function exportSize(settings, sizes) {
    const total = measureStitch(sizes || computeScaledSizes(settings), settings);
    if (!total) return null;
    const longest = Math.max(total.w, total.h);
    const scale = longest > EXPORT_MAX_EDGE ? EXPORT_MAX_EDGE / longest : 1;
    return {
      w: Math.max(1, Math.round(total.w * scale)),
      h: Math.max(1, Math.round(total.h * scale)),
      rawW: total.w,
      rawH: total.h,
      capped: scale < 1
    };
  }

  /** 按设置拼接：maxEdge 为 0 表示原尺寸，否则最长边缩到 maxEdge 以内；传入 target 时直接画在它上面 */
  function stitchToCanvas(settings, maxEdge, target) {
    const sizes = computeScaledSizes(settings);
    const total = measureStitch(sizes, settings);
    if (!total) return null;
    const vertical = settings.direction === "vertical";
    const longest = Math.max(total.w, total.h);
    const scale = maxEdge && longest > maxEdge ? maxEdge / longest : 1;
    const canvas = target || document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(total.w * scale));
    canvas.height = Math.max(1, Math.round(total.h * scale));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = settings.bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const gap = settings.gap * scale;
    let offset = 0;
    sizes.forEach((size) => {
      const drawW = size.w * scale;
      const drawH = size.h * scale;
      const drawX = vertical ? (canvas.width - drawW) / 2 : offset;
      const drawY = vertical ? offset : (canvas.height - drawH) / 2;
      ctx.drawImage(size.img.bitmap, drawX, drawY, drawW, drawH);
      offset += (vertical ? drawH : drawW) + gap;
    });
    return canvas;
  }

  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 80);
  }

  /** 刷新缩放说明、成图尺寸和预览图；成图超过 8000px 时提前说明导出会等比缩小 */
  function renderPreview() {
    const settings = getSettings();
    const sizes = computeScaledSizes(settings);
    const size = exportSize(settings, sizes);
    updateScaleExplain(settings);
    els.previewEmpty.hidden = Boolean(size);
    els.previewCanvas.hidden = !size;
    els.previewTip.hidden = !size;
    els.outputChip.hidden = !size;
    if (!size) {
      els.dockInfo.textContent = "还没添加图片";
      return;
    }
    els.outputChip.classList.toggle("is-warn", size.capped);
    els.outputChip.textContent = size.capped
      ? "原始 " + size.rawW + " × " + size.rawH + "，超过 " + EXPORT_MAX_EDGE + "px，复制/下载时等比缩到 " + size.w + " × " + size.h
      : "成图 " + size.w + " × " + size.h + " px";
    els.dockInfo.textContent = images.length + " 张 · " + size.w + " × " + size.h;
    stitchToCanvas(settings, PREVIEW_MAX_EDGE, els.previewCanvas);
  }

  /** 对齐缩放的大白话说明：随方向切换「宽 / 高」字眼，有图时带上实际像素，图片本来一样大时直接说明无需缩放 */
  function updateScaleExplain(settings) {
    const vertical = settings.direction === "vertical";
    const edgeName = vertical ? "宽度" : "高度";
    const bigWord = vertical ? "宽" : "高";
    const smallWord = vertical ? "窄" : "矮";
    els.scaleMaxText.textContent = "对齐最" + bigWord;
    els.scaleMinText.textContent = "对齐最" + smallWord;
    const edges = images.map((item) => (vertical ? item.width : item.height));
    const maxPx = edges.length ? Math.max(...edges) : 0;
    const minPx = edges.length ? Math.min(...edges) : 0;
    let text;
    if (edges.length === 1) {
      text = "只有一张图，不用对齐；再加几张" + edgeName + "不同的图，这里会说明怎么缩放";
    } else if (edges.length > 1 && maxPx === minPx) {
      text = "这些图" + edgeName + "都是 " + maxPx + "px，不需要缩放，三个选项效果一样";
    } else if (settings.scaleMode === "max") {
      text = edgeName + "统一成最" + bigWord + "那张" + (maxPx ? "的 " + maxPx + "px" : "") + "：" + smallWord + "的图会被放大（可能略糊），拼出来" + (vertical ? "左右" : "上下") + "边缘整齐";
    } else if (settings.scaleMode === "min") {
      text = edgeName + "统一成最" + smallWord + "那张" + (minPx ? "的 " + minPx + "px" : "") + "：" + bigWord + "的图会被缩小，画面清晰、文件更小";
    } else {
      text = "每张保持原尺寸：比最" + bigWord + "那张" + smallWord + "的图会居中摆放，" + (vertical ? "左右两侧" : "上下两边") + "露出底色";
    }
    els.scaleExplain.textContent = text;
  }

  /** 导出直接按封顶尺寸绘制，不先画原尺寸：浏览器画布有尺寸上限，超长图先画原尺寸会得到空白图 */
  function stitchForExport() {
    return images.length ? stitchToCanvas(getSettings(), EXPORT_MAX_EDGE) : null;
  }

  function downloadStitchPng() {
    const out = stitchForExport();
    if (!out) {
      showToast("请先添加图片", true);
      return;
    }
    saveCanvasPng(out);
  }

  function copyStitchPng() {
    const out = stitchForExport();
    if (!out) {
      showToast("请先添加图片", true);
      return;
    }
    copyCanvasPng(out, "拼接图");
  }

  /* —— 编辑态 —— */

  function pushHistory() {
    var snapshot = {
      shapes: JSON.parse(JSON.stringify(shapes)),
      base: cloneCanvas(bitmapToCanvas(baseBitmap))
    };
    history = history.slice(0, historyIndex + 1);
    history.push(snapshot);
    if (history.length > 40) {
      history.shift();
    } else {
      historyIndex++;
    }
    // after shift, index stays at end
    historyIndex = history.length - 1;
    updateUndoRedo();
  }

  function cloneCanvas(src) {
    var c = document.createElement("canvas");
    c.width = src.width;
    c.height = src.height;
    c.getContext("2d").drawImage(src, 0, 0);
    return c;
  }

  function bitmapToCanvas(bitmap) {
    if (bitmap instanceof HTMLCanvasElement) return bitmap;
    var c = document.createElement("canvas");
    c.width = bitmap.width;
    c.height = bitmap.height;
    c.getContext("2d").drawImage(bitmap, 0, 0);
    return c;
  }

  function restoreHistory(index) {
    var snap = history[index];
    if (!snap) return;
    shapes = JSON.parse(JSON.stringify(snap.shapes));
    baseBitmap = cloneCanvas(snap.base);
    historyIndex = index;
    if (selectedIndex >= shapes.length) selectedIndex = shapes.length - 1;
    syncEditCanvasSize();
    redrawEdit();
    updateUndoRedo();
    updateDeleteBtn();
  }

  function updateUndoRedo() {
    els.btnUndo.disabled = historyIndex <= 0;
    els.btnRedo.disabled = historyIndex >= history.length - 1;
  }

  function syncEditCanvasSize() {
    var canvas = els.editCanvas;
    var prevW = canvas.width;
    var prevH = canvas.height;
    canvas.width = baseBitmap.width;
    canvas.height = baseBitmap.height;
    if (prevW !== canvas.width || prevH !== canvas.height) {
      fitEditToView();
    } else {
      updateEditScale();
      updateSizeBadge();
    }
  }

  function updateEditScale() {
    var canvas = els.editCanvas;
    var rect = canvas.getBoundingClientRect();
    editScale = (rect.width / canvas.width) || editView.scale || 1;
  }

  function updateSizeBadge() {
    if (!els.sizeBadge || !baseBitmap) return;
    els.sizeBadge.textContent =
      baseBitmap.width + " × " + baseBitmap.height + " · " + Math.round(editView.scale * 100) + "%";
  }

  function flushEditTransform() {
    editView.rafId = 0;
    if (!els.editWorld) return;
    els.editWorld.style.transform =
      "translate3d(-50%, -50%, 0) translate3d(" + editView.x + "px," + editView.y + "px,0) scale(" + editView.scale + ")";
    updateSizeBadge();
  }

  function applyEditTransform() {
    if (editView.rafId) return;
    editView.rafId = requestAnimationFrame(flushEditTransform);
  }

  function fitEditToView() {
    var canvas = els.editCanvas;
    var viewport = els.editViewport;
    if (!canvas || !viewport || canvas.width < 1 || canvas.height < 1) return;
    var pad = 16;
    var viewW = Math.max(1, viewport.clientWidth - pad);
    var viewH = Math.max(1, viewport.clientHeight - pad);
    var fit = Math.min(viewW / canvas.width, viewH / canvas.height);
    editView.scale = Math.max(editView.min, Math.min(editView.max, fit));
    editView.x = 0;
    editView.y = 0;
    applyEditTransform();
    updateEditScale();
    updateSizeBadge();
  }

  function zoomEditBy(factor, clientX, clientY) {
    var viewport = els.editViewport;
    if (!viewport) return;
    var rect = viewport.getBoundingClientRect();
    var cx;
    var cy;
    if (clientX == null || clientY == null) {
      cx = 0;
      cy = 0;
    } else {
      cx = clientX - rect.left - rect.width / 2;
      cy = clientY - rect.top - rect.height / 2;
    }
    var next = Math.min(editView.max, Math.max(editView.min, editView.scale * factor));
    if (next === editView.scale) return;
    var worldX = (cx - editView.x) / editView.scale;
    var worldY = (cy - editView.y) / editView.scale;
    editView.scale = next;
    editView.x = cx - worldX * next;
    editView.y = cy - worldY * next;
    applyEditTransform();
    updateEditScale();
  }

  function editTouchDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function editTouchCenter(touches) {
    var rect = els.editViewport.getBoundingClientRect();
    var midX = (touches[0].clientX + touches[1].clientX) / 2;
    var midY = (touches[0].clientY + touches[1].clientY) / 2;
    return {
      x: midX - rect.left - rect.width / 2,
      y: midY - rect.top - rect.height / 2
    };
  }

  function beginEditPinch(touches) {
    drawing = false;
    startPt = null;
    currentPath = null;
    movingSelection = false;
    editView.dragging = false;
    editView.pinching = true;
    editView.pinchStartDist = editTouchDistance(touches);
    editView.pinchStartScale = editView.scale;
    var center = editTouchCenter(touches);
    editView.pinchWorldX = (center.x - editView.x) / editView.scale;
    editView.pinchWorldY = (center.y - editView.y) / editView.scale;
  }

  function isEditChrome(event) {
    return !!(event.target.closest && (
      event.target.closest(".beautify-bar") ||
      event.target.closest(".edit-toolbar") ||
      event.target.closest(".text-input-pop")
    ));
  }

  function isEditPanGesture(event) {
    if (editView.spaceDown) return true;
    if (tool === "pan") return true;
    return event.target !== els.editCanvas;
  }

  function enterEdit() {
    if (!images.length) return;
    const settings = getSettings();
    const size = exportSize(settings);
    // 直接按封顶尺寸绘制，避免先画出超过浏览器上限的原尺寸画布
    baseBitmap = stitchToCanvas(settings, EXPORT_MAX_EDGE);
    shapes = [];
    history = [];
    historyIndex = -1;
    pushHistory();
    document.body.classList.add("is-edit");
    // 触屏默认「拖动」，避免长图一划就变成标注
    const preferPan =
      (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
      window.innerWidth < 900;
    setTool(preferPan ? "pan" : "rect");
    syncEditCanvasSize();
    redrawEdit();
    requestAnimationFrame(() => fitEditToView());
    const gestureTip = preferPan
      ? "双指或按钮缩放，拖动看细节；选下方工具后再标注"
      : "已选中矩形，直接拖动就能画框；滚轮缩放，按住空格拖动画布，Esc 返回拼接";
    showToast(size.capped ? "成图太大，已等比缩到 " + size.w + " × " + size.h + " 再标注。" + gestureTip : gestureTip, size.capped);
  }

  function leaveEdit() {
    commitTextPop(true);
    document.body.classList.remove("is-edit");
    if (editView.rafId) {
      cancelAnimationFrame(editView.rafId);
      editView.rafId = 0;
    }
    editView.dragging = false;
    editView.pinching = false;
    editView.spaceDown = false;
    if (els.editViewport) els.editViewport.classList.remove("is-panning");
    drawing = false;
    startPt = null;
    currentPath = null;
    selectedIndex = -1;
    movingSelection = false;
    moveLastPt = null;
    moveDirty = false;
  }

  function setTool(name) {
    commitTextPop(true);
    tool = name;
    els.editFrame.setAttribute("data-tool", name);
    document.querySelectorAll(".edit-toolbar [data-tool]").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.getAttribute("data-tool") === name);
    });
    drawing = false;
    startPt = null;
    currentPath = null;
    movingSelection = false;
    moveLastPt = null;
    redrawEdit();
    updateDeleteBtn();
  }

  function updateDeleteBtn() {
    if (els.btnDeleteShape) {
      els.btnDeleteShape.disabled = selectedIndex < 0 || !shapes[selectedIndex];
    }
  }

  function shapeBounds(s) {
    var pad = Math.max(8, (s.width || 4) * 1.5);
    if (s.type === "rect" || s.type === "ellipse") {
      return { x: s.x, y: s.y, w: s.w, h: s.h };
    }
    if (s.type === "arrow") {
      return normalizeRect(s.x1, s.y1, s.x2, s.y2);
    }
    if (s.type === "pen" && s.points && s.points.length) {
      var minX = s.points[0].x;
      var minY = s.points[0].y;
      var maxX = minX;
      var maxY = minY;
      s.points.forEach(function (p) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      });
      return { x: minX - pad, y: minY - pad, w: maxX - minX + pad * 2, h: maxY - minY + pad * 2 };
    }
    if (s.type === "text") {
      var fontSize = Math.max(14, (s.width || 4) * 5);
      var w = Math.max(fontSize, String(s.text || "").length * fontSize * 0.62);
      return { x: s.x, y: s.y, w: w, h: fontSize * 1.35 };
    }
    return { x: 0, y: 0, w: 0, h: 0 };
  }

  function distToSegment(px, py, x1, y1, x2, y2) {
    var dx = x2 - x1;
    var dy = y2 - y1;
    var len2 = dx * dx + dy * dy;
    if (len2 <= 0) return Math.hypot(px - x1, py - y1);
    var t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function shapeContains(s, pt) {
    var hitPad = Math.max(14, (s.width || 4) * 2.5);
    if (s.type === "rect" || s.type === "ellipse") {
      return pt.x >= s.x - hitPad && pt.x <= s.x + s.w + hitPad &&
        pt.y >= s.y - hitPad && pt.y <= s.y + s.h + hitPad;
    }
    if (s.type === "arrow") {
      return distToSegment(pt.x, pt.y, s.x1, s.y1, s.x2, s.y2) <= hitPad;
    }
    if (s.type === "pen" && s.points) {
      for (var i = 1; i < s.points.length; i++) {
        if (distToSegment(pt.x, pt.y, s.points[i - 1].x, s.points[i - 1].y, s.points[i].x, s.points[i].y) <= hitPad) {
          return true;
        }
      }
      return false;
    }
    if (s.type === "text") {
      var b = shapeBounds(s);
      return pt.x >= b.x - 4 && pt.x <= b.x + b.w + 4 && pt.y >= b.y - 4 && pt.y <= b.y + b.h + 4;
    }
    return false;
  }

  function hitTestShape(pt) {
    for (var i = shapes.length - 1; i >= 0; i--) {
      if (shapeContains(shapes[i], pt)) return i;
    }
    return -1;
  }

  function translateShape(s, dx, dy) {
    if (!s) return;
    if (s.type === "rect" || s.type === "ellipse" || s.type === "text") {
      s.x += dx;
      s.y += dy;
    } else if (s.type === "arrow") {
      s.x1 += dx;
      s.y1 += dy;
      s.x2 += dx;
      s.y2 += dy;
    } else if (s.type === "pen" && s.points) {
      s.points.forEach(function (p) {
        p.x += dx;
        p.y += dy;
      });
    }
  }

  function drawSelection(ctx, s) {
    var b = shapeBounds(s);
    ctx.save();
    ctx.setLineDash([8, 5]);
    ctx.strokeStyle = "#4096FF";
    ctx.lineWidth = Math.max(2, 2 / (editScale || 1));
    ctx.strokeRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
    ctx.restore();
  }

  function deleteSelectedShape() {
    if (selectedIndex < 0 || !shapes[selectedIndex]) return;
    shapes.splice(selectedIndex, 1);
    selectedIndex = -1;
    pushHistory();
    redrawEdit();
    updateDeleteBtn();
    showToast("已删除选中标注");
  }

  function applyStyleToSelected() {
    if (selectedIndex < 0 || !shapes[selectedIndex]) return;
    var style = strokeStyle();
    var shape = shapes[selectedIndex];
    shape.color = style.color;
    shape.width = style.width;
    pushHistory();
    redrawEdit();
  }

  function pointerToCanvas(event) {
    var canvas = els.editCanvas;
    var rect = canvas.getBoundingClientRect();
    var clientX = event.clientX;
    var clientY = event.clientY;
    if (event.touches && event.touches[0]) {
      clientX = event.touches[0].clientX;
      clientY = event.touches[0].clientY;
    } else if (event.changedTouches && event.changedTouches[0]) {
      clientX = event.changedTouches[0].clientX;
      clientY = event.changedTouches[0].clientY;
    }
    return {
      x: ((clientX - rect.left) / rect.width) * canvas.width,
      y: ((clientY - rect.top) / rect.height) * canvas.height
    };
  }

  function strokeStyle() {
    return {
      color: els.strokeColor.value || "#ff3b30",
      width: parseInt(els.strokeWidth.value, 10) || 4
    };
  }

  function drawShape(ctx, shape, draft) {
    var s = shape;
    ctx.save();
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (s.type === "rect") {
      ctx.strokeRect(s.x, s.y, s.w, s.h);
    } else if (s.type === "ellipse") {
      ctx.beginPath();
      ctx.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w / 2), Math.abs(s.h / 2), 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (s.type === "arrow") {
      drawArrow(ctx, s.x1, s.y1, s.x2, s.y2, s.width);
    } else if (s.type === "pen") {
      if (!s.points || s.points.length < 2) {
        ctx.restore();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for (var i = 1; i < s.points.length; i++) {
        ctx.lineTo(s.points[i].x, s.points[i].y);
      }
      ctx.stroke();
    } else if (s.type === "text") {
      ctx.font = "bold " + Math.max(14, s.width * 5) + "px " + getComputedStyle(document.body).fontFamily;
      ctx.textBaseline = "top";
      ctx.fillText(s.text || "", s.x, s.y);
    } else if (s.type === "mosaic" || s.type === "crop") {
      ctx.setLineDash(draft ? [6, 4] : []);
      ctx.strokeStyle = s.type === "crop" ? "#4096FF" : "rgba(0,0,0,0.55)";
      ctx.fillStyle = s.type === "mosaic" ? "rgba(0,0,0,0.12)" : "rgba(56,189,248,0.12)";
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeRect(s.x, s.y, s.w, s.h);
    }
    ctx.restore();
  }

  function drawArrow(ctx, x1, y1, x2, y2, width) {
    var dx = x2 - x1;
    var dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len;
    var uy = dy / len;
    var head = Math.max(12, width * 3.5);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - ux * head - uy * head * 0.45, y2 - uy * head + ux * head * 0.45);
    ctx.lineTo(x2 - ux * head + uy * head * 0.45, y2 - uy * head - ux * head * 0.45);
    ctx.closePath();
    ctx.fill();
  }

  function redrawEdit(draftShape) {
    var canvas = els.editCanvas;
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(baseBitmap, 0, 0);
    shapes.forEach(function (shape) {
      drawShape(ctx, shape, false);
    });
    if (selectedIndex >= 0 && shapes[selectedIndex]) {
      drawSelection(ctx, shapes[selectedIndex]);
    }
    if (draftShape) drawShape(ctx, draftShape, true);
  }

  function normalizeRect(x1, y1, x2, y2) {
    return {
      x: Math.min(x1, x2),
      y: Math.min(y1, y2),
      w: Math.abs(x2 - x1),
      h: Math.abs(y2 - y1)
    };
  }

  function applyMosaic(rect) {
    var r = normalizeRect(rect.x, rect.y, rect.x + rect.w, rect.y + rect.h);
    if (r.w < 2 || r.h < 2) return;
    var baked = cloneCanvas(bitmapToCanvas(baseBitmap));
    var bctx = baked.getContext("2d");
    // 先画已有标注进底图
    shapes.forEach(function (shape) { drawShape(bctx, shape, false); });
    shapes = [];
    selectedIndex = -1;

    var block = Math.max(8, Math.round(Math.min(r.w, r.h) / 12));
    var sx = Math.floor(r.x);
    var sy = Math.floor(r.y);
    var sw = Math.ceil(r.w);
    var sh = Math.ceil(r.h);
    var sample = document.createElement("canvas");
    var tw = Math.max(1, Math.ceil(sw / block));
    var th = Math.max(1, Math.ceil(sh / block));
    sample.width = tw;
    sample.height = th;
    var sctx = sample.getContext("2d");
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(baked, sx, sy, sw, sh, 0, 0, tw, th);
    bctx.imageSmoothingEnabled = false;
    bctx.drawImage(sample, 0, 0, tw, th, sx, sy, sw, sh);
    bctx.imageSmoothingEnabled = true;
    baseBitmap = baked;
    syncEditCanvasSize();
    pushHistory();
    redrawEdit();
    updateDeleteBtn();
  }

  function applyCrop(rect) {
    var r = normalizeRect(rect.x, rect.y, rect.x + rect.w, rect.y + rect.h);
    if (r.w < 2 || r.h < 2) return;
    var baked = cloneCanvas(bitmapToCanvas(baseBitmap));
    var bctx = baked.getContext("2d");
    shapes.forEach(function (shape) { drawShape(bctx, shape, false); });
    shapes = [];
    selectedIndex = -1;

    var out = document.createElement("canvas");
    out.width = Math.max(1, Math.round(r.w));
    out.height = Math.max(1, Math.round(r.h));
    out.getContext("2d").drawImage(
      baked,
      Math.round(r.x), Math.round(r.y), out.width, out.height,
      0, 0, out.width, out.height
    );
    baseBitmap = out;
    syncEditCanvasSize();
    pushHistory();
    redrawEdit();
    updateDeleteBtn();
  }

  function onPointerDown(event) {
    if (!document.body.classList.contains("is-edit")) return;
    if (event.target === els.textPop) return;
    if (isEditChrome(event)) return;
    // 点画布其它位置先确认文字
    if (!els.textPop.hidden) {
      commitTextPop(true);
    }

    if (event.touches && event.touches.length >= 2) {
      event.preventDefault();
      beginEditPinch(event.touches);
      return;
    }

    if (isEditPanGesture(event)) {
      if (event.button != null && event.button !== 0 && !(event.touches && event.touches.length)) return;
      event.preventDefault();
      editView.pinching = false;
      editView.dragging = true;
      editView.lastX = event.clientX;
      editView.lastY = event.clientY;
      if (event.touches && event.touches[0]) {
        editView.lastX = event.touches[0].clientX;
        editView.lastY = event.touches[0].clientY;
      }
      if (els.editViewport) els.editViewport.classList.add("is-panning");
      return;
    }

    if (event.touches && event.touches.length > 1) return;
    if (event.button != null && event.button !== 0) return;
    event.preventDefault();
    updateEditScale();
    var pt = pointerToCanvas(event);

    if (tool === "select") {
      var hit = hitTestShape(pt);
      selectedIndex = hit;
      updateDeleteBtn();
      if (hit >= 0) {
        var shape = shapes[hit];
        if (shape.color) els.strokeColor.value = shape.color;
        if (shape.width) {
          var w = String(shape.width);
          if (["2", "4", "8", "14"].indexOf(w) >= 0) els.strokeWidth.value = w;
        }
        movingSelection = true;
        moveLastPt = pt;
        moveDirty = false;
        startPt = pt;
      } else {
        movingSelection = false;
        moveLastPt = null;
      }
      redrawEdit();
      return;
    }

    if (tool === "text") {
      // 点到已有文字则编辑，否则新建
      var textHit = hitTestShape(pt);
      if (textHit >= 0 && shapes[textHit].type === "text") {
        selectedIndex = textHit;
        updateDeleteBtn();
        openTextPop(pt, shapes[textHit], textHit);
        return;
      }
      selectedIndex = -1;
      updateDeleteBtn();
      openTextPop(pt, null, -1);
      return;
    }

    selectedIndex = -1;
    updateDeleteBtn();
    drawing = true;
    startPt = pt;
    var style = strokeStyle();
    if (tool === "pen") {
      currentPath = {
        type: "pen",
        color: style.color,
        width: style.width,
        points: [{ x: pt.x, y: pt.y }]
      };
    }
  }

  function onPointerMove(event) {
    if (document.body.classList.contains("is-edit")) {
      if (event.touches && event.touches.length >= 2) {
        event.preventDefault();
        if (!editView.pinching) beginEditPinch(event.touches);
        if (editView.pinchStartDist < 1) return;
        var nextScale = editView.pinchStartScale * (editTouchDistance(event.touches) / editView.pinchStartDist);
        nextScale = Math.min(editView.max, Math.max(editView.min, nextScale));
        var center = editTouchCenter(event.touches);
        editView.scale = nextScale;
        editView.x = center.x - editView.pinchWorldX * nextScale;
        editView.y = center.y - editView.pinchWorldY * nextScale;
        applyEditTransform();
        updateEditScale();
        return;
      }
      if (editView.dragging) {
        event.preventDefault();
        var panX = event.clientX;
        var panY = event.clientY;
        if (event.touches && event.touches[0]) {
          panX = event.touches[0].clientX;
          panY = event.touches[0].clientY;
        }
        editView.x += panX - editView.lastX;
        editView.y += panY - editView.lastY;
        editView.lastX = panX;
        editView.lastY = panY;
        applyEditTransform();
        return;
      }
    }

    if (tool === "select" && movingSelection && moveLastPt && selectedIndex >= 0) {
      if (event.touches && event.touches.length > 1) return;
      event.preventDefault();
      var ptMove = pointerToCanvas(event);
      var dx = ptMove.x - moveLastPt.x;
      var dy = ptMove.y - moveLastPt.y;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
        translateShape(shapes[selectedIndex], dx, dy);
        moveLastPt = ptMove;
        moveDirty = true;
        redrawEdit();
      }
      return;
    }

    if (!drawing || !startPt) return;
    if (event.touches && event.touches.length > 1) {
      drawing = false;
      startPt = null;
      currentPath = null;
      redrawEdit();
      return;
    }
    event.preventDefault();
    var pt = pointerToCanvas(event);
    var style = strokeStyle();
    var draft = null;
    if (tool === "pen" && currentPath) {
      currentPath.points.push({ x: pt.x, y: pt.y });
      draft = currentPath;
    } else if (tool === "rect" || tool === "mosaic" || tool === "crop" || tool === "ellipse") {
      var r = normalizeRect(startPt.x, startPt.y, pt.x, pt.y);
      draft = {
        type: tool === "ellipse" ? "ellipse" : tool,
        color: style.color,
        width: style.width,
        x: r.x,
        y: r.y,
        w: r.w,
        h: r.h
      };
    } else if (tool === "arrow") {
      draft = {
        type: "arrow",
        color: style.color,
        width: style.width,
        x1: startPt.x,
        y1: startPt.y,
        x2: pt.x,
        y2: pt.y
      };
    }
    redrawEdit(draft);
  }

  function onPointerUp(event) {
    if (document.body.classList.contains("is-edit")) {
      if (event.touches && event.touches.length === 1 && editView.pinching) {
        editView.pinching = false;
        editView.dragging = true;
        editView.lastX = event.touches[0].clientX;
        editView.lastY = event.touches[0].clientY;
        return;
      }
      if (event.touches && event.touches.length > 0) return;
      if (editView.dragging || editView.pinching) {
        editView.dragging = false;
        editView.pinching = false;
        if (els.editViewport) els.editViewport.classList.remove("is-panning");
        return;
      }
    }

    if (tool === "select") {
      if (movingSelection && selectedIndex >= 0) {
        var shape = shapes[selectedIndex];
        var movedFar = moveDirty;
        // 文字：几乎没拖动则打开编辑
        if (!movedFar && shape && shape.type === "text" && startPt) {
          openTextPop(startPt, shape, selectedIndex);
        } else if (movedFar) {
          pushHistory();
        }
      }
      movingSelection = false;
      moveLastPt = null;
      moveDirty = false;
      startPt = null;
      redrawEdit();
      updateDeleteBtn();
      return;
    }

    if (!drawing || !startPt) return;
    event.preventDefault();
    var pt = pointerToCanvas(event);
    var style = strokeStyle();
    drawing = false;

    if (tool === "pen" && currentPath) {
      if (currentPath.points.length > 1) {
        shapes.push(currentPath);
        selectedIndex = shapes.length - 1;
        pushHistory();
      }
      currentPath = null;
      redrawEdit();
      updateDeleteBtn();
      startPt = null;
      return;
    }

    if (tool === "arrow") {
      if (Math.hypot(pt.x - startPt.x, pt.y - startPt.y) > 4) {
        shapes.push({
          type: "arrow",
          color: style.color,
          width: style.width,
          x1: startPt.x,
          y1: startPt.y,
          x2: pt.x,
          y2: pt.y
        });
        selectedIndex = shapes.length - 1;
        pushHistory();
      }
    } else if (tool === "rect" || tool === "ellipse") {
      var r = normalizeRect(startPt.x, startPt.y, pt.x, pt.y);
      if (r.w > 2 && r.h > 2) {
        shapes.push({
          type: tool,
          color: style.color,
          width: style.width,
          x: r.x,
          y: r.y,
          w: r.w,
          h: r.h
        });
        selectedIndex = shapes.length - 1;
        pushHistory();
      }
    } else if (tool === "mosaic") {
      var mr = normalizeRect(startPt.x, startPt.y, pt.x, pt.y);
      applyMosaic(mr);
      startPt = null;
      return;
    } else if (tool === "crop") {
      var cr = normalizeRect(startPt.x, startPt.y, pt.x, pt.y);
      applyCrop(cr);
      startPt = null;
      return;
    }

    startPt = null;
    redrawEdit();
    updateDeleteBtn();
  }

  function openTextPop(pt, existingShape, editIndex) {
    if (!els.textPop.hidden) commitTextPop(true);
    var pop = els.textPop;
    var canvas = els.editCanvas;
    var rect = canvas.getBoundingClientRect();
    var x = existingShape ? existingShape.x : pt.x;
    var y = existingShape ? existingShape.y : pt.y;
    pop.hidden = false;
    pop.value = existingShape ? String(existingShape.text || "") : "";
    pop.style.left = (rect.left + x * (rect.width / canvas.width)) + "px";
    pop.style.top = (rect.top + y * (rect.height / canvas.height)) + "px";
    pop.style.color = existingShape && existingShape.color ? existingShape.color : strokeStyle().color;
    textPopPending = {
      x: x,
      y: y,
      editIndex: typeof editIndex === "number" ? editIndex : -1
    };
    setTimeout(function () { pop.focus(); }, 0);
  }

  function commitTextPop(save) {
    var pop = els.textPop;
    if (pop.hidden || textCommitLock) return;
    textCommitLock = true;
    try {
      var text = String(pop.value || "").trim();
      pop.hidden = true;
      if (save && text && textPopPending) {
        var style = strokeStyle();
        var idx = textPopPending.editIndex;
        if (idx >= 0 && shapes[idx] && shapes[idx].type === "text") {
          shapes[idx].text = text;
          shapes[idx].color = style.color;
          shapes[idx].width = style.width;
          selectedIndex = idx;
        } else {
          shapes.push({
            type: "text",
            color: style.color,
            width: style.width,
            x: textPopPending.x,
            y: textPopPending.y,
            text: text
          });
          selectedIndex = shapes.length - 1;
        }
        pushHistory();
        redrawEdit();
        updateDeleteBtn();
      }
      textPopPending = null;
    } finally {
      textCommitLock = false;
    }
  }

  function exportCanvas(applyBeautify) {
    var src = els.editCanvas;
    redrawEdit();
    if (!applyBeautify) {
      return cloneCanvas(src);
    }
    var radius = parseInt(els.cornerRadius.value, 10) || 0;
    var shadow = els.dropShadow.checked;
    var pad = shadow ? 28 : 0;
    var out = document.createElement("canvas");
    out.width = src.width + pad * 2;
    out.height = src.height + pad * 2;
    var ctx = out.getContext("2d");
    ctx.clearRect(0, 0, out.width, out.height);

    // 圆角内容先画到临时画布，再投到导出画布（阴影才正确）
    var rounded = document.createElement("canvas");
    rounded.width = src.width;
    rounded.height = src.height;
    var rctx = rounded.getContext("2d");
    roundRectPath(rctx, 0, 0, src.width, src.height, radius);
    rctx.clip();
    rctx.drawImage(src, 0, 0);

    if (shadow) {
      ctx.shadowColor = "rgba(0,0,0,0.35)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 8;
    }
    ctx.drawImage(rounded, pad, pad);
    return out;
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    ctx.beginPath();
    if (r <= 0) {
      ctx.rect(x, y, w, h);
      return;
    }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function canvasToBlob(canvas) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (blob) {
        if (blob) resolve(blob);
        else reject(new Error("toBlob failed"));
      }, "image/png");
    });
  }

  /** 生成 PNG 并触发下载；提示里带文件名和尺寸，方便去下载目录里找 */
  function saveCanvasPng(canvas) {
    const fileName = "stitch-" + formatStamp() + ".png";
    canvasToBlob(canvas).then((blob) => {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
      showToast("已开始下载 " + fileName + "（" + canvas.width + " × " + canvas.height + "）");
    }).catch((err) => {
      console.error("生成 PNG 失败", err);
      showToast("下载失败：浏览器没能生成 PNG，多半是图太大，少拼几张再试", true);
    });
  }

  /** 先转成 PNG 再写剪贴板；浏览器不支持写图片或拒绝写入时，引导改用下载 */
  function copyCanvasPng(canvas, label) {
    if (!navigator.clipboard || !window.ClipboardItem) {
      showToast("这个浏览器不支持复制图片，请改用下载保存", true);
      return;
    }
    canvasToBlob(canvas)
      .then((blob) => navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]))
      .then(() => {
        showToast("已复制" + label + "（" + canvas.width + " × " + canvas.height + "），可直接粘贴到聊天或文档");
      })
      .catch((err) => {
        console.error("复制图片失败", err);
        showToast("复制失败：浏览器没允许写入剪贴板，请改用下载保存", true);
      });
  }

  function downloadPng() {
    saveCanvasPng(exportCanvas(true));
  }

  function copyPng() {
    copyCanvasPng(exportCanvas(true), "标注后的图片");
  }

  function formatStamp() {
    const now = new Date();
    const pad = (value) => (value < 10 ? "0" : "") + value;
    return now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
  }

  /* —— 事件绑定 —— */

  function hasDraggedFiles(event) {
    const types = event.dataTransfer && event.dataTransfer.types;
    return Boolean(types) && Array.from(types).indexOf("Files") >= 0;
  }

  /** 方向、对齐方式会改变每张图的拼接尺寸，所以缩略图说明和预览一起刷新 */
  function onSettingsChange() {
    renderThumbs();
    schedulePreview();
  }

  els.dropzone.addEventListener("click", () => els.fileInput.click());
  els.dropzone.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    els.fileInput.click();
  });
  els.fileInput.addEventListener("change", () => {
    addFiles(els.fileInput.files);
    els.fileInput.value = "";
  });

  // 整页任意位置都能拖入图片，拖动期间高亮投放区；缩略图之间的排序拖动不带文件，不走这里
  document.addEventListener("dragenter", (event) => {
    if (!hasDraggedFiles(event)) return;
    event.preventDefault();
    fileDragDepth += 1;
    els.dropzone.classList.add("is-drag");
  });
  document.addEventListener("dragover", (event) => {
    if (!hasDraggedFiles(event)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
  });
  document.addEventListener("dragleave", (event) => {
    if (!hasDraggedFiles(event)) return;
    fileDragDepth = Math.max(0, fileDragDepth - 1);
    if (!fileDragDepth) els.dropzone.classList.remove("is-drag");
  });
  document.addEventListener("drop", (event) => {
    if (!hasDraggedFiles(event)) return;
    event.preventDefault();
    fileDragDepth = 0;
    els.dropzone.classList.remove("is-drag");
    if (document.body.classList.contains("is-edit")) {
      showToast("标注时不能加图：先点工具栏的 ✕ 回到拼接页，再拖进来", true);
      return;
    }
    addFiles(event.dataTransfer.files);
  });

  window.addEventListener("paste", (event) => {
    if (document.body.classList.contains("is-edit")) return;
    if (addClipboardItems(event.clipboardData)) {
      event.preventDefault();
      return;
    }
    const target = event.target;
    const inField = target && target.closest && target.closest("input, textarea, [contenteditable]");
    const text = event.clipboardData ? event.clipboardData.getData("text/plain") : "";
    if (!inField && text) showToast("剪贴板里是文字，没有图片：先截图或复制一张图片再粘贴", true);

  onRadioGroup(els.direction, "change", onSettingsChange);

  els.gap.addEventListener("change", () => {

  window.addEventListener("keyup", function (event) {

  window.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && els.lightbox && !els.lightbox.hidden) {

    }
    if (!document.body.classList.contains("is-edit")) return;
    if (document.activeElement === els.textPop) return;
    var meta = event.ctrlKey || event.metaKey;
    if (event.code === "Space") {
      event.preventDefault();
      editView.spaceDown = true;
      return;
    }
    if (meta && event.key.toLowerCase() === "z") {
      event.preventDefault();
      if (event.shiftKey) {
        if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1);
      } else if (historyIndex > 0) {
        restoreHistory(historyIndex - 1);
      }
    } else if (meta && event.key.toLowerCase() === "y") {
      event.preventDefault();
      if (historyIndex < history.length - 1) restoreHistory(historyIndex + 1);
    } else if (meta && event.key.toLowerCase() === "s") {
      event.preventDefault();
      downloadPng();
    } else if (event.key === "Escape") {
      leaveEdit();
    } else if ((event.key === "Delete" || event.key === "Backspace") && selectedIndex >= 0) {
      if (document.activeElement === els.textPop) return;
      event.preventDefault();
      deleteSelectedShape();
    }
  });
})();
  </script>
</body>
