<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="图片拼接" />
  <title>图片拼接助手</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --fill: #fafafa;
      --text: #303133;
      --text-regular: #606266;
      --muted: #909399;
      --placeholder: #a8abb2;
      --border: #dcdfe6;
      --border-light: #e4e7ed;
      --border-lighter: #ebeef5;
      --primary: #1677FF;
      --primary-hover: #4096FF;
      --primary-active: #0958D9;
      --primary-soft: #ecf5ff;
      --primary-soft-border: #d9ecff;
      --primary-border: #c6e2ff;
      --warning: #e6a23c;
      --warning-text: #b88230;
      --warning-soft: #fdf6ec;
      --warning-border: #f5dab1;
      --danger: #f56c6c;
      --danger-soft: #fef0f0;
      --danger-border: #fbc4c4;
      --accent: #1677FF;
      --ok: #1677FF;
      --radius: 8px;
      --radius-sm: 4px;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.14);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --dock-h: 76px;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select { font: inherit; }

    .app {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 20px calc(var(--dock-h) + 36px);
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    html.in-shell .app { padding-top: 16px; }
    html.in-shell .home-link { display: none !important; }

    .home-link {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
    }

    .home-link:hover { text-decoration: underline; }

    /* —— 页头 —— */
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px 16px;
      margin-bottom: 14px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .page-head .sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* —— 按钮（Element 风格） —— */
    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      color: var(--text-regular);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      transition: color 0.15s, background-color 0.15s, border-color 0.15s;
    }

    .btn:hover:not(:disabled) {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: var(--primary-border);
    }

    .btn:active:not(:disabled) {
      color: var(--primary-active);
      border-color: var(--primary);
    }

    .btn:focus-visible {
      outline: 2px solid var(--primary-border);
      outline-offset: 1px;
    }

    .btn:disabled {
      color: #c0c4cc;
      background: var(--surface);
      border-color: var(--border-lighter);
      cursor: not-allowed;
    }

    .btn-sm {
      height: 28px;
      padding: 0 10px;
      font-size: 13px;
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover:not(:disabled) {
      color: #fff;
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-primary:active:not(:disabled) {
      color: #fff;
      background: var(--primary-active);
      border-color: var(--primary-active);
    }

    .btn-primary:disabled {
      color: #fff;
      background: #a0cfff;
      border-color: #a0cfff;
    }

    .btn-accent {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: var(--primary-soft-border);
    }

    .btn-accent:hover:not(:disabled) {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-text-danger {
      color: var(--muted);
      background: transparent;
      border-color: transparent;
    }

    .btn-text-danger:hover:not(:disabled),
    .btn-text-danger:active:not(:disabled) {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: var(--danger-border);
    }

    /* —— 面板 —— */
    .panel {
      margin-bottom: 14px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border-lighter);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
    }

    .panel-title .step {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border-radius: 50%;
    }

    .panel h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .panel-title .count {
      font-size: 13px;
      color: var(--muted);
    }

    .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }

    /* —— 添加图片 —— */
    .dropzone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 22px 16px;
      background: var(--fill);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .dropzone:hover,
    .dropzone:focus-visible,
    .dropzone.is-drag {
      background: var(--primary-soft);
      border-color: var(--primary);
      outline: none;
    }

    .dropzone.is-drag { border-style: solid; }

    .dz-icon {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 10px;
    }

    .dropzone:hover .dz-icon,
    .dropzone.is-drag .dz-icon { background: var(--surface); }

    .dz-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dz-title {
      font-size: 15px;
      font-weight: 600;
    }

    .dz-sub {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .dz-sub b {
      font-weight: 600;
      color: var(--text-regular);
    }

    /* —— 拼接设置 —— */
    .settings {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) auto auto;
      align-items: end;
      gap: 14px 16px;
      margin-top: 14px;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border-lighter);
      border-radius: var(--radius);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field > label,
    .field-label {
      display: block;
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      color: var(--text-regular);
    }

    .field input[type="number"] {
      width: 96px;
      height: 36px;
      padding: 0 10px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }

    .field input[type="color"] {
      width: 48px;
      height: 36px;
      padding: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .scale-explain {
      grid-column: 1 / -1;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-regular);
      background: var(--surface);
      border: 1px solid var(--border-lighter);
      border-radius: var(--radius-sm);
    }

    .scale-explain::before {
      content: "i";
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 16px;
      height: 16px;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      line-height: 1;
      color: #fff;
      background: var(--primary);
      border-radius: 50%;
    }

    .seg {
      display: flex;
      width: 100%;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .seg-opt {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      margin: 0;
      cursor: pointer;
    }

    .seg-opt + .seg-opt { border-left: 1px solid var(--border); }

    .seg-opt input {
      position: absolute;
      width: 0;
      height: 0;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .seg-opt span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      color: var(--text-regular);
      white-space: nowrap;
      user-select: none;
      transition: background-color 0.15s, color 0.15s;
    }

    .seg-opt:hover span { color: var(--primary); }

    .seg-opt input:checked + span {
      color: #fff;
      background: var(--primary);
    }

    .seg-opt input:focus-visible + span {
      outline: 2px solid var(--primary-border);
      outline-offset: -2px;
    }

    /* —— 已添加的图片 —— */
    .thumbs-head { margin: 16px 0 8px; }

    .thumbs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thumbs:empty { display: none; }

    .thumb {
      display: grid;
      grid-template-columns: auto 96px minmax(0, 1fr) auto;
      grid-template-areas: "idx img meta actions";
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border-lighter);
      border-radius: var(--radius);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .thumb:hover { border-color: var(--border); }

    .thumb.is-dragging { opacity: 0.5; }

    .thumb.is-drop-target {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }

    .thumb-index {
      grid-area: idx;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 22px;
      color: var(--muted);
      cursor: grab;
    }

    .thumb-index .grip {
      font-size: 10px;
      line-height: 1;
      letter-spacing: -1px;
    }

    .thumb-index .num {
      font-size: 13px;
      font-weight: 600;
    }

    .thumb-preview {
      grid-area: img;
      display: block;
      width: 96px;
      height: 72px;
      object-fit: cover;
      background: var(--border-lighter);
      border: 1px solid var(--border-lighter);
      border-radius: 6px;
      cursor: zoom-in;
      transition: border-color 0.15s;
    }

    .thumb-preview:hover { border-color: var(--primary); }

    .thumb-meta {
      grid-area: meta;
      min-width: 0;
    }

    .thumb-meta .name {
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thumb-meta .size {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .thumb-meta .scaled { color: var(--primary); }

    .thumb-meta .scaled.is-up { color: var(--warning-text); }

    .thumb-actions {
      grid-area: actions;
      display: flex;
      gap: 4px;
    }

    .thumb-actions .btn-step {
      width: 30px;
      padding: 0;
    }

    /* —— 拼接预览 —— */
    .preview-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-bottom: 12px;
    }

    .preview-head .panel-title { margin: 0; }

    .output-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-regular);
      background: var(--bg);
      border: 1px solid var(--border-lighter);
      border-radius: 13px;
      font-variant-numeric: tabular-nums;
    }

    .output-chip.is-warn {
      color: var(--warning-text);
      background: var(--warning-soft);
      border-color: var(--warning-border);
    }

    .preview-wrap {
      overflow: auto;
      max-height: min(56vh, 600px);
      padding: 16px;
      text-align: center;
      border: 1px solid var(--border-lighter);
      border-radius: var(--radius);
      background:
        linear-gradient(45deg, #ebeef5 25%, transparent 25%),
        linear-gradient(-45deg, #ebeef5 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ebeef5 75%),
        linear-gradient(-45deg, transparent 75%, #ebeef5 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
      background-color: var(--bg);
    }

    .preview-wrap canvas {
      max-width: 100%;
      height: auto;
      vertical-align: middle;
      border-radius: 2px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      cursor: zoom-in;
    }

    .preview-empty {
      display: inline-block;
      padding: 40px 16px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.85);
      border-radius: var(--radius);
    }

    .preview-tip { margin-top: 8px; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background: rgba(15, 23, 42, 0.55);
      touch-action: none;
    }

    .lightbox[hidden] {
      display: none !important;
    }

    .lightbox-panel {
      width: 100%;
      height: 100%;
      max-height: none;
      display: flex;
      flex-direction: column;
      background: transparent;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
    }

    .lightbox-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(30, 41, 59, 0.96);
      color: #e2e8f0;
      font-size: 0.92rem;
      font-weight: 650;
      flex-shrink: 0;
    }

    .lightbox-bar .title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .lightbox-bar .bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .lightbox-bar .zoom-val {
      font-variant-numeric: tabular-nums;
      min-width: 3.2em;
      text-align: right;
      color: #cbd5e1;
      font-size: 0.84rem;
    }

    .lightbox-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      padding: 0;
      text-align: center;
      cursor: grab;
      touch-action: none;
      user-select: none;
      background: transparent;
    }

    .lightbox-body.is-dragging {
      cursor: grabbing;
    }

    .lightbox-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0) scale(1);
      transform-origin: center center;
      will-change: transform;
      line-height: 0;
      backface-visibility: hidden;
    }

    .lightbox-stage img,
    .lightbox-stage canvas {
      display: block;
      max-width: none;
      max-height: none;
      width: auto;
      height: auto;
      border-radius: 4px;
      background: transparent;
      pointer-events: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      /* 减轻超大图合成开销 */
      image-rendering: auto;
    }

    .lightbox-body.is-dragging .lightbox-stage img,
    .lightbox-body.is-dragging .lightbox-stage canvas {
      box-shadow: none;
    }

    /* 避免 display:block 盖过 hidden，露出空白 canvas 白块 */
    .lightbox-stage img[hidden],
    .lightbox-stage canvas[hidden] {
      display: none !important;
    }

    /* —— 标注编辑态 —— */
    body.is-edit {
      overflow: hidden;
      overscroll-behavior: none;
    }
    body.is-edit .compose-only { display: none !important; }
    body:not(.is-edit) .edit-only { display: none !important; }

    .edit-stage {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      overscroll-behavior: none;
      background: #64748b;
      margin: 0;
      touch-action: none;
    }

    .edit-viewport {
      position: absolute;
      top: max(56px, calc(44px + env(safe-area-inset-top)));
      left: 0;
      right: 0;
      bottom: max(88px, calc(72px + env(safe-area-inset-bottom)));
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .edit-viewport.is-panning { cursor: grabbing; }

    .edit-world {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0) scale(1);
      transform-origin: center center;
      will-change: transform;
      line-height: 0;
      backface-visibility: hidden;
    }

    .edit-frame {
      position: relative;
      display: block;
      width: fit-content;
      max-width: none;
      margin: 0;
      line-height: 0;
      border: 2px solid #4096FF;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
      background: #fff;
    }

    .edit-frame canvas {
      display: block;
      max-width: none;
      width: auto;
      height: auto;
      cursor: crosshair;
      touch-action: none;
    }

    .edit-frame[data-tool="pan"] canvas {
      cursor: grab;
    }

    .edit-viewport.is-panning .edit-frame[data-tool="pan"] canvas,
    .edit-frame[data-tool="pan"] canvas:active { cursor: grabbing; }

    .edit-frame[data-tool="select"] canvas {
      cursor: default;
      touch-action: none;
    }

    .edit-frame[data-tool="text"] canvas { cursor: text; }

    .size-badge {
      position: fixed;
      left: 12px;
      top: max(12px, env(safe-area-inset-top));
      z-index: 41;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      line-height: 1.4;
      pointer-events: none;
    }

    .beautify-bar {
      position: fixed;
      left: 50%;
      top: max(10px, env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 41;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    .beautify-bar label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .beautify-bar input[type="range"] { width: 90px; vertical-align: middle; }

    .text-input-pop {
      position: fixed;
      z-index: 45;
      min-width: 160px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 16px;
      outline: none;
      background: rgba(255, 255, 255, 0.95);
    }

    .edit-toolbar {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 16px);
      background: #fff;
      border-radius: 8px;
      padding: 6px 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      border: 1px solid #e4e7ed;
    }

    .edit-toolbar .tb {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      border-radius: 12px;
      cursor: pointer;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      position: fixed;

      align-items: center;

    }

    .lightbox-bar .btn:hover:not(:disabled),
    .lightbox-bar .btn:active:not(:disabled) {
      color: #fff;
      background: #475569;
      border-color: #64748b;
    }

    /* —— 提示条：鼠标停在上面时不消失 —— */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--dock-h) + 20px);
      z-index: 60;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: min(92vw, 440px);
      padding: 10px 16px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-lighter);
      border-radius: var(--radius);
      box-shadow: var(--shadow-pop);
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
      transition: opacity 0.2s, transform 0.2s;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      color: #fff;
      background: #67c23a;
      border-radius: 50%;

    .toast.is-warn {
      background: var(--warning-soft);
      border-color: var(--warning-border);
    }

    .toast.is-warn .toast-icon { background: var(--warning); }

    body.is-edit .toast { bottom: 88px; }

    @media (max-width: 760px) {
      .settings { grid-template-columns: auto auto; justify-content: start; }
      .settings .field-seg { grid-column: 1 / -1; }

    @media (max-width: 640px) {
      .app { padding: 14px 12px calc(var(--dock-h) + 40px); }

      }

          "idx img meta"

      .compose-dock {
        left: 0;
        right: 0;

        padding: 0 6px;
      }

        left: 12px;
        right: 12px;
        max-width: none;
        transform: translateY(12px);
      }
      .toast.show { transform: translateY(0); }
    }

<body>
  <div class="app">
    <header class="page-head compose-only">

    <section class="panel compose-only">

    <div class="compose-dock compose-only">

  <script>
(function () {

  const EXPORT_MAX_EDGE = 8000;
  const PREVIEW_MAX_EDGE = 1400;
  const GAP_MAX = 500;
  const TOAST_MS = 3200;
  const TOAST_WARN_MS = 5200;
  const toastState = { timer: 0, hovering: false, duration: TOAST_MS };
  let images = []; // { id, name, bitmap, width, height, url }
  let previewTimer = 0;
  let fileDragDepth = 0;
  let thumbDragIndex = -1;
  var tool = "pan";
  var drawing = false;
  var startPt = null;
  var currentPath = null;
  var shapes = [];
  var history = [];
  var historyIndex = -1;
  var baseBitmap = null; // ImageBitmap of stitched (current base, after crop/mosaic bake)
  var editScale = 1; // CSS display scale vs canvas pixels
  var editView = {
    scale: 1,
    x: 0,
    y: 0,
    min: 0.05,
    max: 8,
    dragging: false,
    pinching: false,
    lastX: 0,
    lastY: 0,
    rafId: 0,
    spaceDown: false,
    pinchStartDist: 0,
    pinchStartScale: 1,
    pinchWorldX: 0,
    pinchWorldY: 0
  };
  var textPopPending = null;
  var selectedIndex = -1;
  var movingSelection = false;
  var moveLastPt = null;
  var moveDirty = false;
  var textCommitLock = false;

  function getRadioValue(groupEl) {
    var checked = groupEl.querySelector('input[type="radio"]:checked');
    return checked ? checked.value : "";
  }

  function onRadioGroup(groupEl, type, handler) {
    groupEl.querySelectorAll('input[type="radio"]').forEach(function (radio) {
      radio.addEventListener(type, handler);
    });
  }

  const els = {
    dropzone: document.getElementById("dropzone"),
    fileInput: document.getElementById("fileInput"),
    thumbList: document.getElementById("thumbList"),
    thumbsHead: document.getElementById("thumbsHead"),
    imageCount: document.getElementById("imageCount"),
    direction: document.getElementById("direction"),
    scaleMode: document.getElementById("scaleMode"),
    scaleMaxText: document.getElementById("scaleMaxText"),
    scaleMinText: document.getElementById("scaleMinText"),

    bgColor: document.getElementById("bgColor"),

    btnCopyStitchDock: document.getElementById("btnCopyStitchDock"),

    btnLightboxClose: document.getElementById("btnLightboxClose"),
    btnLightboxReset: document.getElementById("btnLightboxReset"),
    editCanvas: document.getElementById("editCanvas"),

    editWorld: document.getElementById("editWorld"),
    sizeBadge: document.getElementById("sizeBadge"),

    cornerVal: document.getElementById("cornerVal"),
    dropShadow: document.getElementById("dropShadow"),
    strokeColor: document.getElementById("strokeColor"),
    strokeWidth: document.getElementById("strokeWidth"),
    textPop: document.getElementById("textPop"),
    toast: document.getElementById("toast"),
    toastIcon: document.getElementById("toastIcon"),
